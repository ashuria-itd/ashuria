 KEV追加とPAN-OS管理面への実悪用、修正版・提供予定を反映。"},{"date":"2026-10-29","type":"事業者対応更新","note":"ヤマハの10/28製品別評価を追加。UTXはSAML認証利用時のみ影響。"}],"relatedVulnerabilities":["v-php-uploadprogress-202610"]},{"id":"v-litellm-202610","product":"LiteLLM配布物対応","title":"LiteLLM 1.107.0：配布物の識別・再構築・秘密情報失効","identifiers":[],"referenceLabel":"1.107.0配布物改ざんへの対応（本件CVE未公表）","kindLabel":"配布物改ざん","published":"2026-10-21","sourceUpdated":"2026-10-22 05:30 JST（10/21 20:30 UTC）","exploitation":"悪性wheel・コンテナの公式配布を提供元が確認","exploitationTone":"red","priority":"対象時間帯の導入・起動履歴とコンテナdigestを優先確認","conditions":"litellm 1.107.0のPyPI wheelと、v1.107.0／latest／main-latest／main-stableの対象イメージ。10/21のUTC表記とJSTを区別し、取得時刻・digest・実行を照合。私有enterpriseレジストリは対象外。","impact":"資格情報窃取と遠隔コード実行用の不正処理。Python起動時に実行される経路があり、pip操作でも再実行され得る。正規ソースタグが正常でも、配布済みバイナリの正常性を保証しない。","fix":"対象環境の隔離・証拠保全を先に行い、担当者が公式の除去・停止手順を確認。正常なイメージ・環境から再構築し、提供元が案内する1.106.2等の明示版を固定する。削除・更新だけで完了とせず、環境が到達できた秘密情報を失効・再発行する。","investigation":"導入・起動・配布履歴、digestと外向き通信、IAMロールやAIプロバイダー鍵、DB・GitHub・レジストリ認証等の利用を調査する。ファイルやマーカーが見つからないことだけで未侵害と判定しない。 AI応答・ログへのトークン混入、ログ閲覧権限、一時リリース権限と管理者による保護回避権限も確認。署名は配布経路の侵害を排除する保証ではない。","bcp":"代替のAIゲートウェイ・接続経路と、鍵変更による業務停止を確認。再構築後の権限・通信・保存・認証・課金を点検し、利用再開を判断する。","tech":"supplier","check":"ck-supplier","relatedIncidents":["inc-9c4b12aa9d"],"classificationNote":"同じ事案の製品対応カード。インシデント公表と重複して独立した攻撃件数へ加算しない。","change":"提供元の攻撃経路仮説を追記。AIログの秘密情報と一時権限を点検。","sources":[{"label":"LiteLLM｜提供元のインシデント報告と個別対処","url":"https://docs.litellm.ai/blog/security-incident-oct-21-2026"},{"label":"GMO Flatt Security｜調査・対応指針","url":"https://flatt.tech/research/posts/litellm-pypi-supply-chain-attack/"}],"sourceNote":"提供元の10/21 20:30 UTC更新を確認。トークンがAI応答・ログへ含まれた状況と権限拡大後の改変経路の説明には調査中の仮説を含む。初期侵入経路や他社製品自体の侵害を断定しない。","checked":"2026-10-23","updated":"2026-10-23","changeType":"続報・補完","history":[{"date":"2026-10-22","type":"新規掲載","note":"LiteLLMの改ざん配布物への対応を追加。対象取得物の照合、再実行を防ぐ初動、正常再構築と到達可能だった秘密情報の失効へ誘導。"},{"date":"2026-10-23","type":"更新前の記録","note":"{\"sourceUpdated\": \"2026-10-22 01:00 JST（10/21 16:00 UTC）\", \"impact\": \"資格情報窃取と遠隔コード実行用の不正処理。Python起動時に実行される経路があり、pip操作でも再実行され得る。正規ソースタグが正常でも、配布済みバイナリの正常性を保証しない。\", \"fix\": \"対象環境の隔離・証拠保全を先に行い、担当者が公式の除去・停止手順を確認。正常なイメージ・環境から再構築し、提供元が案内する1.106.2等の明示版を固定する。削除・更新だけで完了とせず、環境が到達できた秘密情報を失効・再発行する。\", \"conditions\": \"litellm 1.107.0のPyPI wheelと、v1.107.0／latest／main-latest／main-stableの対象イメージ。10/21のUTC表記とJSTを区別し、取得時刻・digest・実行を照合。私有enterpriseレジストリは対象外。\", \"sourceNote\": \"提供元10/21 16:00 UTC更新の調査分を優先。初期の分析資料と対象配布数・対処順に差がある場合、現在の公式個別手順を確認。認証情報の初期窃取方法は調査中。\"}"},{"date":"2026-10-23","type":"続報更新","note":"提供元の攻撃経路仮説を追記。AIログの秘密情報と一時権限を点検。"}]},{"id":"v-oracle-java-202610","product":"Oracle Java","title":"Oracle Javaの10月更新：同梱JRE・JDKと適用担当を確認","identifiers":[],"referenceLabel":"2026年10月CPU（複数CVE・製品別修正表参照）","published":"2026-10-21（IPA・日本時間）","sourceUpdated":"2026-10-21","exploitation":"IPAが早急な更新適用を案内。個別の実悪用は本カードで未確定","exploitationTone":"amber","priority":"採用系列と同梱ランタイムを照合して更新計画へ","conditions":"IPAが示す対象版はJava SE 27、26.0.2、25.0.4.1、21.0.12.1、17.0.20.1、11.0.32.1、8 Update 503／503-perf。これらは修正版の一覧ではない。個別のCVE・構成条件はOracle Java SE Risk Matrixで照合する。","impact":"脆弱性によってアプリケーション異常終了や端末・実行環境の制御等につながり得る。全てのJava構成が同一の影響を受けるという意味ではない。","fix":"Oracleの10月CPUと採用系列の公式ダウンロード・更新案内に従い対応版を適用する。業務製品の同梱JRE／JDKは製品ベンダーの対応版と互換性を照合する。単一の修正版番号を全系列へ適用しない。","investigation":"端末だけでなくサーバー、バッチ、帳票、業務アプリ等の実際のランタイムと導入元を確認。パッチ適用と適用前の不審な実行・通信の調査を区別する。","bcp":"更新担当、製品ベンダーとの分担、互換性試験、再起動と切戻しを決める。Javaの配布元・契約・ライセンス条件も確認する。","tech":"public","check":"ck-public","change":"10/21 IPA注意喚起とOracle CPUを追加。対象版と修正版を区別し、業務製品の同梱Javaと更新担当を点検。","sources":[{"label":"IPA｜Oracle Javaの脆弱性対策","url":"https://www.ipa.go.jp/security/security-alert/2026/1021-jre.html"},{"label":"Oracle｜October 2026 CPU・Java SE Risk Matrix","url":"https://www.oracle.com/security-alerts/cpuoct2026.html"}],"sourceNote":"IPA対象版とOracle CPUの案内を確認。全CVE・全系列の修正番号を本カードへ転記したものではない。採用系列の公式修正表へ誘導する。","checked":"2026-10-22","updated":"2026-10-22","changeType":"新規追加","history":[{"date":"2026-10-22","type":"新規掲載","note":"10/21 IPA注意喚起とOracle CPUを追加。対象版と修正版を区別し、業務製品の同梱Javaと更新担当を点検。"}]},{"id":"v-tomcat-202610","product":"Apache Tomcat","title":"Tomcatの8件の脆弱性：認証設定・通信方式を個別に照合","identifiers":["CVE-2026-103119","CVE-2026-101356","CVE-2026-101296","CVE-2026-93446","CVE-2026-88041","CVE-2026-74049","CVE-2026-74048","CVE-2026-80353"],"published":"2026-10-20（Apache）／10-21（JVN）","sourceUpdated":"2026-10-21（JVN）","exploitation":"確認した資料は修正情報。実悪用の個別確認は未公表・未確定","exploitationTone":"amber","priority":"外部公開・業務アプリ同梱のTomcatを照合","conditions":"9・10.1・11系列でCVEごとに対象範囲が異なる。AJP、HTTP/2非同期処理、非GSSAPIのSASLを使うJNDIRealm、TLS／OpenSSL-FFM／APR等の設定を確認する。製品名だけで全件該当としない。","impact":"リクエスト・レスポンスの混同や情報の混入、特定認証設定の回避、TLS接続障害、Unix Domain Socketのアクセス等。異なる条件を一つの認証不要RCEとしてまとめない。","fix":"系列別のApache公式修正表に従い11.0.27／10.1.61／9.0.123以降の対応版へ更新。業務製品の同梱Tomcatは製品ベンダーの手順を確認する。","investigation":"CVE別の対象版・設定・到達経路を確認し、認証・リクエスト処理・エラー・設定変更のログを保全する。リバースプロキシとアプリの記録を照合する。","bcp":"接続方式、認証、セッション、アプリ互換性を試験し、再起動と切戻し、停止中の代替案内を用意する。","tech":"public","check":"ck-public","change":"JVN10/21の8件を追加。修正先11.0.27／10.1.61／9.0.123とCVE別の設定条件を確認。","sources":[{"label":"JVN｜Tomcatの複数の脆弱性","url":"https://jvn.jp/vu/JVNVU93110597/index.html"},{"label":"Apache｜11系列の修正表","url":"https://tomcat.apache.org/security-11.html"},{"label":"Apache｜10系列の修正表","url":"https://tomcat.apache.org/security-10.html"},{"label":"Apache｜9系列の修正表","url":"https://tomcat.apache.org/security-9.html"}],"sourceNote":"JVNの8件案内とApacheの系列別資料を参照。修正版リリース日、アドバイザリ公開日10/20、JVN公開日10/21を区別。9系列のAPR固有項目等も含み、8件全てが全系列に影響するわけではない。","issues":[{"id":"CVE-2026-103119","conditions":"AJPの大きな非同期書き込み等。対象系列・版は公式表を確認。","status":"個別の実悪用は今回確認していない","fix":"対象系列の公式修正版へ"},{"id":"CVE-2026-101356","conditions":"HTTP/2の非同期Servlet処理。9.0.118〜9.0.122、11.0.22〜11.0.26等。","status":"同上","fix":"9.0.123／11.0.27等。10.1系列は公式表を確認"},{"id":"CVE-2026-101296","conditions":"非GSSAPIのSASLを使うJNDIRealm。正しいPWなしで認証され得る。","status":"同上","fix":"対象系列の公式修正版へ"},{"id":"CVE-2026-80353","conditions":"9系列のAPR connectorでUnix Domain Socketの権限を設定する条件等。","status":"同上","fix":"9.0.123以降。全系列共通としない"}],"checked":"2026-10-22","updated":"2026-10-22","changeType":"新規追加","history":[{"date":"2026-10-22","type":"新規掲載","note":"JVN10/21の8件を追加。修正先11.0.27／10.1.61／9.0.123とCVE別の設定条件を確認。"}]},{"id":"v-plex-202610","product":"Plex Media Server","identifiers":["CVE-2026-96652","CVE-2026-96654","CVE-2026-96655","CVE-2026-96656"],"published":"2026-09-01","sourceUpdated":"2026-10-20","checked":"2026-10-21","updated":"2026-10-21","changeType":"新規追加","priority":"対象の製品・版・構成を照合し、該当時は優先対応","fix":"1.43.3.10861以降。更新だけで完了とせず不正プロセス・ファイル・外向き通信を調査。","change":"未更新の公開サーバーに4件連鎖による認証前コード実行。メーカーが実際の悪用を確認。NAS上の導入も対象照合。","sources":[{"label":"メーカー・JVNの公式案内","url":"https://forums.plex.tv/t/important-security-update-for-plex-media-server-v1-43-2-and-earlier/942319"},{"label":"メーカー・調査実施元の関連資料","url":"https://censys.com/advisory/cve-2026-96652-cve-2026-96654-cve-2026-96655-cve-2026-96656/"}],"title":"Plexの4件の脆弱性連鎖：実際の悪用と残存侵害を確認","exploitation":"メーカーが広範な実際の悪用を確認","exploitationTone":"red","conditions":"Plex Media Server 1.43.3.10861未満。外部から到達可能な未更新サーバーで4件を連鎖させた認証前コード実行。NAS・Docker内の導入も実稼働版を照合する。","impact":"Plexプロセスの権限でコード実行につながる。メーカーは暗号資産採掘プログラムやプロキシの設置を確認。全導入先の侵害を確定した公表ではない。","investigation":"更新とは別に、不審なプロセス・ファイル・外向き通信と資格情報の利用を調査。痕跡を保全し、NAS上の他データへの権限も確認する。","bcp":"正常なバックアップからの復元と、再公開前の版・権限・通信を確認。更新のみで既存侵害が解消したと扱わない。","tech":"public","check":"ck-public","sourceNote":"メーカー初報の表示日は9/1。10/19の悪用確認追記と10/20のCensys技術資料を照合。CVE・悪用情報が全て9/1に公表されたという意味ではない。","history":[{"date":"2026-10-21","type":"新規掲載","note":"未更新の公開サーバーに4件連鎖による認証前コード実行。メーカーが実際の悪用を確認。NAS上の導入も対象照合。"}]},{"id":"v-siemens-ssc-202610","product":"Siemens Software Center","identifiers":["CVE-2026-110936"],"published":"2026-10-15","sourceUpdated":"2026-10-19","checked":"2026-10-21","updated":"2026-10-21","changeType":"新規追加","priority":"対象の製品・版・構成を照合し、該当時は優先対応","fix":"4.0.9.8以降へ。次回起動時の自動更新結果と実稼働版、正規ダウンロード元、不審な同梱DLL・通信を点検。単に製品を未導入でも攻撃者が持ち込む場合がある。","change":"4.0.9.8未満。ローカルDLLサイドローディング。署名付き正規実行ファイルを持ち込む実際の悪用をメーカーが確認。提供元・更新配布経路の侵害は確認されていないと説明。","s を失効したと説明。指定版1.26.13／2.26.13の実際の適用結果と既存侵害を別々に確認。Xserverも10/20に注意喚起。全接続先の調査完了を意味しない。","change":"上記TeamUpdraft続報と連動し指定版1.26.13／2.26.13、実際の提供・旧キー失効の説明、Xserver10/20注意喚起を追加。","history":[{"date":"2026-10-20","type":"新規掲載","note":"接続キーの影響に伴う製品対応を追加。旧キー削除と接続先調査、Vault再接続後の手動バックアップを確認。"},{"date":"2026-10-21","type":"更新前の記録","note":"{\"id\": \"v-updraftcentral-202610\", \"product\": \"TeamUpdraft／UpdraftCentral等\", \"identifiers\": [], \"published\": \"2026-10-19\", \"checked\": \"2026-10-20\", \"updated\": \"2026-10-20\", \"changeType\": \"連携キーへの影響・製品対策\", \"sources\": [{\"label\": \"公式案内・メーカー情報\", \"url\": \"https://teamupdraft.com/blog/security-incident-october-2026/\"}], \"title\": \"TeamUpdraftの接続キー対応：各サイトの旧キーと侵害を確認\", \"referenceLabel\": \"接続キーへの影響（CVEの公表なし）\", \"kindLabel\": \"製品別対応\", \"sourceUpdated\": \"2026-10-20 03:03 JST（10/19 19:03 BST）\", \"exploitation\": \"接続キーへの影響を想定し接続先の調査を要請\", \"exploitationTone\": \"amber\", \"priority\": \"クラウド型UpdraftCentralの接続先とVault・Clone利用を優先確認\", \"conditions\": \"teamupdraft.comアカウントと、クラウド型UpdraftCentral・Vault・Cloneの接続が対象。自己ホスト型Centralは対象外。無料プラグインのみでアカウントがない利用者には本件固有の対応不要と公式が説明。\", \"impact\": \"提供元は顧客DBにアクセスされた可能性を説明。接続キーから接続先WordPressの管理操作が行われ得る。プラグイン本体・公式配布ファイルの改ざんはないとの説明であり、一般的なプラグイン脆弱性のCVEとして扱わない。\", \"fix\": \"公式指定のUpdraftPlus無料版1.26.12／Premium2.26.12以降の提供・適用を確認。10/18 22:00 BST以前のCentral接続を切る更新に加え、各サイトで旧キーを削除し、不審な管理者・プラグイン等を調査、管理者PWを変更してから再接続を判断。teamupdraft.comのPW・2FAも再設定する。\", \"investigation\": \"Centralの鍵失効と、既に接続先で行われた操作の調査を分ける。不審な管理者・通常／MUプラグイン・PHP・定期実行・連携先を点検。Central経由で侵害された可能性があるサイトでは、外部ストレージの許可・鍵も再評価して再認証する。\", \"bcp\": \"Vaultは全接続が解除され新しい認証情報へ切替済みとの公式説明。再接続と手動バックアップ試験を実施し、保存・復元できることを確認。Cloneの新キーも確認し、バックアップ停止中の代替を用意する。\", \"tech\": \"supplier\", \"check\": \"ck-supplier\", \"relatedIncidents\": [\"inc-802064bf02\", \"inc-0e48740f3f\"], \"classificationNote\": \"認証情報・接続キーのインシデントに伴う製品別対応です。関連する利用者事案との因果関係は調査中の評価として扱います。\", \"sourceNote\": \"公式最終更新10/19 19:03 BSTを確認。指定版のリリース説明と、提供時に追記する予告が併存しているため、実際の提供・適用結果を確認する。接続先全ての侵害を確定した発表ではない。\", \"change\": \"接続キーの影響に伴う製品対応を追加。旧キー削除と接続先調査、Vault再接続後の手動バックアップを確認。\"}"},{"date":"2026-10-21","type":"続報・補完","note":"上記TeamUpdraft続報と連動し指定版1.26.13／2.26.13、実際の提供・旧キー失効の説明、Xserver10/20注意喚起を追加。"}]},{"id":"v-chrome-202610","product":"Google Chrome","title":"Chrome 156：10/27更新のセキュリティ詳細52件を追記","identifiers":["CVE-2026-110922","CVE-2026-110913","CVE-2026-110919","CVE-2026-110918","CVE-2026-110917","CVE-2026-110921","CVE-2026-110920","CVE-2026-110916","CVE-2026-110915","CVE-2026-110914","CVE-2026-118306","CVE-2026-118331","CVE-2026-118348","CVE-2026-118344","CVE-2026-118357","CVE-2026-118318","CVE-2026-118350"],"published":"2026-10-15","sourceUpdated":"2026-10-27","checked":"2026-10-29","updated":"2026-10-29","changeType":"続報更新","exploitation":"確認したGoogle公式本文に実悪用確認の記載なし","exploitationTone":"amber","priority":"日常業務で使うブラウザの配信・再起動・実稼働版を優先確認","conditions":"Windows/macOS/LinuxのDesktop Stable 156.0.8078.73/.74等。段階配信のため、更新通知だけでなく再起動後の実稼働版を確認。","impact":"10/27更新は52件のセキュリティ修正。FileSystem、FileAPI、Skia、LayoutのCritical 4件を含む。掲載識別子は公式本文で確認できた主要7件であり、52件すべての固有CVE列挙ではない。","fix":"Windows/macOS 156.0.8078.73/.74、Linux 156.0.8078.73以降の採用チャネル修正版へ更新。","investigation":"更新配信の成功と、再起動後に修正版が稼働していることを区別。管理対象外端末・長時間起動中の端末も棚卸しし、不審な拡張機能・実行や認証異常があればログ保全と端末調査につなげる。","bcp":"更新・再起動の実施時間、業務Webとの互換性、未完了端末の代替手段を確認。管理された修正版への切替と再開条件を決める。","tech":"public","check":"ck-public","sources":[{"label":"Google｜10/27 Stable更新・52件","url":"https://chromereleases.googleblog.com/2026/10/stable-channel-update-for-desktop_0562499947.html"},{"label":"Google｜10/27のStable配信・10月公表一覧","url":"https://chromereleases.googleblog.com/2026/10/"},{"label":"Google｜Desktop Stable更新 10/15","url":"https://chromereleases.googleblog.com/2026/10/stable-channel-update-for-desktop_01886704284.html"},{"label":"Chrome CNA｜CVE-2026-110922","url":"https://cveawg.mitre.org/api/cve/CVE-2026-110922"}],"sourceNote":"10/27公式記事の追記後本文を10/29に確認。Critical 4件を含む52件。悪用確認の記載はない。","change":"10/27記事の追記済みセキュリティ詳細52件を反映。","history":[{"date":"2026-10-19","type":"新規掲載","note":"10/15公表の未掲載分を追加。通常Stableの修正版とチャネルの違い、配信後の再起動・稼働版確認を整理。"},{"date":"2026-10-28","type":"更新前記録","note":"{\"title\": \"Chrome 155の修正10件と再起動後の版確認\", \"sourceUpdated\": \"2026-10-15\", \"conditions\": \"通常Stableの対象版。CVE-2026-110922は155.0.8059.84未満が対象。OS・採用チャネルごとに公式修正版を照合する。Extended Stableは別の版番号を用いる。\", \"fix\": \"通常StableはWindows/macOS 155.0.8059.84/.85、Linux 155.0.8059.84以降の該当修正版へ。Extended Stable等には同じ版番号を要求せず、採用チャネルの修正版を確認する。更新配信後にブラウザを再起動し、実際に動く版を端末側でも確認する。\", \"impact\": \"Prerenderの解放後使用を含む10件。GoogleはCVE-2026-110922をCriticalと評価し、CNAは細工したHTMLによるサンドボックス内の任意コード実行と説明。これだけでサンドボックス外実行まで確認されたとは扱わない。\", \"sources\": [{\"label\": \"Google｜Desktop Stable更新 10/15\", \"url\": \"https://chromereleases.googleblog.com/2026/10/stable-channel-update-for-desktop_01886704284.html\"}, {\"label\": \"Chrome CNA｜CVE-2026-110922\", \"url\": \"https://cveawg.mitre.org/api/cve/CVE-2026-110922\"}], \"sourceNote\": \"メーカー公式本文を2026-10-19（JST）の調査で確認。悪用確認の記載がないことは、悪用が存在しないという保証ではない。\", \"change\": \"10/15公表の未掲載分を追加。通常Stableの修正版とチャネルの違い、配信後の再起動・稼働版確認を整理。\"}"},{"date":"2026-10-28","type":"続報更新","note":"10/27の配信版を補完。10/15のCVE一覧と、10/27記事の詳細追記待ちを区別し、未確認の新規CVEは追加しない。"},{"date":"2026-10-29","type":"続報更新","note":"詳細追記待ちから、52件・Critical 4件の公表へ更新。"}]},{"id":"v-firefox-202610","product":"Mozilla Firefox","title":"Firefox 159・ESR 153.6／115.44の修正と系列別の更新確認","identifiers":["CVE-2026-117860","CVE-2026-117861","CVE-2026-117862","CVE-2026-109705"],"published":"2026-10-13","sourceUpdated":"2026-10-27","checked":"2026-10-28","updated":"2026-10-28","changeType":"続報更新","exploitation":"確認した公式発表に悪用確認の記載なし","exploitationTone":"amber","priority":"日常業務で使うブラウザの配信・再起動・実稼働版を優先確認","conditions":"10/27公表：通常版159、ESR 153.6、ESR 115.44で修正。対象CVEは系列で異なり、表示CVEは代表例。","impact":"Mozillaは3系列ともHighと評価。通常版には同一オリジン制約の回避、サンドボックス回避、権限昇格等を含む。以前掲載の77件は10/13の通常版158の数字で、今回の全件数として使わない。","fix":"採用系列に対応するFirefox 159、ESR 153.6またはESR 115.44へ更新。再起動後の実稼働版と業務Webの動作を確認。","investigation":"更新配信の成功と、再起動後に修正版が稼働していることを区別。管理対象外端末・長時間起動中の端末も棚卸しし、不審な拡張機能・実行や認証異常があればログ保全と端末調査につなげる。","bcp":"更新・再起動の実施時間、業務Webとの互換性、未完了端末の代替手段を確認。管理された修正版への切替と再開条件を決める。","tech":"public","check":"ck-public","sources":[{"label":"Mozilla｜通常版159・MFSA 2026-118","url":"https://www.mozilla.org/en-US/security/advisories/mfsa2026-118/"},{"label":"Mozilla｜ESR 153.6・MFSA 2026-120","url":"https://www.mozilla.org/en-US/security/advisories/mfsa2026-120/"},{"label":"Mozilla｜ESR 115.44・MFSA 2026-119","url":"https://www.mozilla.org/en-US/security/advisories/mfsa2026-119/"}],"sourceNote":"10/27の3系列の公式本文を確認。表示CVEは例示で、系列ごとの全件は出典参照。実悪用確認の公表としては扱わない。","change":"10/13の158の案内から、10/27公表の159・ESR 153.6／115.44へ更新。系列ごとの対象と修正版を区別。","history":[{"date":"2026-10-19","type":"新規掲載","note":"10/13公表の未掲載分を追加。通常版158の77件（最高High）、ESRの系列別照合と再起動後の版確認を整理。"},{"date":"2026-10-28","type":"更新前記録","note":"{\"title\": \"Firefox 158の修正77件と系列別の更新確認\", \"identifiers\": [\"CVE-2026-109705\", \"CVE-2026-109707\", \"CVE-2026-109708\"], \"sourceUpdated\": \"2026-10-13\", \"conditions\": \"Firefox 158で修正される通常版の脆弱性。ESRの対象CVE・修正版は採用系列の公式アドバイザリーを別途照合する。\", \"impact\": \"Mozilla公式に77件のCVEを掲載し、最高評価はHigh。ネットワーク処理等のサンドボックス回避、解放後使用、境界外アクセス等を含む。上記CVEは例示で、全件は公式資料を参照。\", \"fix\": \"通常版はFirefox 158へ更新し、再起動後の実稼働版を確認。ESRは採用系列に対応する公式修正版を別途確認し、通常版の対象CVEや版番号をそのまま転記しない。\", \"sources\": [{\"label\": \"Mozilla｜MFSA 2026-106（Firefox 158）\", \"url\": \"https://www.mozilla.org/en-US/security/advisories/mfsa2026-106/\"}], \"sourceNote\": \"メーカー公式本文を2026-10-19（JST）の調査で確認。悪用確認の記載がないことは、悪用が存在しないという保証ではない。 ESRの個別アドバイザリー・修正版は今回未照合。77件は通常版158の資料の件数。\", \"change\": \"10/13公表の未掲載分を追加。通常版158の77件（最高High）、ESRの系列別照合と再起動後の版確認を整理。\"}"},{"date":"2026-10-28","type":"続報更新","note":"10/13の158の案内から、10/27公表の159・ESR 153.6／115.44へ更新。系列ごとの対象と修正版を区別。"}]},{"id":"v-beyondtrust-202610","product":"BeyondTrust Remote Support","title":"遠隔保守製品の認証前ファイル操作と実際の悪用","identifiers":["CVE-2026-102764"],"published":"2026-10-15","sourceUpdated":"2026-10-16","checked":"2026-10-18","updated":"2026-10-18","changeType":"新規追加","exploitation":"悪用確認の公表あり","exploitationTone":"red","priority":"対象の製品・版・構成を利用する場合に優先確認","conditions":"Remote Support 26.2.3以下。SaaSと自己管理型の提供元・管理者の対応範囲を区別する。","impact":"内部メッセージの送信元検証不備により、未認証の遠隔攻撃者がファイル操作を行える。メーカーは2顧客での悪用を公表。","fix":"自己管理型はBT26-05-RSを適用。24.3.1〜26.2.3用のパッチであり、それより古い版は対応版へ更新してから適用する。SaaSは10月9日までに適用済み。自動更新の設定と実際の適用結果を確認。","investigation":"パッチ適用と侵害有無は分けて確認。メーカーと調査元の案内に沿い、保守接続・設定・認証・周辺ログを保全して照合する。","bcp":"保守接続を止めた場合の障害対応、承認された代替接続、再開条件を決める。","tech":"public","check":"ck-public","sources":[{"label":"BeyondTrust｜BT26-05対象条件・パッチ","url":"https://www.beyondtrust.com/trust-center/security-advisories/bt26-05"},{"label":"BeyondTrust｜悪用確認・経緯","url":"https://www.beyondtrust.com/blog/entry/bt26-05"}],"sourceNote":"メーカー・公的機関・調査実施元の本文を2026-10-18に確認。対策と悪用状況は情報更新日時点の整理。業務継続の観点は編集上の検討案。","change":"26.2.3以下、BT26-05-RS適用。古い版は更新後パッチ。SaaS側適用済み。悪用確認は公式ブログbt26-05。","history":[{"date":"2026-10-18","type":"新規掲載","note":"26.2.3以下、BT26-05-RS適用。古い版は更新後パッチ。SaaS側適用済み。悪用確認は公式ブログbt26-05。"}]},{"id":"v-ivanti-202610","product":"Ivanti Connect Secure","title":"VPNへのゼロデイ侵入と内部の認証情報への影響","identifiers":["CVE-2026-104935"],"published":"2026-10-13","sourceUpdated":"2026-10-13","checked":"2026-10-18","updated":"2026-10-18","changeType":"新規追加","exploitation":"実攻撃を調査元が確認","exploitationTone":"red","priority":"対象の製品・版・構成を利用する場合に優先確認","conditions":"Connect Secureのメーカー公表対象版。調査元は当時の最新修正版22.8R2.4への侵入も観測。製品名だけでなく系列と提供パッチを照合する。","impact":"認証回避・コード実行を起点に内部へ侵入。調査元はAD・LDAP・LAPS・BitLocker回復キー等へのアクセス、ログ削除を含む活動を報告。","fix":"メーカーの系列別更新を確認して適用する。調査元が10月13日に記載した連鎖攻撃には別の権限昇格問題も含まれ、その時点では未修正と説明されている。更新だけで全ての残存アクセスが消えると判断しない。","investigation":"Integrity Checkerで異常が出ないだけでは未侵害を確定できない。機器と周辺認証ログを照合し、内部資格情報の露出・再発行範囲を専門家と判断する。","bcp":"VPN停止中の遠隔業務・保守接続を決める。認証基盤の影響が疑われる場合の連絡・管理経路も確保する。","tech":"public","check":"ck-public","sources":[{"label":"Volexity｜実侵害の調査・対応","url":"https://www.volexity.com/blog/2026/10/13/a-series-of-unauthenticated-events-chained-exploitation-of-ivanti-connect-secure-zero-days/"},{"label":"Ivanti｜公式セキュリティアドバイザリー","url":"https://hub.ivanti.com/s/article/Security-Advisory-Ivanti-Connect-Secure-CVE-2026-104935"}],"sourceNote":"メーカー・公的機関・調査実施元の本文を2026-10-18に確認。対策と悪用状況は情報更新日時点の整理。業務継続の観点は編集上の検討案。","change":"認証回避とRCEの攻撃確認。メーカー最新版適用と侵害調査、認証情報への影響確認。検査ツール陰性だけで未侵害としない。別の連鎖権限昇格問題は10/13時点未修正と研究元説明。","history":[{"date":"2026-10-18","type":"新規掲載","note":"認証回避とRCEの攻撃確認。メーカー最新版適用と侵害調査、認証情報への影響確認。検査ツール陰性だけで未侵害としない。別の連鎖権限昇格問題は10/13時点未修正と研究元説明。"}]},{"id":"v-panos-202610","product":"Palo Alto Networks PAN-OS","title":"PAN-OS：管理面のコード実行とGlobalProtectの認証回避","identifiers":["CVE-2026-0322","CVE-2026-0257"],"published":"2026-10-14","sourceUpdated":"2026-10-20（Unit 42）","checked":"2026-10-21","updated":"2026-10-21","changeType":"続報・補完","exploitation":"限定的な悪用を確認","exploitationTone":"red","priority":"対象の製品・版・構成を利用する場合に優先確認","conditions":"CVEごとに異なる。0322は管理面への到達と高権限認証が必要。0257はGlobalProtectポータル／ゲートウェイで認証オーバーライドcookieと特定の証明書設定を使用する構成を確認。","impact":"0322は認証後のroot権限コード実行。0257はVPNへの不正接続を許す認証回避で、MFAを使用する構成も条件を照合する。Prisma Accessの扱いはCVE別に異なる。","fix":"CVE別・系列別・保守版別の公式修正表を照合して更新。0257にはPAN-OSとPrisma Accessの対象系列がある。0322は管理面を信頼する内部IP・踏み台へ制限する。","investigation":"VPN認証と設定変更、vCenter・ESXi・ドメイン管理・Veeamバックアップへの接続を調査。Unit 42は一部観測事例で仮想ディスク経由の資格情報取得等を報告しており、全事例の経路と一般化しない。","bcp":"VPNと管理面の公開範囲を確認し、仮想化基盤・バックアップまで調査範囲を検討。更新・鍵変更と正常性確認、代替の管理経路を準備する。","tech":"public","check":"ck-public","sources":[{"label":"Palo Alto Networks｜対象版・修正・悪用状況","url":"https://security.paloaltonetworks.com/CVE-2026-0322"},{"label":"今回確認した公式・調査資料","url":"https://unit42.paloaltonetworks.com/active-exploitation-of-pan-os-cve-2026-0257/"},{"label":"今回確認した公式・調査資料","url":"https://security.paloaltonetworks.com/CVE-2026-0257"}],"sourceNote":"0322の既存記録は10/18確認分を保持。0257は5/13初公表、6/3更新のメーカー資料と10/19〜20のUnit 42分析を今回補完。全CVEが10月に新規公表されたという意味ではない。","change":"既存CVE-2026-0322を保持しGlobalProtectのCVE-2026-0257を追加。5/13公開・10/19〜20のUnit42技術分析を補完。認証オーバーライドcookieと特定証明書設定の条件を照合。VPNからvCenter・仮想化層・バックアップへの侵害を点検。CVE別の条件・修正版を混ぜない。","history":[{"date":"2026-10-18","type":"新規掲載","note":"高権限の認証と管理面到達が前提。管理面制限と系列別修正版。少数悪用確認。Cloud NGFW・Prisma Access除外。"},{"date":"2026-10-21","type":"更新前の記録","note":"{\"id\": \"v-panos-202610\", \"product\": \"Palo Alto Networks PAN-OS\", \"title\": \"管理インターフェースからの認証後コード実行\", \"identifiers\": [\"CVE-2026-0322\"], \"published\": \"2026-10-14\", \"sourceUpdated\": \"2026-10-15\", \"checked\": \"2026-10-18\", \"updated\": \"2026-10-18\", \"changeType\": \"新規追加\", \"exploitation\": \"限定的な悪用を確認\", \"exploitationTone\": \"red\", \"priority\": \"対象の製品・版・構成を利用する場合に優先確認\", \"conditions\": \"メーカー公表対象版のPAN-OS。管理インターフェースへの到達と高い管理権限の認証が前提。Cloud NGFW・Prisma Accessは対象外。\", \"impact\": \"認証された高権限管理者による操作から、root権限でのコード実行に至る可能性。未認証のVPN通信だけで成立する問題とは区別する。\", \"fix\": \"系列別の公式修正版を照合して更新。管理インターフェースを信頼できる内部IP・管理用踏み台等へ制限する。\", \"investigation\": \"不審な管理者認証・設定変更と周辺ログを確認。機器の更新と資格情報の不正利用の調査を別に実施する。\", \"bcp\": \"更新・管理面制限による運用影響と、緊急時にも使える管理経路を確認。\", \"tech\": \"public\", \"check\": \"ck-public\", \"sources\": [{\"label\": \"Palo Alto Networks｜対象版・修正・悪用状況\", \"url\": \"https://security.paloaltonetworks.com/CVE-2026-0322\"}], \"sourceNote\": \"メーカー・公的機関・調査実施元の本文を2026-10-18に確認。対策と悪用状況は情報更新日時点の整理。業務継続の観点は編集上の検討案。\", \"change\": \"高権限の認証と管理面到達が前提。管理面制限と系列別修正版。少数悪用確認。Cloud NGFW・Prisma Access除外。\"}"},{"date":"2026-10-21","type":"続報・補完","note":"既存CVE-2026-0322を保持しGlobalProtectのCVE-2026-0257を追加。5/13公開・10/19〜20のUnit42技術分析を補完。認証オーバーライドcookieと特定証明書設定の条件を照合。VPNからvCenter・仮想化層・バックアップへの侵害を点検。CVE別の条件・修正版を混ぜない。"}],"issues":[{"id":"CVE-2026-0322","conditions":"メーカー公表対象版のPAN-OS。管理インターフェースへの到達と高い管理権限の認証が前提。Cloud NGFW・Prisma Accessは対象外。","status":"限定的な悪用確認（既存10/18確認記録）","fix":"公式0322の系列別修正版。Cloud NGFW・Prisma Access対象外。"},{"id":"CVE-2026-0257","conditions":"GlobalProtectのポータル／ゲートウェイ、認証オーバーライドcookieと特定証明書設定。Cloud NGFW・Panoramaは対象外。Prisma Accessは対象系列あり。","status":"Unit 42が実際の悪用を分析","fix":"公式0257の系列・保守版別修正表を照合。単一の修正版番号を全系列へ適用しない。"}]},{"id":"v-atlassian-202610","product":"Atlassian Data Center製品群","title":"複数製品の認証前ファイルアクセス","identifiers":["CVE-2026-21589"],"published":"2026-10-05","sourceUpdated" KEV掲載を確認","exploitationTone":"red","priority":"対象の製品・版・構成を利用する場合に優先確認","conditions":"FortiOS等のメーカー公表対象製品・版。認証済み管理者のCLI読書権限等が前提で、未認証の初期侵入脆弱性とは区別する。","impact":"パストラバーサルによる任意ファイル操作。Unit 42は、別のFortiManager脆弱性を起点に構成・鍵を取得した攻撃で、本CVEとメモリー上のPEERSTITCHが使われたと報告。","fix":"Fortinetの製品・系列別対象表で修正状況を確認。集中管理経路を制限し、管理基盤が侵害された場合は管理先の認証情報・証明書・鍵の更新範囲も判断する。","investigation":"設定・管理者・VPN認証・ログの欠落等と、調査元の痕跡情報を照合。500台超は設定等の流出対象であり、全ての管理先ネットワークの侵害確認ではない。","bcp":"管理基盤を停止しても機器を安全に管理できる代替手段と、鍵の再発行・再登録の順序を検討。","tech":"public","check":"ck-identity","sources":[{"label":"Fortinet｜公式対象版・修正情報","url":"https://fortiguard.fortinet.com/psirt/FG-IR-26-122"},{"label":"Unit 42｜実侵害の調査","url":"https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"},{"label":"CISA｜悪用確認リスト（公式JSON・10/16版確認）","url":"https://raw.githubusercontent.com/cisagov/kev-data/main/known_exploited_vulnerabilities.json"}],"sourceNote":"メーカー・公的機関・調査実施元の本文を2026-10-18に確認。対策と悪用状況は情報更新日時点の整理。業務継続の観点は編集上の検討案。","change":"既存公表の管理者認証後のパストラバーサル。10/16 KEV追加。FortiManager侵害・設定/秘密情報窃取と連鎖した実攻撃をUnit42が報告。500台超は設定情報対象で全台侵害とはしない。メーカー対象版・修正を確認。","history":[{"date":"2026-10-18","type":"新規掲載","note":"既存公表の管理者認証後のパストラバーサル。10/16 KEV追加。FortiManager侵害・設定/秘密情報窃取と連鎖した実攻撃をUnit42が報告。500台超は設定情報対象で全台侵害とはしない。メーカー対象版・修正を確認。"}]},{"id":"v-gitlab-202610","product":"GitLab CE/EE","title":"CI/CD処理の認証前コード実行を含む重大修正","identifiers":["CVE-2026-97229","CVE-2026-16301","CVE-2026-14814","CVE-2026-96893"],"published":"2026-10-12","sourceUpdated":"2026-10-12","checked":"2026-10-18","updated":"2026-10-18","changeType":"新規追加","exploitation":"掲載した公式発表に悪用確認の記載なし","exploitationTone":"amber","priority":"対象の製品・版・構成を利用する場合に優先確認","conditions":"97229は19.2〜19.2.8未満、19.3〜19.3.5未満、19.4〜19.4.2未満。併載する別CVEは対象開始版・権限条件が異なるため、個別の公式表を照合。","impact":"CI/CD正規表現コンパイラーの問題は認証前のコード実行につながる可能性があり、CVSS 10.0。保護ブランチのパイプライン権限、変数、AIエージェント命令等の問題も同時修正。","fix":"自己管理型は系列に応じ19.4.2／19.3.5／19.2.8へ更新。GitLab.comとDedicatedは対応済み。データベース移行と正式な更新経路を確認。","investigation":"不審なパイプライン実行、権限・トークン・変数等への影響を調査し、必要時は秘密情報 te":"脆弱性情報・予防措置に伴うサービス影響として掲載。今回の告知だけを根拠に被害インシデント件数へ加算していません。","providerNote":"「調査中」は影響の確定ではなく、「公式公表未確認」は影響なしを意味しません。「既存サービスは稼働継続」という説明も、脆弱性の影響なしの公表とは区別します。 行ごとの公式情報時点と本文確認日を区別。さくらのクラウドの作成再開は全ホスト修正完了を意味しない。","sources":[{"label":"Linux CNA｜CVE公式レコード","url":"https://raw.githubusercontent.com/CVEProject/cvelistV5/main/cves/2026/99xxx/CVE-2026-99999.json"},{"label":"AWS｜影響対象とホスト側の修正","url":"https://aws.amazon.com/security/security-bulletins/2026-137-aws/"},{"label":"さくら｜対象サービス・影響調査","url":"https://www.sakura.ad.jp/corporate/information/announcements/2026/10/16/1968226051/"},{"label":"ConoHa｜影響調査の公式発表","url":"https://vps.conoha.jp/news/?ap=2015054877&btn_id=top--news_news"},{"label":"今回確認した公式・調査資料","url":"https://cloud.sakura.ad.jp/news/2026/10/16/cve-2026-99999/"}],"providers":[{"id":"sakura-cloud","provider":"さくらのクラウド","shortLabel":"さくらのクラウド","status":"新規作成再開・メンテナンス予定","tone":"amber","sourceAsOf":"2026-10-20","checked":"2026-10-21","finding":"10/20に新規プロジェクト作成を再開。全機能を通常利用可能と説明。メンテナンスは順次実施予定で、対象利用者へ約1週間前から案内する方針。","action":"作成制限の解除と脆弱性対策の完了を分け、対象リソース・保守日時・停止影響とバックアップを確認する。","sources":[{"label":"さくらのクラウド｜利用制限・対応状況","url":"https://cloud.sakura.ad.jp/news/2026/10/16/cve-2026-99999/"}]},{"id":"sakura-vps","provider":"さくらのVPS","status":"調査中・一部機能制限","tone":"amber","sourceAsOf":"2026-10-16 18:10 JST更新","checked":"2026-10-21","finding":"全リージョンで新規申込、スケールアップ、持ち込みISOインストール、さくらのクラウドへの移行機能を停止。既存契約は通常稼働と説明。再開時期未定。","action":"増設・移行が必要な業務と代替方法を確認。今後のホスト保守の案内も確認。","sources":[{"label":"さくらのVPS｜停止機能・対応状況","url":"https://vps.sakura.ad.jp/contents/info/202610-pendingapply/"}]},{"id":"sakura-rental","provider":"さくらのレンタルサーバ・メール専用・マネージドサーバ","status":"調査中・新規受付停止","tone":"amber","sourceAsOf":"2026-10-16","checked":"2026-10-21","finding":"告知記載のレンタル、メール専用、マネージドの各対象プランで新規申込を停止。既存契約は通常稼働と説明。再開時期未定。","action":"Web・メールの契約プランを告知の対象一覧と照合し、新規契約が必要な復旧・切替計画への影響を確認。","sources":[{"label":"さくら｜レンタル・メール・マネージドの受付停止","url":"https://help.sakura.ad.jp/notification/n-2696/"}]},{"id":"sakura-gpu","provider":"高火力DOK・高 VE-2026-99999を追加。さくら・ConoHa等の公表状況、利用制限、ホスト側の対策と業務継続の確認事項を整理。\", \"sourceNote\": \"Linux CNA、AWS、さくら、ConoHaの本文と、Xserverの公開ニュース・障害・保守情報を確認。下表は確認日時点の公表状況。配布HTMLには続報が自動反映されない。\", \"classificationNote\": \"脆弱性情報・予防措置に伴うサービス影響として掲載。今回の告知だけを根拠に被害インシデント件数へ加算していません。\", \"providerNote\": \"「調査中」は影響の確定ではなく、「公式公表未確認」は影響なしを意味しません。「既存サービスは稼働継続」という説明も、脆弱性の影響なしの公表とは区別します。\", \"sources\": [{\"label\": \"Linux CNA｜CVE公式レコード\", \"url\": \"https://raw.githubusercontent.com/CVEProject/cvelistV5/main/cves/2026/99xxx/CVE-2026-99999.json\"}, {\"label\": \"AWS｜影響対象とホスト側の修正\", \"url\": \"https://aws.amazon.com/security/security-bulletins/2026-137-aws/\"}, {\"label\": \"さくら｜対象サービス・影響調査\", \"url\": \"https://www.sakura.ad.jp/corporate/information/announcements/2026/10/16/1968226051/\"}, {\"label\": \"ConoHa｜影響調査の公式発表\", \"url\": \"https://vps.conoha.jp/news/?ap=2015054877&btn_id=top--news_news\"}], \"providers\": [{\"id\": \"sakura-cloud\", \"provider\": \"さくらのクラウド\", \"shortLabel\": \"さくらのクラウド\", \"status\": \"調査中・一部機能制限\", \"tone\": \"amber\", \"sourceAsOf\": \"2026-10-16\", \"checked\": \"2026-10-17\", \"finding\": \"新規プロジェクト作成を一時停止。既存プロジェクトは利用継続でき、今回の作成停止による既存リソースの稼働への影響はないと説明。ホスト保守を実施する可能性あり。\", \"action\": \"プロジェクト新設を伴う構築・復旧計画と、保守対象・停止予定を確認。新規プロジェクトが必要な専用サーバPHY・高火力PHYの申込にも制約。\", \"sources\": [{\"label\": \"さくらのクラウド｜利用制限・対応状況\", \"url\": \"https://cloud.sakura.ad.jp/news/2026/10/16/cve-2026-99999/\"}]}, {\"id\": \"sakura-vps\", \"provider\": \"さくらのVPS\", \"status\": \"調査中・一部機能制限\", \"tone\": \"amber\", \"sourceAsOf\": \"2026-10-16 18:10 JST更新\", \"checked\": \"2026-10-17\", \"finding\": \"全リージョンで新規申込、スケールアップ、持ち込みISOインストール、さくらのクラウドへの移行機能を停止。既存契約は通常稼働と説明。再開時期未定。\", \"action\": \"増設・移行が必要な業務と代替方法を確認。今後のホスト保守の案内も確認。\", \"sources\": [{\"label\": \"さくらのVPS｜停止機能・対応状況\", \"url\": \"https://vps.sakura.ad.jp/contents/info/202610-pendingapply/\"}]}, {\"id\": \"sakura-rental\", \"provider\": \"さくらのレンタルサーバ・メール専用・マネージドサーバ\", \"status\": \"調査中・新規受付停止\", \"tone\": \"amber\", \"sourceAsOf\": \"2026-10-16\ 響有無・対策状況・保守予定を問い合わせる。他の受付変更・障害・保守を本CVEに起因すると推定しない。\", \"sources\": [{\"label\": \"Xserver｜公式ニュース確認先\", \"url\": \"https://www.xserver.ne.jp/support/news.php\"}, {\"label\": \"Xserver｜障害・メンテナンス確認先\", \"url\": \"https://www.xserver.ne.jp/support/information.php\"}, {\"label\": \"XServer VPS｜公式ニュース確認先\", \"url\": \"https://vps.xserver.ne.jp/support/news.php\"}, {\"label\": \"XServer VPS｜障害情報確認先\", \"url\": \"https://vps.xserver.ne.jp/support/information.php\"}, {\"label\": \"XServer VPS｜メンテナンス確認先\", \"url\": \"https://vps.xserver.ne.jp/support/maintenance.php\"}]}, {\"id\": \"aws-managed\", \"provider\": \"AWS管理のEC2・Lambda・Fargate\", \"status\": \"影響なしの公表\", \"tone\": \"teal\", \"sourceAsOf\": \"2026-10-15 10:30 PDT公表\", \"checked\": \"2026-10-17\", \"finding\": \"AWS管理の対象サービスは影響を受けず、利用者の対応は不要と公表。\", \"action\": \"自ら管理する仮想化環境がある場合は、下段の条件を別途照合。\", \"sources\": [{\"label\": \"AWS｜影響対象とホスト側の修正\", \"url\": \"https://aws.amazon.com/security/security-bulletins/2026-137-aws/\"}]}, {\"id\": \"self-managed\", \"provider\": \"利用者が自ら管理するKVM・virtio-net等の仮想化環境\", \"status\": \"対象構成で要対応\", \"tone\": \"amber\", \"sourceAsOf\": \"2026-10-15 10:30 PDT公表（AWS）\", \"checked\": \"2026-10-17\", \"finding\": \"AWSは、未修正の対象カーネルを使う自己管理ホストを確認対象として案内。\", \"action\": \"ホストOSのベンダー案内を照合し、該当時は修正を適用・再起動。サービスの利用者とホスト管理者の責任を確認。\", \"sources\": [{\"label\": \"AWS｜影響対象とホスト側の修正\", \"url\": \"https://aws.amazon.com/security/security-bulletins/2026-137-aws/\"}]}]}"},{"date":"2026-10-21","type":"続報・補完","note":"さくらのクラウドは10/20に新規プロジェクト作成を再開し機能は通常利用可能、メンテナンスは順次予定。VPS・レンタル等の停止範囲と区別。総合告知10/20 19:15追記。ConoHa公式の情報時点は10/16 21時のままで調査中、Xserver本CVE公式公表は確認できず。WP接続キー注意喚起をLinux関連被害と誤記しない。"}]},{"id":"v-siteguard-202610","product":"SiteGuard Server Edition","title":"統計機能のOSコマンドインジェクション","identifiers":["CVE-2026-106931"],"published":"2026-10-14","sourceUpdated":"2026-10-14","checked":"2026-10-17","exploitation":"悪用確認の公表あり","priority":"該当時は優先確認","conditions":"Ver2.20以降で統計機能が有効。Apache・Nginx・IIS版はVer8.00 Update5未満、FreeBSD版はVer7.00 Update6未満が対象。IIS版Ver3.10〜Ver4.00 Update4は除外。","impact":"サーバー上で高い権限のコマンド実行につながる可能性。","fix":"修正版への更新または提供パッチ。暫定回避は統計機能の無効化。実施手順・例外はメーカー資料で照合する。","investigation":"更新で痕跡が失われる可能性が案内されている。診断情報の保全方法を先に確認する。","bcp":"WAF等の設定変更が公開サービスへ与える影響と切戻しを確認する。","tech":"public","sources":[{"label":"JPCERT/CC｜対象・対策・保全時の注意","url":"https://www.jpcert.or.jp/at/2026/at260032.html"},{"label":"メーカー案内（JPCERTから参照）","url":"https://www.eg-secure.co.jp/siteguard/news/alert-202610-1"}]},{"id":"v-ms-202610","product":"Microsoft製品","title":"2026年10月のセキュリティ更新","identifiers":["CVE-2026-96951"],"published":"2026-10-14","sourceUpdated":"2026-10-14","checked":"2026-10-17","exploitation":"掲載CVEについて悪用確認の公表あり","priority":"該当時は優先確認","conditions":"Windows等の月例更新対象。掲載CVEはWindowsシェルのセキュリティ機能バイパス。対象エディション・ビルド・KBはMSRCで照合する。","impact":"月例には複数の脆弱性を含む。掲載CVEだけで全製品の影響を判断しない。","fix":"配布状況、適用結果、再起動の要否を確認し、検証と業務調整のうえ更新する。","investigation":"悪用対象の機能を利用する端末について、製品別の公式案内に沿って確認する。","bcp":"重要端末・サーバーの更新順と再起動時間を調整する。","tech":"public","sources":[{"label":"JPCERT/CC｜2026年10月の更新","url":"https://www.jpcert.or.jp/at/2026/at260031.html"},{"label":"MSRC｜掲載CVE（JPCERTから参照）","url":"https://msrc.microsoft.com/update-guide/vulnerability/CVE-2026-96951"}]},{"id":"v-netscaler-202609","product":"NetScaler ADC / Gateway","title":"複数の脆弱性と侵害調査","identifiers":["CVE-2026-88771","CVE-2026-88772","CVE-2026-88779","CVE-2026-107406"],"published":"2026-09-28","sourceUpdated":"2026-10-09","checked":"2026-10-18","exploitation":"悪用状況はCVEごとに異なる","priority":"該当時は優先確認","conditions":"通常版14.1-73.37未満／13.1-64.23未満、FIPS版等にも対象あり。88771は既定を含む構成、88772はDTLS有効時。クラウド管理サービスとの責任分界も確認。 追加88779・107406はSAML SP／IdPを用いるGateway／AAA等の構成・版が条件。CVEごとの対象条件は下表と公式表で照合。","impact":"既存88771／88772のコード実行等に加え、88779のサービス妨害、107406のコード実行・サービス妨害の可能性。全CVEで同じ構成・悪用状況ではない。","fix":"追加107406は通常版14.1-73.46／13.1-64.29等の系列別修正版を確認。FIPS等は別の公式表に従う。従前の88771／88772対策版だけでは追加2件の対処完了としない。","investigation":"88779は標的型のDoS悪用をメーカーが確認。107406は当該メーカー発表時点では悪用を把握していないと説明。設定・SAML利用・機器と周辺ログを公式情報と照合する。","bcp":"VPN停止時の遠隔業務・保守と、安全な代替接続を検討する。","tech":"public","sources":[{"label":"JPCERT/CC｜対象・対策・調査","url":"https://www.jpcert.or.jp/at/2026/at260029.html"},{"label":"メーカー案内（JPCERTから参照）","url":"https://support.citrix.com/support-home/kbsearch/article?articleNumber=CTX697096"},{"label":"Citrix｜88779の条件・DoS悪用確認","url":"https://community.citrix.com/techzone-blogs/110_security-updates/understanding-and-addressing-cve-2026-88779-in-citrix-netscaler-adc-and-citrix-netscaler-gateway/"},{"label":"Citrix｜107406の条件・対処","url":"https://community.citrix.com/techzone-blogs/110_security-updates/protecting-customers-immediate-guidance-for-cve-2026-107406-in-netscaler-adc-and-netscaler-gateway-r1631/"},{"label":"NetScaler CNA｜107406公式CVEレコード","url":"https://raw.githubusercontent.com/CVEProject/cvelistV5/main/cves/2026/107xxx/CVE-2026-107406.json"}],"updated":"2026-10-18","changeType":"続報・追加","exploitationTone":"amber","change":"SAML構成に関するCVE-2026-88779・107406を追加。CVE別の悪用状況と後続修正版を整理。","sourceNote":"既存2件はJPCERT/CCを10/17に確認。追加2件はCitrix公式解説・CNAレコードを10/18に確認。悪用未把握の記載は当該発表時点の情報。","issues":[{"id":"CVE-2026-88771","conditions":"既定を含む対象版・構成","status":"悪用確認の公表あり","fix":"従前の公式表を照合。後続CVEも確認。"},{"id":"CVE-2026-88772","conditions":"DTLS有効等の対象構成","status":"公式の最新状況を確認","fix":"従前の公式表を照合。後続CVEも確認。"},{"id":"CVE-2026-88779","conditions":"SAML SP／IdPの対象構成・版","status":"DoSの標的型悪用を確認","fix":"通常版14.1-73.41／13.1-64.28等。後続107406も確認。"},{"id":"CVE-2026-107406","conditions":"SAML構成・系列・版により対象が異なる","status":"当該公式発表時点では悪用未把握","fix":"通常版14.1-73.46／13.1-64.29等。FIPS等は公式表。"}]},{"id":"v-f5-202609","product":"F5 BIG-IP APM","title":"OAuth構成でのヒープバッファオーバーフロー","identifiers":["CVE-2026-94127"],"published":"2026-09-24","sourceUpdated":"2026-09-24","checked":"2026-10-17","exploitation":"悪用確認の公表あり","priority":"該当時は優先確認","conditions":"OAuth Authorization Server構成で、APM access policyとOAuth profileを設定。対象は21.1.0、17.5.0〜17.5.1、17.1.0〜17.1.3。","impact":"未認証のリモートコード実行につながる可能性。","fix":"公式の修正ホットフィックスを確認。適用困難時のiRuleは影響を確認して実施する。","investigation":"OAuth失敗の急増、APM・監査ログやコアファイル等を公式調査項目と照合する。","bcp":"認証・接続サービスの停止に備え、代替手段と再開条件を確認する。","tech":"public","sources":[{"label":"JPCERT/CC｜条件・対策・検出","url":"https://www.jpcert.or.jp/at/2026/at260028.html"},{"label":"メーカー案内（JPCERTから参照）","url":"https://my.f5.com/manage/s/article/K000162605"}]},{"id":"v-cisco-202609","product":"Cisco Secure Email Gateway","title":"メール処理に関する複数脆弱性と侵害調査","identifiers":["CVE-2026-76461","CVE-2026-76519"],"published":"2026-09-15","sourceUpdated":"2026-10-14","checked":"2026-10-18","exploitation":"悪用確認の公表あり","priority":"該当時は優先確認","conditions":"AsyncOS 16.5系は16.5.0-780未満、16.0系は16.0.4-302未満、15.5系以前は15.5.5-014未満。機種・版は公式表で確認する。 76519はAMP File Reputationを有効にした該当メールポリシーと、Content Scanner Tools 25.3.0.5525未満が条件。","impact":"細工されたメールの処理を通じ、高い権限のコマンド実行に至る可能性。 76519は細工した添付を処理することで、未認証の遠隔攻撃者によるファイル書込み・root権限での実行につながる。","fix":"修正版へアップグレード。公式に回避策は案内されていない。 76519はContent Scanner Tools 25.3.0.5525以降への更新（再起動不要）または対応AsyncOSを確認。クラウド版は提供元が更新を実施。","investigation":"侵害が疑われる場合は更新前にCisco TACと証拠保全を相談。侵害済み仮想機は公式の再構築・設定再利用の制限・資格情報更新の案内を確認する。クラスタ内の全機器を確認対象とし、更新だけで安全を確定しない。","bcp":"メール停止時の連絡経路、滞留メールの扱い、代替運用を確認する。","tech":"public","sources":[{"label":"JPCERT/CC｜対象・対策・調査","url":"https://www.jpcert.or.jp/at/2026/at260027.html"},{"label":"メーカー案内（JPCERTから参照）","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX"},{"label":"Cisco｜76519の条件・更新・侵害対応","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"}],"updated":"2026-10-18","changeType":"続報・追加","change":"CVE-2026-76519を追加。AMP機能・スキャナー版の対象条件、添付経由の悪用、更新と侵害調査を追記。","sourceNote":"既存76461はJPCERT/CCを10/17に確認。追加76519はCisco公式本文を10/18に確認。2件の成立条件・対策を分けて確認する。","issues":[{"id":"CVE-2026-76461","conditions":"AsyncOSの系列別対象版（従前のSQLインジェクション）","status":"悪用確認の公表あり","fix":"AsyncOS修正版。既存のJPCERT/CC・Cisco表を照合。"},{"id":"CVE-2026-76519","conditions":"AMP File Reputationの該当設定＋Content Scanner Tools 25.3.0.5525未満","status":"悪用確認の公表あり","fix":"Content Scanner Tools 25.3.0.5525以降等。侵害疑い時は先に保全を相談。"}]},{"id":"v-brotli-202610","product":"Brotli C言語実装および同梱製品","title":"Brotli境界外書き込み：Node.js以外の同梱製品も棚卸し","identifiers":["CVE-2026-111497"],"published":"2026-10-21","sourceUpdated":"2026-10-27","updated":"2026-10-28","checked":"2026-10-28","changeType":"製品・事業者別対応更新","change":"PAN-OSの影響条件、修正版・予定、緩和策を追加。","priority":"外部入力のBrotli展開処理と同梱版を緊急棚卸し","conditions":"Brotli 1.2.0以上1.2.1未満、1.1.0以上1.1.1未満、1.0.3以上1.0.10未満。細工されたBrotli圧縮データを展開する処理。Node.js、Bun、Python向けBrotliパッケージなど多数の同梱製品が対象になり得る。","impact":"メモリ破損、異常終了、メモリ上の情報漏えい、任意コード実行。製品名だけでなく実際に組み込まれたBrotli版と入力経路を照合する。","fix":"Brotli 1.2.1、1.1.1、1.0.10、または各製品開発元の修正版へ更新。Googleは共通の緩和策を提供していない。","investigation":"更新前後のアクセス・アプリ・クラッシュログを保全し、外部入力を展開するプロセスの異常終了、子プロセス・ファイル生成・外向き通信を確認。","bcp":"同梱ランタイム、コンテナ、業務アプリの更新・再起動・互換性試験・切戻しを製品所有者ごとに計画する。","tech":"public","check":"ck-public","exploitation":"JPCERT/CC・JVN本文では実悪用確認を確定していない。影響製品利用時は侵害有無も調査。","exploitationTone":"amber","sources":[{"label":"JPCERT/CC注意喚起","url":"https://www.jpcert.or.jp/at/2026/at260034.html"},{"label":"JVN","url":"https://jvn.jp/vu/JVNVU97400824/"},{"label":"Google Brotli v1.2.1","url":"https://github.com/google/brotli/releases/tag/v1.2.1"},{"label":"Palo Alto Networks｜Brotli製品影響","url":"https://security.paloaltonetworks.com/CVE-2026-111497"}],"sourceNote":"JPCERT/CCとJVNの本文で対象版・影響・対策を確認。Node.js固有カードとのCVE重複を解消。","relatedVulnerabilities":["v-nodejs-202610"],"history":[{"date":"2026-10-27","type":"新規掲載・データ整理","note":"CVE-2026-111497を同梱製品横断の共通カードとして追加し、Node.jsカードから分離。"},{"date":"2026-10-28","type":"事業者対応更新","note":"PAN-OSのBrotli検査＋TLS復号という成立条件、修正版・予定、無効化手順を追加。"}],"providers":[{"id":"panos-brotli","provider":"PAN-OS／Prisma Cloud Transporter Client","status":"条件付き影響・修正版提供／一部予定","tone":"amber","sourceAsOf":"2026-10-27","checked":"2026-10-28","finding":"PAN-OS 12.2、12.1、11.2の一部が対象。データプレーンでBrotli圧縮通信の検査とTLS/SSL復号を有効にした構成に限り、管理Web/APIは対象外。11.1・10.2とPanoramaは対象外。悪用は未認識と公表。Prisma Cloud Application Security Transporter Clientは0.2.9で修正。","action":"show system setting brotli等で有効状態を確認し、修正版が未提供ならBrotli検査を無効化する公式緩和策と通信検査への影響を評価。PHP修正と同一ホットフィックスの場合も系列別の修正範囲を確認。","sources":[{"label":"Palo Alto Networks｜CVE-2026-111497","url":"https://security.paloaltonetworks.com/CVE-2026-111497"}]}]},{"id":"v-nextcloud-code-202610","product":"Nextcloud向け Collabora Online - Built-in CODE Server","title":"Built-in CODE Server：認証不要のOSコマンドインジェクションが実悪用","identifiers":["CVE-2026-110447"],"published":"2026-10-14","sourceUpdated":"2026-10-23","updated":"2026-10-27","checked":"2026-10-27","changeType":"新規追加","change":"CISA KEV追加とNextcloudコミュニティの緊急案内を確認。無効化だけでは除去にならない。","priority":"richdocumentscodeの導入有無・版・侵害痕跡を直ちに確認","conditions":"Nextcloudの任意アプリrichdocumentscode 26.4.302以前。組み込みCODE Serverが動作していない状態でproxy.phpへ到達できる場合。別建てCollaboraサーバのみの構成とは区別する。","impact":"認証不要のOSコマンド実行。公開観測ではWebシェル設置が報告されており、Nextcloud上のファイルや設定・資格情報へ波及し得る。","fix":"26.4.303以降へ更新するか、利用しない場合はアプリを削除。単に無効化しただけではファイルが残るため十分としない。","investigation":"アプリ整合性、proxy.phpへの不審要求、Webシェル、Webサーバ権限での子プロセス、設定・DB資格情報アクセスを更新前後に調査。","bcp":"ファイル共有・共同編集停止時の代替、秘密情報ローテーション、クリーン復旧、利用者通知と再開条件を準備。","tech":"public","check":"ck-public","exploitation":"CISA KEV掲載・公開コミュニティで実悪用とWebシェル確認を案内","exploitationTone":"red","sources":[{"label":"Nextcloudコミュニティ緊急案内","url":"https://help.nextcloud.com/t/to-collabora-built-in-user-update-asap/250516"},{"label":"CISA KEVカタログ","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog?search_api_fulltext=CVE-2026-110447"}],"sourceNote":"Nextcloud公式運営のコミュニティ本文とCISA KEV掲載を照合。Collabora本体や別建て構成と混同しない。","history":[{"date":"2026-10-27","type":"新規掲載","note":"実悪用確認済みのBuilt-in CODE Server脆弱性を追加。"}]},{"id":"v-velocloud-93952-202610","product":"Arista VeloCloud Orchestrator","title":"VeloCloud Orchestrator：認証不要で管理基盤侵害、実悪用確認","identifiers":["CVE-2026-93952"],"published":"2026-09-22","sourceUpdated":"2026-09-23","updated":"2026-10-27","checked":"2026-10-27","changeType":"未掲載補完","change":"CVE-2026-114625とは前提条件が異なる認証不要の実悪用脆弱性を別カードで補完。","priority":"オンプレVCOの版、証明書認証構成、Web到達範囲、侵害痕跡を確認","conditions":"対象オンプレVCO 5.2.3.15以下、6.1.3.7以下、6.4.2.7以下、7.0.0.2以下。EdgeからVCOへの証明書ベース認証を構成し、公開証明書部分を攻撃者が取得、VCO Webへ到達できる場合。VCO資格情報は不要。","impact":"特権内部機能とVCOホストへアクセスし、管理基盤・管理データの機密性、完全性、可用性を侵害し得る。Hosted/Dedicated版は提供元が修正済み。","fix":"提供元アドバイザリの修正版へ更新し、VCO Webを信頼済み管理ネットワークへ制限。","investigation":"Web、バックエンド、システムログを突合し、不審なURL要素、外向き通信、設定変更、コマンド実行、ファイル生成、DBエクスポートを確認。単一の決定的IOCはない。","bcp":"SD-WAN管理基盤停止時の変更凍結・緊急連絡・構成バックアップ・復旧順序を確認。","tech":"public","check":"ck-public","exploitation":"提供元が実悪用確認済みと公表","exploitationTone":"red","sources":[{"label":"Arista Security Advisory 0183","url":"https://www.arista.com/en/support/advisories-notices/security-advisory/24765-security-advisory-0183"}],"sourceNote":"提供元本文で版、構成条件、実悪用、Hosted修正済み、調査観点を確認。","relatedVulnerabilities":["v-velocloud-202610"],"history":[{"date":"2026-10-27","type":"未掲載補完","note":"認証不要のCVE-2026-93952を、認証済み前提のCVE-2026-114625と分離して追加。"}]},{"id":"v-fuji-vsft-202610","product":"富士電機 V-SFT","title":"V-SFT：細工された画面データで情報漏えい・コード実行","identifiers":["CVE-2026-107894","CVE-2026-107895","CVE-2026-107896","CVE-2026-107897","CVE-2026-107898","CVE-2026-107899","CVE-2026-107900"],"published":"2026-10-26","sourceUpdated":"2026-10-26","updated":"2026-10-28","checked":"2026-10-27","changeType":"参照修正","change":"制御・HMI画面作成ツールの複数脆弱性を追加。","priority":"V-SFTの版、外部入手V7ファイルの受渡し、設計端末の分離を確認","conditions":"V-SFT 6.2.11.0以前。細工されたV7形式ファイルを利用者が開く操作が必要。","impact":"情報漏えいまたは任意コード実行。設計端末から制御系資格情報・プロジェクト資産へ波及し得る。","fix":"V-SFT 6.2.12.0へ更新。信頼できないV7ファイルを開かない。","investigation":"不審なV7ファイルの入手経路、開封履歴、端末上の子プロセス・ファイル生成・外向き通信を確認。","bcp":"設計端末更新時の互換性確認、旧版プロジェクトのバックアップ、代替端末と復旧手順を準備。","tech":"public","check":"ck-public","exploitation":"JVN本文で実悪用確認の記載なし","exploitationTone":"amber","sources":[{"label":"JVN","url":"https://jvn.jp/vu/JVNVU96549652/"}],"sourceNote":"JVN本文で対象版、利用者操作条件、影響、修正版を確認。 無効なendpoint／ck-endpoint参照を脆弱性管理の既存テーマへ修正。これは一般的な関連点検であり、インターネット公開が本脆弱性の成立条件という意味ではない。","history":[{"date":"2026-10-27","type":"新規掲載","note":"V-SFT 6.2.11.0以前の7件を一製品カードに整理。"},{"date":"2026-10-28","type":"参照修正","note":"既存の脆弱性管理テーマ・点検への参照を修正。本文の対象版・公表日は維持。"}]},{"id":"v-growi-202610","product":"GROWI","title":"GROWI複数脆弱性：権限外閲覧・改変と共同編集経由の下書き変更","identifiers":["CVE-2026-105272","CVE-2026-109848","CVE-2026-115624"],"published":"2026-10-27","sourceUpdated":"2026-10-27","updated":"2026-10-28","checked":"2026-10-28","changeType":"新規追加","change":"大学・企業の内部Wikiで利用されるGROWIの権限制御に関する3件を追加。","priority":"外部到達性、GROWI版、ゲスト・停止中利用者、共同編集設定を確認","conditions":"CVE-2026-105272はv3.2.10〜v8.0.6、CVE-2026-109848はv4.5.5〜v8.0.6、CVE-2026-115624はv7.0.0〜v8.0.6。前2件はログイン利用者、後者はゲスト・閲覧専用・承認待ち・停止中・招待中利用者でも共同編集経由で成立し得る。","impact":"閲覧権限のないページ・コメントの閲覧、権限外リビジョン本文の別ページへの複製、下書きページの改変。研究・教育資料や内部手順の機密性・完全性に影響する。","fix":"GROWI v8.0.7へ更新。更新まで外部公開、ゲスト利用、共同編集の必要性とアカウント状態を見直す。","investigation":"ページ・リビジョン・コメントのアクセス、複製先ページ、共同編集操作、ゲスト・停止中アカウントの監査ログを保全・確認。ログ仕様上の限界を記録する。","bcp":"更新前にWikiデータと設定をバックアップし、認証・検索・共同編集・権限継承を検証。停止時の授業・研究・運用手順の代替閲覧経路を準備する。","tech":"public","check":"ck-public","exploitation":"JVN本文で実悪用確認の記載なし","exploitationTone":"amber","sources":[{"label":"JVN｜GROWIにおける複数の脆弱性","url":"https://jvn.jp/jp/JVN51223238/index.html"}],"sourceNote":"JVN本文で対象版、必要権限・アカウント状態、影響、修正版を確認。実悪用未確認を『悪用なし』とは断定しない。","history":[{"date":"2026-10-28","type":"新規掲載","note":"JVN 10/27公表の3件を1製品カードに整理。"}]},{"id":"v-sleipnir-android-202610","product":"Sleipnir Mobile for Android","title":"Androidブラウザ：偽のアドレスバー表示によるフィッシングのおそれ","identifiers":["CVE-2026-109434"],"published":"2026-10-27","sourceUpdated":"2026-10-27","checked":"2026-10-28","updated":"2026-10-28","changeType":"未掲載補完","change":"Androidブラウザ：偽のアドレスバー表示によるフィッシングのおそれ。公式公表と利用条件を照合して補完。","priority":"利用の有無と影響条件を確認し、対象環境で対策を判断","conditions":"Sleipnir Mobile for Android 3.9.0より前。細工されたWebページを当該アプリで開くことが条件。","impact":"偽のアドレスバー等が表示され、サイトの見誤りによるフィッシング被害につながる可能性。","fix":"提供元の案内に従い3.9.0以降の最新版へ更新。アドレスバーの見た目だけでサイトを信用しない。","investigation":"BYOD・管理外端末を含むブラウザ利用を把握。不審ページに情報を入力した場合は、認証情報・セッション・サインイン履歴を確認。","bcp":"学内ポータル・MFA・授業サービスを利用できる管理された代替ブラウザと周知方法を用意。","tech":"phishing","check":"ck-people","exploitation":"確 ントや端末から機微な対応情報を共有しない。"],"next":[{"title":"認証・アクセス設定を点検する","detail":"必要な資格情報変更と、認証方式・権限・アプリ・転送ルール等の不正変更への対処を確認する。","role":"担当者・専門家が実施"},{"title":"影響した情報・送信先・サービスを調べる","detail":"関連するクラウドやメールの操作記録を確認する。","role":"担当者が確認"},{"title":"利用再開と周知を判断する","detail":"安全な状態の確認と、対象者への連絡・不正送信への対応を行う。","role":"責任者が判断"}],"decisions":["管理者侵害時の対応体制","対象アカウントの停止・再開","不正送信先・利用者への通知"],"checks":["ck-identity","ck-command"],"sources":[{"label":"Microsoft｜侵害されたメールアカウントへの対応","url":"https://learn.microsoft.com/en-us/defender-office-365/responding-to-a-compromised-email-account"},{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"}],"reviewed":"2026-10-17"},{"id":"leak","title":"情報漏えい・誤送信・誤共有の疑い","subtitle":"公開・閲覧・取得の可能性を区別する","first":[{"title":"拡大につながる公開・共有を抑える","detail":"権限のある担当者が設定と影響を確認し、対象共有等を制限する。公開状態と操作時刻を記録する。","role":"担当者が確認"},{"title":"対象・期間・閲覧範囲を記録する","detail":"情報項目、対象ファイル、公開期間、閲覧・取得の確認可否を分ける。","role":"担当者が確認"},{"title":"責任者・情報管理担当へ連絡する","detail":"確認された事実と未確認事項を分け、法務・広報等を含む対応体制につなぐ。","role":"担当者が確認"}],"avoid":["調査に必要な記録や対象を一括削除しない。","可能性の段階で、流出件数・原因・攻撃者を断定して周知しない。"],"next":[{"title":"事実確認と被害抑制を継続する","detail":"アクセス記録・宛先・提供元の情報から対象を確認する。","role":"担当者が確認"},{"title":"通知・報告の要否と期限を確認する","detail":"適用法令・契約・情報の性質を踏まえ、情報管理・法務等が公式資料で判断する。","role":"情報管理・法務・責任者が判断"},{"title":"再発防止と継続的な案内を行う","detail":"権限・送信・保管の見直しと、続報窓口を整理する。","role":"担当者が確認"}],"decisions":["本人通知・当局報告等の判断","公開停止・利用制限の範囲","対外説明と訂正の承認"],"checks":["ck-data","ck-command"],"sources":[{"label":"個人情報保護委員会｜漏えい等の対応","url":"https://www.ppc.go.jp/personalinfo/legal/leakAction/"},{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"}],"reviewed":"2026-10-17"},{"id":"phishing","title":"不審な連絡・入力・遠隔操作・送金","subtitle":"何を行ったかに応じて初動を分ける","first":[{"title":"追加の入力・承認・操作を止めて報告する","detail":"不審な相手とのやり取りを止め、既知の社内窓口に連絡する。調査のために再びリンクを開かない。","role":"担当者が確認"},{"title":"実施した操作を確認する","detail":"閲覧のみ／ID等を入力／認証を承認／添付を実行／遠隔操作を許可／送金を実施、を分けて記録する。","role":"担当者が確認"},{"title":"操作に応じた担当へつなぐ","detail":"入力・承認はアカウント対応、実行・遠隔操作は端末調査。送金済みは財務責任者を通じ金融機関等へ至急相談する。","role":"情報システム・財務等が判断"}],"avoid":["確認のために添付ファイルを再実行しない。","利用者を責めて報告を遅らせない。"],"next":[{"title":"原本・時刻・対象を安全に保全する","detail":"メール原本・表示情報・端末・アカウント・操作内容を集める。","role":"担当者が確認"},{"title":"関連する侵害の確認を進める","detail":"端末・認証・送信の記録を照合し、必要な隔離や認証対応を判断する。","role":"担当者・専門家が判断"},{"title":"同様の連絡への注意を周知する","detail":"確認済みの特徴と、してほしい行動・通報先を案内する。","role":"担当者が確認"}],"decisions":["端末の隔離・アカウント制限","送金先への組織的な対応","同一の連絡を受けた人への周知"],"checks":["ck-people","ck-identity"],"sources":[{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"},{"label":"Microsoft｜侵害されたメールアカウントへの対応","url":"https://learn.microsoft.com/en-us/defender-office-365/responding-to-a-compromised-email-account"},{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"}],"reviewed":"2026-10-17"},{"id":"web","title":"Web改ざん・公開サーバーの侵害","subtitle":"異常な表示、不審ファイル、侵害の通知など","first":[{"title":"影響する公開・接続を制限する","detail":"サービス責任者と、対象公開の停止・制限や保守接続の扱いを判断する。","role":"責任者・担当者が判断"},{"title":"変更前の状態・ログを保全する","detail":"表示、変更ファイル、認証・アクセス記録、構成を安全に記録する。","role":"担当者が確認"},{"title":"保守会社・専門家と調査を開始する","detail":"対象サイトだけでなく同居環境・管理者・連携先への影響を確認する。","role":"担当者が確認"}],"avoid":["改ざん箇所を消しただけで再公開しない。","疑わしいファイルを通常の業務端末で開いたり実行したりしない。"],"next":[{"title":"原因と残存アクセスを調べる","detail":"利用製品・更新状況・権限・不審な接続や設定変更を確認する。","role":"担当者が確認"},{"title":"業務と利用者への案内を整える","detail":"代替ページ・受付経路等を業務責任者と調整する。","role":"担当者が確認"},{"title":"安全な復旧・再公開を判断する","detail":"原因対処、復元元、動作・権限・監視を確認する。","role":"専門家・責任者が判断"}],"decisions":["公開停止・代替公開","他サイト・データへの影響範囲","再公開の承認"],"checks":["ck-public","ck-backup","ck-command"],"sources":[{"label":"JPCERT/CC｜国内組織の不正アクセスへの注意喚起","url":"https://www.jpcert.or.jp/at/2026/at260030.html"},{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"}],"reviewed":"2026-10-17"},{"id":"outage","title":"システム停止・認証障害・原因不明","subtitle":"攻撃と断定せず、業務影響と原因を並行して確認する","first":[{"title":"影響範囲と業務上の期限を確かめる","detail":"単一端末・拠点・サービス・全体のどこまで影響するかを整理し、止まる重要業務を確認する。","role":"担当者が確認"},{"title":"既知の窓口と別の連絡経路を確保する","detail":"担当者・提供元と連絡し、公式障害情報、直前の変更、依存先の状態を照合する。","role":"担当者が確認"},{"title":"状況と実施操作を記録する","detail":"発見時刻、症状、監視・変更の記録、調査した範囲を残す。不審な兆候があれば該当する侵害対応へ進む。","role":"担当者が確認"}],"avoid":["影響を確認せず基盤全体の再起動・構成変更を繰り返さない。","停止だけを根拠にサイバー攻撃や情報漏えいを断定しない。"],"next":[{"title":"代替運用の開始を判断する","detail":"期限、復旧見込み、代替手段の実行可能性を業務責任者と確認する。","role":"責任者・業務部門が判断"},{"title":"復旧の依存関係と優先順位を整理する","detail":"認証・DNS・ネットワーク・外部サービスなどの前提と変更内容を確認する。","role":"担当者が確認"},{"title":"業務確認後に再開する","detail":"動作、データ整合性、滞留処理、利用者への周知を確認する。","role":"業務・システム責任者が判断"}],"decisions":["停止継続・代替運用への切替","切戻し・復旧順","業務再開の承認"],"checks":["ck-bcp","ck-command"],"sources":[{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"}],"reviewed":"2026-10-17"},{"id":"supplier","title":"利用サービス・委託先からの被害連絡","subtitle":"提供元の事実と自組織への該当を確認する","first":[{"title":"正当な連絡か既知の窓口で確認する","detail":"通知中のリンクだけに頼らず、契約時等の既知の連絡先・公式情報から確認する。","role":"担当者が確認"},{"title":"自組織の利用・データ・接続関係を調べる","detail":"対象サービス、契約、利用部署、預託情報、連携キーや保守接続を確認する。","role":"担当者が確認"},{"title":"責任者と提供元に未確認事項を確認する","detail":"対象期間・情報項目・停止範囲・必要な措置を記録し、公式続報の窓口を決める。","role":"担当者が確認"}],"avoid":["取引があるだけで、自組織の全情報が流出したと断定しない。","業務影響を確認せず連携キーや接続を一律に止めない。"],"next":[{"title":"提供元の要請と自組織の対策を照合する","detail":"必要な制限・キー変更等を担当者が調整し、事実と確認待ちを分ける。","role":"担当者が確認"},{"title":"利用者への案内と通知・報告を判断する","detail":"対象となる情報・影響に応じて情報管理・法務・広報等と調整する。","role":"責任者・関係部署が判断"},{"title":"停止中の業務と復旧後の確認を決める","detail":"代替運用、再連携、データ整合性、滞留処理を確認する。","role":"担当者が確認"}],"decisions":["接続・利用制限の必要性","利用者への案内・通知","代替運用と連携再開"],"checks":["ck-supplier","ck-data","ck-bcp"],"sources":[{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"label":"個人情報保護委員会｜漏えい等の対応","url":"https://www.ppc.go.jp/personalinfo/legal/leakAction/"},{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"}],"reviewed":"2026-10-17"}],"noticeTypes":[{"id":"general","title":"不審な連絡への注意","techs":["phishing","identity","remote"],"ir":"phishing","user":"不審なメール・SMS・電話等では、リンクからの認証情報入力、認証要求の承認、遠隔操作の許可を行わないでください。確認は普段利用している公式画面または既知の連絡先から行ってください。操作した可能性がある場合は、受信時刻と実施した操作を添えて情報システム窓口へ連絡してください。","it":"対象者が受けた連絡と実施操作を確認し、認証・端末・送信の記録を照合してください。関連する認証方式、権限、転送等の変更を点検し、影響範囲と追加対応の必要性を報告してください。"},{"id":"supplier","title":"外部サービスの被害公表","techs":["supplier"],"ir":"supplier","user":"該当サービスを利用している方は、公式通知と自組織からの案内を確認してください。被害に便乗した連絡で認証情報や認証コードを伝えず、普段利用している公式画面や既知の窓口から確認してください。個別の対象者や必要な対応は、確認できた内容に基づいて別途ご案内します。","it":"利用部署・契約・預託データ・接続関係を照合し、自組織への影響を確認してください。提供元へ対象期間・情報項目・停止範囲・必要な措置を確認し、未確認事項と業務影響を整理してください。接続やキーの変更は業務影響を踏まえて判断してください。"},{"id":"vuln","title":"脆弱性の影響確認・更新依頼","techs":["public","api"],"ir":"web","user":"対象端末・サービスの更新や再起動について、情報システム部門から案内があった場合は指定された方法で対応してください。案内を装ったメールから不明な更新プログラムを実行せず、判断に迷う場合は既知の窓口に確認してください。","it":"製品・バージョン・機能・公開範囲を公式の対象条件と照合してください。該当する場合は、必要な保全・侵害調査、修正・回避策、停止影響・切戻しを検討し、確認結果と対応予定を報告してください。対象不明の場合も、確認に必要な情報を明記してください。"},{"id":"leak","title":"誤共有・漏えいの疑いへの案内","techs":["sharing","api"],"ir":"leak","user":"対象の情報や不審な共有に気付いた場合は、必要以上に閲覧・転送・保存を広げず、情報管理・情報システム窓口へ連絡してください。対象者や影響については、確認された情報に基づいて案内します。","it":"公開・共有の範囲、情報項目、期間、閲覧・取得の確認可否を整理してください。被害拡大を抑える対応と記録の保全を進め、通知・報告の要否は情報管理・法務等へ判断を依頼してください。"},{"id":"outage","title":"サービス停止・代替運用の案内","techs":["outage","ransom","supplier"],"ir":"outage","user":"対象サービスが利用できない場合は、現在案内している代替手段を利用してください。自己判断で同じ処理や申請を繰り返さず、期限のある業務は担当窓口へ連絡してください。原因・復旧見込みは確認でき次第ご案内します。","it":"影響範囲、重要業務と期限、依存先、直前の変更、提供元の公式情報を整理してください。原因未確定の事項を分けて報告し、代替運用、復旧順、再開確認を業務責任者と調整してください。"}],"resources":[{"label":"JPCERT/CC｜侵入型ランサムウェアFAQ","url":"https://www.jpcert.or.jp/magazine/security/ransom-faq.html"},{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"},{"label":"経済産業省｜インシデント対応の手引き","url":"https://www.meti.go.jp/policy/netsecurity/sme_incident.html"},{"label":"Microsoft｜侵害されたメールアカウントへの対応","url":"https://learn.microsoft.com/en-us/defender-office-365/responding-to-a-compromised-email-account"},{"label":"個人情報保護委員会｜漏えい等の対応","url":"https://www.ppc.go.jp/personalinfo/legal/leakAction/"},{"label":"JPCERT/CC｜国内組織の不正アクセスへの注意喚起","url":"https://www.jpcert.or.jp/at/2026/at260030.html"},{"label":"JVN iPedia｜脆弱性対策情報","url":"https://jvndb.jvn.jp/"},{"label":"CISA｜Known Exploited Vulnerabilities","url":"https://www.cisa.gov/known-exploited-vulnerabilities-catalog"},{"label":"IPA｜不正アクセス特別相談窓口","url":"https://www.ipa.go.jp/pressrelease/2026/press20261016.html"}],"advisories":[{"id":"adv-jumonji-claim-20261028","title":"確認待ち｜十文字学園女子大学を指すとみられるSafePay掲載の記録","verificationLabel":"攻撃者の主張を記録した第三者観測／大学公式の被害確認待ち 2026-10-28","audience":"教育機関・情報システム・広報担当","paragraphs":["SafePayの掲載一覧に「jumonji-u.ac.jp」が2026/10/26付で記録されていることをRansomLookの公開ページで確認。IncidentLogは観測日時を10/26 16:17:53 UTC（日本時間10/27 01:17:53）と記録。掲載日表示とJST発見日を区別する。大学・法人の公式公表との照合は未確認。攻撃者の名指しは、ランサムウェア感染・暗号化・窃取・公開データの真正性を立証しない。","被害確認済みインシデントとしては追加せず、攻撃アクターの動向タイムラインと本欄で追跡する。公表が見つからないことは、被害がないことの証明ではない。","自組織の点検：外部からの通報を受ける窓口、CSIRTと広報の照合手順、証拠保全、重要業務の代替を確認する。"],"sources":[{"label":"RansomLook｜SafePay公開観測一覧（掲載主張の記録）","url":"https://www.ransomlook.io/group/safepay"},{"label":"IncidentLog｜jumonji-u.ac.jp掲載記録（自動照合による組織推定）","url":"https://incidentlog.jp/claims/safepay-20261026-9b69e9"},{"label":"大学公式｜照合先（被害公表の根拠ではない）","url":"https://www.jumonji-u.ac.jp/info/"},{"label":"法人公式｜照合先（被害公表の根拠ではない）","url":"https://gakuen.jumonji-u.ac.jp/"}],"origin":"第三者観測と大学公式照合を区別。点検事項は編集案。"},{"id":"adv-airscorer-date-pending-20261028","title":"公表日照合待ち｜京都文教大学のAI.R-Scorer利用者への影響","verificationLabel":"大学公式本文確認／記事の公表日未確認 2026-10-28","audience":"教育機関・外部サービス管理担当","paragraphs":["大学公式は教員18名と2026年度総合社会学部入学生197名（編入生除く）について、氏名・学籍番号・大学メール・作文と結果等の漏えいのおそれを説明。実際の持出し・悪用は未確認。","提供元はレベルエンター。新田高校と同じサービスの波及として追跡する。大学記事の公表日を確定できていないため、確認日を初報日に置き換えたインシデント行は作成していない。","自組織の点検：授業単位の外部サービス利用、保存データ、退会・利用終了後の削除と、提供元から学校・学生への連絡経路を確認する。"],"sources":[{"label":"京都文教大学｜公表日未確認","url":"https://www.cyber.kbu.ac.jp/kbu/whatnew/2026/10/post-288.html"}],"origin":"確認した本文と未確認の公表日を区別した追跡メモ。点検事項は編集案。"},{"id":"adv-jpcert-20261023","title":"JPCERT/CC｜AI基盤を悪用する攻撃試行・APIの痕跡を追加","verificationLabel":"本文確認 2026-10-24","audience":"情報システム・開発・保守担当","paragraphs":["10/23更新でケースEにCairn・CyberStrikeAI・ARTEXを悪用した探索と公開WSUSへの攻撃試行を追加。すべての国内事案が同じ主体・原因とはしない。","ケースBにはAPIへの不正操作の送信元・アプリ同一User-Agent等を追記。Torや住宅プロキシも利用される。管理APIの認可、公開バックアップ・設定、API鍵と公開WSUSを点検する。","掲載IPや一般的なPythonと共通の通信指紋だけで攻撃と断定しない。観測期間とリクエスト・認証・変更ログを組み合わせて調査する。"],"sources":[{"label":"JPCERT/CC｜10/23更新","url":"https://www.jpcert.or.jp/at/2026/at260030.html"}],"origin":"公式の観測内容と、自組織向けの点検案を区別した整理。"},{"id":"adv-review-pending-20261022","verificationLabel":"照合状況追記 2026-10-24","title":"10/22調査｜確認待ちの続報・公表情報","audience":"続報の確認用","paragraphs":["調査日：2026-10-22。以下は今回の被害一覧・確定更新数へ加算していない確認待ち情報です。","カーセンサーnet／C-MATCH：10/21公式検索結果で最大3,709,551件の漏えい可能性という続報を確認。公式本文は取得制限のため、対象区分・項目・除外・件数内訳を直接照合後に更新する。現行の事例カードは前回確認分を維持。","Xerj Console API：JVN／CERTの参照を確認したが、詳細な対象条件・修正版の照合は保留。PaykeのStudio関連公表も詳細本文の照合待ち。","CISA KEVの最新告知・SafePay共同注意喚起は今回本文未取得。追加なし、又は全件確認済みとは記載しない。10/23調査でXserverのPHP対応本文は確認し、PHPカードに更新。ConoHa固有の対応は未照合。","10/23追記：カーセンサーとBlastmailの未確認本文は引き続き保留。今回の新規件数・確定続報には加算しない。","10/24追記：Blastmail提供元の公式続報とConoHa WINGのPHP対応本文を確認し各カードへ反映。野村證券i-Portの詳細本文、Canonet/HOMEの23日停止・復旧完了、Zeaburの公表詳細は未照合。WINGの修正をVPSへ拡張しない。"],"sources":[{"label":"リクルート｜10/21続報（本文確認待ち）","url":"https://www.recruit.co.jp/newsroom/pressrelease/2026/1021_149447.html"},{"label":"JVN｜Xerj Console API","url":"https://jvn.jp/vu/JVNVU92078426/index.html"}],"origin":"確認できた範囲と取得できていない本文を区別した調査メモ。各候補の詳細が確認済みという表示ではありません。"},{"id":"adv-gmo-artex-20261019","title":"GMOイエラエ｜AI利用を確認した攻撃活動","audience":"情報システム・セキュリティ担当","published":"2026-10-19","checked":"2026-10-21","paragraphs":["公表：2026-10-19 ／ 本文確認：2026-10-21","調査実施元は観測した攻撃活動でARTEX利用、6つの攻撃基盤を分析。1基盤で日本の約20組織、公表済み8社等の観測範囲を説明している。","国内の全事案がAI利用・同一アクターによるものと一般化しない。ツール開発者の国と攻撃者の国籍を同一視せず、公開資産・認証情報・監視と初動連絡を点検する。"],"sources":[{"label":"GMOイエラエ｜調査本文","url":"https://gmo-cybersecurity.com/blog/20261019/"}],"origin":"調査実施元の本文を確認。観測範囲と調査上の評価を保持し、個別の掲載事例の主体を推定しない。"},{"id":"adv-fc3fcc86c8","title":"IPA｜不正アクセス特別相談窓口","audience":"企業・担当者","paragraphs":["公表：2026-10-16 ／ 一覧反映：2026-10-17","被害を受けた、または疑いのある企業・組織向けの初動対応支援。被害可能性・応急措置への助言、専門業者や相談・報告先の紹介。","電話：03-6759-5760 平日9:30～17:30（12:00～13:00を除く）"],"sources":[{"label":"IPA公式案内を確認 ↗","url":"https://www.ipa.go.jp/pressrelease/2026/press20261016.html"}],"origin":"IPA公式本文を2026-10-18に再確認。受付日時・利用条件は最新の公式案内を確認。","checked":"2026-10-18"},{"id":"adv-2538ac4feb","title":"近畿大学｜学生向け多要素認証の必須化","audience":"個人向け","paragraphs":["公表：2026-10-15 ／ 一覧反映：2026-10-17","KDU Mobile、Kindai Mail・Classroom等のGoogle Workspace、共通認証対応Webサービスで、10月16日21時から順次、多要素認証を必須化すると案内。設定方法と問い合わせ窓口を掲載。","新規インシデントではなく対策情報。既掲載の国際学部の事案との直接的な関係は、この告知では確認できません。"],"sources":[{"label":"大学公式案内を確認 ↗","url":"https://kudos.kindai.ac.jp/category/impinfo"}],"origin":"2026-10-17更新の元資料から継承。今回リンク先本文を個別には再確認していません。"},{"id":"adv-ddd2d02174","title":"NCO｜各機関の注意喚起・対策リンク集","audience":"企業・担当者","paragraphs":["公表・資料日：2026-10-14","国内で相次ぐ不正アクセス・漏えいを踏まえた、各機関の注意喚起や対策資料への入口。"],"sources":[{"label":"公式資料を確認 ↗","url":"https://www.cyber.go.jp/news/20261014.html"}],"origin":"2026-10-17更新の元資料から継承。今回リンク先本文を個別には再確認していません。"},{"id":"adv-03a8f742a1","title":"NICT／CYNEX｜A2B攻撃に関する技術資料（PDF）","audience":"企業・担当者","paragraphs":["公表・資料日：2026-10-13","A2B（App-to-Backend Attack）に関する技術資料。攻撃手法の確認・対策検討の参考に。個別事案への該当は公式根拠が確認できた場合に判断します。"],"sources":[{"label":"公式資料を確認 ↗","url":"https://cynex.nict.go.jp/pdf/library/lettice/261013-01.pdf"}],"origin":"2026-10-17更新の元資料から継承。今回リンク先本文を個別には再確認していません。"},{"id":"adv-c306c1c1b9","title":"IPA｜速やかに実施すべき対策","audience":"企業・担当者","paragraphs":["公表・更新：2026-10-09","公開アプリ・外部サービスの棚卸し、ログ点検、不審アカウント確認、修正適用、保有データの削減。直近1か月から3か月へ広げて点検。"],"sources":[{"label":"公式資料・手続きを確認 ↗","url":"https://www.ipa.go.jp/security/security-alert/ od":"複数時期の活動を集約した当局公表。個別被害の発生日ではない。","published":"2026-10-20","title":"米当局等がSafePayへの対策を注意喚起","evidenceType":"当局公表","text":"CISAがSafePayの活動に関するAA26-293Aを公表。公式検索本文で認証情報・フィッシング・脆弱性の悪用、正規ツール利用、MFA等への言及を確認。ページ・PDFの直接取得は403のため、個別IOCや調査期間の詳細を今回再検証済みとは扱わない。この注意喚起は十文字学園女子大学の被害を確認する資料ではない。","checks":["VPN・公開機器・管理者認証とMFAの対象範囲を点検。","正規ツールの利用も権限・実行主体・時間帯と照合する。"],"sources":[{"label":"CISA｜AA26-293A・10/20注意喚起（検索本文確認、直接取得403）","url":"https://www.cisa.gov/news-events/cybersecurity-advisories/aa26-293a"}],"actors":["actor-safepay"],"checked":"2026-10-28"},{"id":"ev-k0t-groupib-20261021","period":"2026年2～6月の侵害等、90日外の観測を含む調査。公表は10/21。","published":"2026-10-21","title":"境界機器の侵害と侵入権限供給の可能性：k0tの調査","evidenceType":"調査会社の分析","text":"Group-IBとNyxLabは、Fortinet・GlobalProtect等を狙う広範な侵害、認証情報取得、持続アクセス・窃取を報告。Qilin・The Gentlemenの掲載対象との重なりからIAB等の可能性を挙げるが、直接の提携・所属は未確認と明記。k0tを両グループの別名や同一組織として扱わない。国内の特定大学の被害を示す資料ではない。","checks":["公開VPN・FWの更新だけでなく、認証情報、残存アカウント、遠隔管理ツールを点検。","入口の侵害者と恐喝ブランドの帰属を分け、被害対象の重なりだけで同一主体と認定しない。"],"sources":[{"label":"Group-IB／NyxLab｜10/21調査","url":"https://www.group-ib.com/blog/stray-cat-network-edge/"}],"actors":["actor-qilin","actor-gentlemen"],"checked":"2026-10-28"},{"id":"ev-qilin","period":"公表本文に拘束・引渡しの日付の記載なし","published":"2026-10-08","title":"Qilin被疑者に対する国際捜査協力","evidenceType":"当局公表","text":"警察庁が被疑者の拘束・ドイツへの引渡しへの協力を説明。グループ全体の壊滅を意味しない。","checks":["逮捕報道だけでログ調査や侵害調査を終了しない"],"sources":[{"label":"警察庁｜2026/10/8 Qilin被疑者に関する国際捜査協力","url":"https://www.npa.go.jp/news/release/2026/20261008news.pdf"}],"actors":["actor-qilin"],"checked":"2026-10-25"},{"id":"ev-killsec","period":"2026-09-30","published":"2026-10-01","title":"KillSecの基盤押収・逮捕","evidenceType":"当局公表","text":"当局は3人の逮捕、5サーバーと少なくとも110TBのデータの押収を公表。捜査は継続。","checks":["疑われる被害の証拠保全・警察相談・残存侵害調査"],"sources":[{"label":"スイス当局｜KillSec基盤押収・2026/10/1","url":"https://www.metas.admin.ch/en/newnsb/cBOoSTI5a7sc"}],"actors":["actor-killsec"],"checked":"2026-10-25"},{"id":"ev-dragon","period":"2026-09-22（調査会社の観測日）","published":"2026-10-14","tit -clop"],"checked":"2026-10-25"},{"id":"ev-apac","period":"2026-08-01〜2026-08-31","published":"公開ページでは公表日を確認できず","title":"APACの活動と対日DDoS","evidenceType":"調査会社の観測","text":"Group-IBがThe Gentlemen、Qilin等の活動とNoName057(16)の対日DDoSを報告。リーク掲載・攻撃主張と被害確定を区別。","checks":["公開機器の点検と停止時の代替告知"],"sources":[{"label":"Group-IB｜2026年8月APAC観測","url":"https://www.group-ib.com/resources/research-hub/apac-threat-landscape-report-august-2026/"}],"actors":["actor-gentlemen","actor-qilin","actor-noname"],"checked":"2026-10-25"}],"crimeGlossary":[{"id":"raas","title":"RaaS運営者","role":"ランサムウェア、管理画面、公開恐喝サイト等を提供し、利用料や収益分配を得る。","check":"暗号化対策と情報持ち出し対策を両方用意する。","sources":[{"label":"カナダ・サイバーセンター｜TA505 / CL0P","url":"https://www.cyber.gc.ca/en/guidance/profile-ta505-cl0p-ransomware"},{"label":"Group-IB｜Operation KillSwitchと分業構造","url":"https://www.group-ib.com/media-center/press-releases/operation-killswitch-killsec/"}],"checked":"2026-10-25"},{"id":"affiliate","title":"アフィリエイト（実行者）","role":"RaaSを利用して侵入・窃取・暗号化等を行う人物・チーム。複数の基盤を使う場合がある。","check":"同じブランドでも入口・手口が異なる前提で点検する。","sources":[{"label":"Group-IB｜Operation KillSwitchと分業構造","url":"https://www.group-ib.com/media-center/press-releases/operation-killswitch-killsec/"}],"checked":"2026-10-25"},{"id":"iab","title":"IAB：侵入権限の売買","role":"侵害済みネットワークへのアクセス等を他の犯罪者へ売る。盗用IDだけでなくアクセス手段も商品となる。","check":"休眠ID、VPN、不審な管理者追加・持続的な接続を確認する。","sources":[{"label":"カナダ・サイバーセンター｜TA505 / CL0P","url":"https://www.cyber.gc.ca/en/guidance/profile-ta505-cl0p-ransomware"},{"label":"Unit 42｜The Gentlemen・Storm-2697","url":"https://unit42.paloaltonetworks.com/the-gentlemen-ransomware/"}],"checked":"2026-10-25"},{"id":"stealer","title":"インフォスティーラー・窃取ログ","role":"端末からID・パスワード・ブラウザーのセッション等を盗み、後続の侵入・売買の材料にする。道具の名前と運営グループ名は別。","check":"私物端末での業務ID利用、感染端末、認証情報とセッションの失効を確認する。","sources":[{"label":"Check Point｜Qilin / Agendaの特徴","url":"https://www.checkpoint.com/cyber-hub/threat-prevention/ransomware/qilin-ransomware/"}],"checked":"2026-10-25"},{"id":"broker","title":"情報売買・仲介","role":"盗んだ情報を販 を踏まえSafePayを追加（計16）。全グループの網羅や順位・危険度スコアではありません。","evidence":["当局公表","被害組織の公表","調査会社の観測","調査会社の分析","攻撃者の主張","未確認"],"dateNote":"確認日は出典を確認した日。発生日・観測日・資料公表日とは別です。全体の基礎確認は10/25、SafePay・追加動向は10/28補完。個別カードの日付を参照。","timelineSupplementChecked":"2026-10-28"}}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('app-data').textContent);
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:'#';}catch(_){return '#';}};
const link=(s)=>'<a href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+' ↗</a>';
const sources=arr=>'<div class="sources">'+(arr||[]).map(link).join('')+'</div>';
const badge=(v,c='')=>'<span class="badge '+c+'">'+esc(v)+'</span>';
const tags=arr=>(arr||[]).map(v=>badge(v)).join('');

function statusTone(status){
 if(!status)return '';
 if(/漏えい確認|一部流出確認|不正閲覧確認|不正照会確認|改ざん確認|アカウント悪用確認|情報持出し確認|外部送信痕跡確認|不正アクセス確認|不正ログイン確認|不正プラグイン設置確認/.test(status))return 'red';
 if(/未確認|調査中|可能性|疑い|未公表|精査/.test(status))return 'amber';
 if(/漏えいなし|流出なし|流出痕跡なし/.test(status))return 'slate';
 if(/確認|情報流出|持出し|公開|閲覧可能|リスト漏えい/.test(status))return 'red';
 if(/検知|停止/.test(status))return 'amber';
 return 'teal';
}
function isResolvedStatus(status){
 return /^(対応完了|復旧完了|解決済み)$/.test(status||'');
}
function extractExcludeTags(r){
 // No automatic subject/negation inference from prose; the full source-qualified text is in the detail.
 return r.exclude?['対象外・未確認の詳細あり']:[];
}
function hasExploitationEvidence(v){
 const t=v.exploitation||'';
 if(/未確認|未確定|未公表|記載なし|記載はない|としては扱わない|継続確認|ごとに異なる|付記は/.test(t))return false;
 return /悪用確認リスト掲載|実攻撃|悪用(?:確認済みと公表|確認の公表あり|を確認)|実際の悪用を確認|広範な実際の悪用|限定的な悪用|マルウェア混入.*確認|悪性.*公式配布.*確認/.test(t);
}

function shortScope(r){
 const s=r.scope||'未記載';
 return s.split('。')[0]+(s.includes('。')?'':'');
}

const btn=(text,attrs='',cls='')=>'<button class="btn '+cls+'" '+attrs+'>'+esc(text)+'</button>';
const bullets=arr=>'<ul>'+(arr||[]).map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>';
const byId=(arr,id)=>arr.find(x=>x.id===id);
const caseById=id=>byId(DATA.incidents,id);
const techById=id=>byId(DATA.techniques,id);
const vulnReference=v=>v.identifiers.length?v.identifiers.join(' / '):(v.referenceLabel||'CVE未公表');
function relatedMaterials(item){
 const v=(item.relatedVulnerabilities||[]).map(id=>byId(DATA.vulnerabilities,id)).filter(Boolean);
 const r=(item.relatedIncidents||[]).map(caseById).filter(Boolean);
 if(!v.length&&!r.length)return '';
 return '<div class="detail-block"><h4>関連する事例・製品対応</h4><div class="tools">'+v.map(x=>btn(x.product+'の対応','data-vuln="'+x.id+'"')).join('')+r.map(x=>btn(x.org,'data-case="'+x.id+'"')).join('')+'</div><p class="fine">関連の確度・対象範囲は各本文で確認してください。</p></div>';
}
const countBy=(rows,getter)=>{const o={};for(const r of rows){const vs=getter(r);for(const v of Array.isArray(vs)?[...new Set(vs)]:[vs])if(v)o[v]=(o[v]||0)+1;}return Object.entries(o).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ja'));};
const defaultFilters=()=>({basis:'date',start:'',end:'',industry:'',cat:'',status:'',q:'',theme:'',sensitive:'',secondary:'',group:'',updates:false});
const state={view:'home',filters:defaultFilters(),sort:'new',page:0,pageSize:20,grouped:true,expandedGroups:{},advFiltersOpen:false,
 homeFilter:'all',biSpan:'daily30',vulnQuery:'',vulnFilter:'all',bcpTab:'checks',
 threatTab:'vulnerabilities',actorTab:'directory',actorQuery:'',actorCategory:'',actorEvidence:'',checkId:'',checkAnswers:{},checkNotes:{},noticeType:'general',noticeAudience:'user',
 noticeReference:null,noticeText:'',noticeContact:'',noticeScope:'',irId:'',irChecks:{},irMemos:{},caseId:''};
const views=['home','incidents','bi','threats','bcp-tools','checks','notices'];
const dateLabel={date:'公表日（初回等）',sourceUpdated:'続報・情報日',updated:'一覧反映日'};
const basisNote=r=>r.dateBasis?(typeof r.dateBasis==='string'?r.dateBasis:'続報日（初回未確認）'):'';
const infoPatterns={'パスワード':/パスワード/,'カード情報':/カード(情報|番号|有効期限|の一部)/,'本人確認書類':/免許証|本人確認|パスポート/,'マイナンバー':/マイナンバー/,'銀行口座':/口座/,'鍵情報':/鍵情報|APIキー|トークン|復号鍵|復号に必要な鍵|メール送信キー|接続キー/,'健康・機微情報':/体温|年収|健康|病歴|要配慮|タイプ診断|身長|体重|医療/};
function sensitiveOf(r){if(/流出なし|流出痕跡なし|漏えい事実未確認/.test(r.status))return [];const text=r.info.split(/(?<=[。])/).filter(s=>!/(対象外|含まれない|保有していない|未確認|発生していない|とは別|ではない)/.test(s)).join('');return Object.entries(infoPatterns).filter(([k,re])=>re.test(text)).map(([k])=>k);}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'');}
function themesOf(r){return DATA.caseLinks[r.id]?.techs||[];}
function filterRows(rows=DATA.incidents,f=state.filters){
 const q=f.q.trim().toLocaleLowerCase();
 if(f.start&&f.end&&f.start>f.end)return [];
 return rows.filter(r=>{
  const d=(r[f.basis]||'').slice(0,10);
  return (!f.start||(validDate(d)&&d>=f.start))&&(!f.end||(validDate(d)&&d<=f.end))&&
   (!f.industry||r.industry===f.industry)&&(!f.cat||(r.cat||[]).includes(f.cat))&&
   (!f.status||r.status===f.status)&&(!f.theme||themesOf(r).includes(f.theme))&&(!f.sensitive||sensitiveOf(r).includes(f.sensitive))&&
   (!f.secondary||(r.secondary?.status||'未分類・未確認')===f.secondary)&&(!f.group||r.group===f.group)&&
   (!f.updates||r.updated===DATA.meta.incidentSnapshotDate)&&
   (!q||[r.org,r.info,r.impact,r.scope,r.note,r.change,r.action,(r.cat||[]).join(' ')].join(' ').toLocaleLowerCase().includes(q));
 });
}
function sortedRows(rows){
 return [...rows].sort((a,b)=>state.sort==='org'?a.org.localeCompare(b.org,'ja'):
  state.sort==='old'?(a[state.filters.basis]||'').localeCompare(b[state.filters.basis]||''):
  (b[state.filters.basis]||'').localeCompare(a[state.filters.basis]||'')||a.org.localeCompare(b.org,'ja'));
}
function aggregateCount(rows){return new Set(rows.map(r=>r.group?'group:'+r.group:'id:'+r.id)).size;}
function selectedRows(){return sortedRows(filterRows());}
function head(kicker,title,sub,tools=''){return '<div class="page-head"><div><div class="eyebrow">'+esc(kicker)+'</div><h1>'+esc(title)+'</h1><p class="lead">'+esc(sub)+'</p></div><div class="tools no-print">'+tools+'</div></div>';}
function kpis(rows){const confirmed=rows.filter(r=>['漏えい確認','一部漏えい確認','不正閲覧確認','不正照会確認'].includes(r.status)).length;
 return '<div class="kpis">'+[

function stageTracking(rows){

 return '<article class="card" style="margin-top:16px"><h3>初期事案と、その後の報告</h3><p class="fine">上部の条件で抽出後、初期は公表月、後続は二次被害欄の情報月で分類。共通group・同じ月・同じ段階を1件に集約します。</p><div style="overflow:auto"><table class="data-table" style="min-width:610px"><thead><tr><th>報告月</th><th>初期事案</th>'+stages.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+months.map(m=>{

 }).join('')+'</tbody></table></div><p class="fine" style="margin-top:9px">発生日の推移・同一事案からの移行率ではありません。初期事案には誤送信等も含みます。不審連絡は因果未確定を含み、不正送信は受信者の実被害とは区別します。</p>'+
 '<details class="expander"><summary>追跡内容を見る（分類済み '+reported.length+'掲載項目）</summary><div class="content">'+reported.map(r=>'<div class="history-row"><button class="btn-link" data-case="'+r.id+'">'+esc(r.org)+'</button><p class="fine">'+esc(r.date)+' '+(r.dateBasis?'続報日':'公表日')+' → '+esc(r.secondary.date||'情報日未記載')+' '+esc(r.secondary.status)+'</p><p class="subtle">'+esc(r.secondary.text)+'</p></div>').join('')+'</div></details></article>';
}

function applyVulnFilters(){
 const q=(state.vulnQuery||'').trim().toLocaleLowerCase();
 const f=state.vulnFilter||'all';
 let n=0;
 document.querySelectorAll('[data-vuln-card]').forEach(el=>{
  const v=byId(DATA.vulnerabilities,el.dataset.vulnCard);
  if(!v)return;
  const matchFilter=f==='all'?true:
   f==='updates'?v.updated===DATA.meta.compiledDate:
   f==='exploited'?hasExploitationEvidence(v):
   f==='providers'?Boolean(v.providers?.length):true;
  const matchQ=!q||[v.product,v.title,vulnReference(v),v.conditions,v.impact,v.fix].join(' ').toLocaleLowerCase().includes(q);
  const ok=matchFilter&&matchQ;
  el.hidden=!ok;
  if(ok)n++;
 });
 if($('vuln-count'))$('vuln-count').textContent=n+' / '+DATA.vulnerabilities.length+'テーマ表示';
 if($('vuln-empty'))$('vuln-empty').hidden=n!==0;
}

async function copyText(text){
 let copied=false;
 if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);copied=true;}catch(_){}}
 try{
  if(!copied){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='0';ta.style.left='0';ta.style.width='1px';ta.style.height='1px';ta.style.opacity='0';const host=document.querySelector('dialog[open]')||document.body;host.appendChild(ta);try{ta.select();if(!document.execCommand('copy'))throw Error('copy unavailable');}finally{ta.remove();}}
  toast('コピーしました');
 }
 catch(_){toast('コピーできませんでした。表示された文章を選択してコピーするか、テキスト保存を利用してください。');}
}

 if(d.vuln){focusVuln(d.vuln);return;}
 if(d.caseCheck){const l=DATA.caseLinks[d.caseCheck];goCheck(l.checks[0]||'',d.caseCheck);return;}
 if(d.caseNotice){const l=DATA.caseLinks[d.caseNotice];goNotice(l.notice,{kind:'incident',id:d.caseNotice});return;}
 if(d.check!==undefined){goCheck(d.check);return;}
 if(d.notice){goNotice(d.notice);return;}
 if(d.vulnNotice){goNotice('vuln',{kind:'vuln',id:d.vulnNotice});return;}
 if(d.tech){focusTech(d.tech);return;}
 if(d.techCheck){goCheck(matchingChecks(d.techCheck)[0]?.id||'');return;}
 if(d.theme){closeDialogs();state.filters=defaultFilters();state.filters.theme=d.theme;state.page=0;go('incidents');return;}
 if(d.ir){showEmergency(d.ir);return;}
 if(d.actorTab){state.actorTab=d.actorTab;renderThreats();return;}
 if(d.actorReset){state.actorQuery='';state.actorCategory='';renderThreats();return;}
 if(d.actorFocus){state.threatTab='actors';state.actorTab='directory';state.actorQuery='';state.actorCategory='';go('threats');const el=$(d.actorFocus);if(el){el.open=true;el.scrollIntoView({block:'start'});el.querySelector('summary').focus();}return;}
 if(d.homeFilter){state.homeFilter=d.homeFilter;renderHome();return;}
 if(d.biSpan){state.biSpan=d.biSpan;renderBi();return;}
 if(d.day){
  if(state.filters.start===d.day&&state.filters.end===d.day){state.filters.start='';state.filters.end='';}
  else{state.filters.start=d.day;state.filters.end=d.day;}
  state.page=0;renderFilters();renderDataViews();return;
 }
 if(d.bcpTab){state.bcpTab=d.bcpTab;if(state.view!=='bcp-tools')go('bcp-tools');else renderBcpTools();return;}
 if(d.vulnFilter){state.vulnFilter=d.vulnFilter;renderThreats();return;}
 if(d.vulnExpand!==undefined){document.querySelectorAll('[data-vuln-card]').forEach(el=>{if(!el.hidden)el.open=d.vulnExpand==='1';});return;}
 if(d.vulnBcp){
  const v=byId(DATA.vulnerabilities,d.vulnBcp);
  state.checkId=v?.check||'ck-public';
  state.noticeType='vuln';
  state.noticeReference={kind:'vuln',id:d.vulnBcp};
  state.noticeText='';
  state.bcpTab='checks';
  go('bcp-tools');
  toast('脆弱性「'+v.product+'」に関連する点検・注意喚起文をセットしました');
  return;
 }
 if(d.threatTab){
  if(d.threatTab==='advisories'){state.bcpTab='bcp-docs';closeDialogs();go('bcp-tools');return;}
  state.threatTab=d.threatTab;closeDialogs();go('threats');return;
 }
 if(d.toggleGroup){state.expandedGroups[d.toggleGroup]=!state.expandedGroups[d.toggleGroup];renderIncidents();return;}
 if(d.quick){
  const qk=d.quick;
  if(qk==='updates')applyFilter('updates',!state.filters.updates);
  else if(qk==='edu')applyFilter('industry',state.filters.industry==='教育・研究'?'':'教育・研究');
  else if(qk==='confirmed')applyFilter('status',state.filters.status==='漏えい確認'?'':'漏えい確認');
  else if(qk==='vendor')applyFilter('cat',state.filters.cat==='委託先被害'?'':'委託先被害');
  else if(qk==='ransom')applyFilter('cat',state.filters.cat==='ランサムウェア'?'':'ランサムウェア');
  else if(qk==='outage')applyFilter('cat',state.filters.cat==='サービス停止'?'':'サービス停止');
  return;
 }
 if(d.group){state.grouped=false;applyFilter('group',d.group);return;}
 if(d.barField){applyFilter(d.barField,d.barValue);return;}
 if(d.matrixIndustry){state.filters.industry=d.matrixIndustry;state.filters.cat=d.matrixCat;state.page=0;renderFilters();renderDataViews();return;}
 if(d.month){state.filters.start=d.month+'-01';const [y,m]=d.month.split('-').map(Number);state.filters.end=d.month+'-'+new Date(y,m,0).getDate();state.page=0;renderFilters();renderDataViews();return;}
 if(d.clear){applyFilter(d.clear,d.clear==='updates'?false:'');return;}
 if(d.page){state.page+=Number(d.page);renderIncidents();return;}
 if(d.copyCase){const r=caseById(d.copyCase);await copyText('参考事例：'+r.org+'\n公表日（初回等）：'+r.date+'\n確認状況：'+r.status+'\n経緯・影響：'+r.impact+'\n対象範囲：'+r.scope+'\n対象外・未確認：'+(r.exclude||'未記載')+'\n出典：'+r.sources.map(s=>s.url).join('\n')+'\n\n'+DATA.meta.incidentSource);return;}
 switch(d.action){
  case 'emergency':showEmergency();break;
  case 'about':renderAbout();break;
  case 'top':window.scrollTo({top:0,behavior:'smooth'});break;
  case 'reset':state.filters=defaultFilters();state.page=0;renderFilters();renderDataViews();break;
  case 'education':applyFilter('industry','教育・研究');break;
  case 'updates':state.filters=defaultFilters();state.filters.basis='updated';state.filters.updates=true;state.page=0;go('incidents');break;
  case 'csv':download('security_incidents_'+DATA.meta.incidentSnapshotDate+'.csv',incidentCsv(selectedRows()),'text/csv;charset=utf-8');toast('絞り込み後の全件をCSV出力しました');break;
  case 'export-checks':exportChecks();break;
  case 'export-bcp':exportBcp();break;
  case 'ir-home':state.irId='';renderEmergency();break;
  case 'save-ir':download('incident_initial_response_'+state.irId+'.txt',irRecord());break;
  case 'copy-ir':await copyText(irRecord());break;
  case 'build-notice':state.noticeText=buildNotice();$('notice-text').value=state.noticeText;$('notice-rebuild-hint').hidden=true;toast('設定を反映した文案に置き換えました');break;
  case 'copy-notice':state.noticeText=$('notice-text').value;await copyText(state.noticeText);break;
  case 'save-notice':state.noticeText=$('notice-text').value;download('security_notice.txt',state.noticeText);break;
  case 'print':printCurrent();break;
  case 'print-results':printResults();break;
 }
});
document.addEventListener('change',e=>{
 const el=e.target,d=el.dataset;
 if(el.id==='actor-category'){state.actorCategory=el.value;applyActorFilters();return;}
 if(el.id==='actor-evidence'){state.actorEvidence=el.value;document.querySelectorAll('[data-event-kind]').forEach(x=>{x.hidden=!!el.value&&x.dataset.eventKind!==el.value;});return;}
 if(d.filter){if(d.filter==='q')return;applyFilter(d.filter,el.type==='checkbox'?el.checked:el.value);return;}
 if(el.id==='sort-select'){state.sort=el.value;state.page=0;renderIncidents();return;}
 if(el.id==='group-toggle'){state.grouped=el.checked;state.page=0;renderIncidents();return;}
 if(el.id==='check-select'){state.checkId=el.value;renderChecks();return;}
 if(d.checkAnswer){state.checkAnswers[d.checkAnswer]=el.value;return;}
 if(d.irCheck){
  if(el.checked)state.irChecks[d.irCheck]=nowJst();else delete state.irChecks[d.irCheck];
  const row=el.closest('.ir-step');row.classList.toggle('step-checked',el.checked);row.querySelector('.ir-checked-at').textContent=el.checked?'チェック時刻 '+state.irChecks[d.irCheck]:'';
  const p=byId(DATA.playbooks,state.irId),total=p.first.length+p.next.length,done=[...p.first.map((_,i)=>p.id+':first:'+i),...p.next.map((_,i)=>p.id+':next:'+i)].filter(k=>state.irChecks[k]).length;
  $('ir-progress').textContent='確認チェック '+done+' / '+total+'（対応完了の判定ではありません）';return;
 }
 const noticeMap={'notice-type':'noticeType','notice-audience':'noticeAudience','notice-scope':'noticeScope','notice-contact':'noticeContact'};
 if(noticeMap[el.id]){state[noticeMap[el.id]]=el.value;$('notice-rebuild-hint').hidden=false;return;}
 if(el.id==='notice-reference'){const [kind,id]=el.value.split(':');state.noticeReference=id?{kind:kind==='v'?'vuln':'incident',id}:null;$('notice-rebuild-hint').hidden=false;}
});
let searchTimer;
document.addEventListener('input',e=>{
 const el=e.target,d=el.dataset;
 if(d.filter==='q'){state.filters.q=el.value;state.page=0;clearTimeout(searchTimer);searchTimer=setTimeout(renderDataViews,120);}
 if(d.checkNote)state.checkNotes[d.checkNote]=el.value;
 if(el.id==='ir-memo-text')state.irMemos[state.irId]=el.value;
 if(el.id==='notice-text')state.noticeText=el.value;
 if(el.id==='notice-scope'){state.noticeScope=el.value;$('notice-rebuild-hint').hidden=false;}
 if(el.id==='notice-contact'){state.noticeContact=el.value;$('notice-rebuild-hint').hidden=false;}
});
window.addEventListener('afterprint',()=>document.body.classList.remove('print-dialog'));
function handleHash(){
 let hash='';try{hash=decodeURIComponent(location.hash.slice(1));}catch(_){}
 if(hash.startsWith('incident/')){if(state.view!=='incidents')go('incidents',false);showCase(hash.slice(9));}
 else if(hash.startsWith('ir/'))showEmergency(hash.slice(3));
 else if(views.includes(hash)){if(hash!==state.view)go(hash,false);}
}
window.addEventListener('hashchange',handleHash);
$('edition').innerHTML='事例基準 '+esc(DATA.meta.incidentSnapshotDate)+'<br>画面改訂 '+esc(DATA.meta.uiReviewed)+' ／ v'+esc(DATA.meta.version);
const ageDays=Math.floor((Date.now()-Date.parse(DATA.meta.compiledDate+'T00:00:00+09:00'))/86400000);
if(ageDays>7){$('stale-banner').textContent='この配布版の生成から'+ageDays+'日経過しています。個々の情報確認日と公式の最新情報を確認してください。';$('stale-banner').hidden=false;}
renderView();handleHash();
window.__BCP_HUB__={DATA,state,filterRows,aggregateCount,incidentCsv,csvCell,buildNotice,irRecord,renderView,renderEmergency,showCase,go,showEmergency,focusTech,focusVuln,renderChecks,renderNotices,renderBi,renderThreats};



document.addEventListener('toggle',e=>{
 if(e.target&&e.target.id==='adv-filter-details')state.advFiltersOpen=e.target.open;
},true);
</script>
</body>
</html>
