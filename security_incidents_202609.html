/* === UI/UX Enhancements (v2) === */
:root{--green:#1e7e53;--green-light:#eef8f3;--slate:#5a6b79;--slate-light:#f1f4f7}
.badge.green{border-color:#b5dfc9;color:var(--green);background:var(--green-light)}
.badge.slate{border-color:#d0dae2;color:var(--slate);background:var(--slate-light)}
.tabular{font-variant-numeric:tabular-nums}
.kpi .value,.bar-number,.trend-item,.data-table td:first-child,.update-row .fine,time{font-variant-numeric:tabular-nums}
.line-clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.55}
.readable-block p,.readable-block li,.definition dd{max-width:68ch}

/* Compact Table & Row Hierarchy */
.data-table td{padding:10px 12px;vertical-align:middle}
.data-table tr.row-resolved{background:#f8fafb;color:var(--muted)}
.data-table tr.row-resolved .org-btn{color:var(--slate);font-weight:600}
.data-table tr.row-group-parent{background:#f4fbfa;border-left:4px solid var(--teal)}
.data-table tr.row-group-child{background:#fafcfd}
.data-table tr.row-group-child td:first-child{padding-left:26px;position:relative}
.data-table tr.row-group-child td:first-child:before{content:"└";position:absolute;left:10px;color:var(--teal);font-weight:700}
.scope-cell{font-size:11.5px;color:var(--ink)}
.row-resolved .scope-cell{color:var(--muted)}
.exclude-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.exclude-tag{display:inline-flex;align-items:center;gap:3px;font-size:10px;padding:1px 6px;border-radius:4px;background:var(--green-light);color:var(--green);border:1px solid #b5dfc9;line-height:1.6}
.exclude-tag:before{content:"✓";font-weight:800}

/* Quick Filter Pills & Collapsible Advanced Filters */
.filters-compact{background:white;border:1px solid var(--line);border-radius:12px;margin-bottom:18px;padding:14px 18px;box-shadow:var(--shadow)}
.filter-top-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.search-box-wrap{flex:1;min-width:240px;position:relative}
.search-box-wrap input{width:100%;border:1px solid #bfd0d8;border-radius:8px;padding:8px 12px;font-size:13px;background:#fbfcfd}
.search-box-wrap input:focus{background:white;border-color:var(--teal)}
.quick-pills{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.quick-pills-label{font-size:11px;color:var(--muted);font-weight:650;margin-right:2px}
.pill-btn{border:1px solid var(--line);background:#f7f9fb;color:var(--ink);border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:600;transition:all .15s}
.pill-btn:hover{border-color:var(--teal);color:var(--teal);background:var(--teal-light)}
.pill-btn[aria-pressed="true"]{background:var(--teal);color:white;border-color:var(--teal)}
.adv-filter-expander{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.adv-filter-expander>summary{cursor:pointer;font-size:12px;font-weight:650;color:var(--teal);list-style:none;display:inline-flex;align-items:center;gap:6px;user-select:none}
.adv-filter-expander>summary::-webkit-details-marker{display:none}
.adv-filter-expander>summary:after{content:"▼";font-size:9px;transition:transform .15s}
.adv-filter-expander[open]>summary:after{transform:rotate(180deg)}
.adv-filter-body{margin-top:12px;padding-top:4px}

/* Modal 3-Point Summary & Exclude Box */
.summary-box-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:16px 0;background:#f5f9fa;border:1px solid #cbe0e0;border-radius:10px;padding:14px}
.summary-item{background:white;border:1px solid var(--line);border-radius:8px;padding:11px 13px}
.summary-item .s-label{font-size:10.5px;font-weight:750;color:var(--teal);letter-spacing:.06em;margin-bottom:4px;display:block}
.summary-item .s-val{font-size:12.5px;line-height:1.55;color:var(--navy);font-weight:600}
.exclude-callout{background:var(--green-light);border:1px solid #b5dfc9;border-left:4px solid var(--green);border-radius:8px;padding:12px 15px;margin:14px 0}
.exclude-callout h4{color:var(--green);font-size:12.5px;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.exclude-callout p{font-size:12px;color:#1b4d36;max-width:68ch}
@media(max-width:760px){.summary-box-grid{grid-template-columns:1fr}}


/* === UI/UX Enhancements (v3) === */
.bcp-tool-switcher{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}
.bcp-tab-card{border:1px solid var(--line);background:white;border-radius:11px;padding:15px 18px;text-align:left;transition:all .15s;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.bcp-tab-card:hover{border-color:var(--teal);background:#f7fcfb}
.bcp-tab-card[aria-pressed="true"]{border:2px solid var(--teal);background:var(--teal-light)}
.bcp-tab-card .t-step{font-size:10px;font-weight:750;letter-spacing:.1em;color:var(--teal)}
.bcp-tab-card strong{font-size:15px;color:var(--navy);display:block}
.bcp-tab-card span{font-size:11.5px;color:var(--muted);line-height:1.45}
@media(max-width:760px){.bcp-tool-switcher{grid-template-columns:1fr}}

/* Daily BI Chart */
.chart-card-wide{grid-column:1/-1}
.chart-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.trend-daily{display:flex;gap:5px;align-items:end;min-height:195px;margin-top:12px;padding:14px 6px 8px;overflow-x:auto;border-bottom:1px solid var(--line);background:#fafcfd;border-radius:8px}
.trend-daily .trend-item{min-width:28px;flex:1;height:175px;justify-content:end}
.trend-daily .trend-item[aria-pressed="true"] .trend-fill{background:var(--red)}
.trend-daily .trend-item[aria-pressed="true"] .trend-label{color:var(--red);font-weight:700}
.trend-daily .trend-label{font-size:9.5px;margin-top:6px;letter-spacing:-.02em}

/* Compact Action Banner on Home */
.action-shortcut-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.action-shortcut{display:flex;align-items: flex-start;justify-content:space-between;gap:14px;background:white;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.action-shortcut h3{font-size:14.5px;color:var(--navy)}
.action-shortcut .condition{font-size:11.5px;color:var(--teal);font-weight:650;margin-top:3px}
.action-shortcut .subtle{font-size:11.5px;margin-top:4px}
.action-shortcut .tools{margin-top:8px;flex-shrink:0}
@media(max-width:860px){.action-shortcut-grid{grid-template-columns:1fr}.action-shortcut{flex-direction:column}}

/* Compact Vulnerability Cards */
.vuln-compact-card>summary{cursor:pointer;list-style:none;display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.vuln-compact-card>summary::-webkit-details-marker{display:none}
.vuln-compact-card>summary:after{content:"＋ 詳細・対策";color:var(--teal);font-size:11.5px;font-weight:700;white-space:nowrap;border:1px solid #b7deda;background:var(--teal-light);padding:4px 9px;border-radius:6px;flex-shrink:0;margin-top:2px}
.vuln-compact-card[open]>summary:after{content:"− 閉じる";background:white}
.vuln-compact-body{border-top:1px solid var(--line);margin-top:14px;padding-top:12px}

details.card{align-self:start}main:focus{outline:none}

.search-row{align-items:end}.search-row>.field{min-width:0}.vuln-compact-card>summary>div{min-width:0;overflow-wrap:anywhere}

/world/67630/"},{"label":"公式続報 10/9","url":"https://jp.adventurekk.com/news/apology-notice-unauthorized-access-data-leak/"},{"label":"過去の出典：公式発表","url":"https://jp.adventurekk.com/news/apology-unauthorized-access-data-leak/"},{"label":"過去の出典：詳細項目の報道（公式詳細再確認待ち）","url":"https://rocket-boys.co.jp/security-measures-lab/skyticket_account_breach_notification_reset_error/"}],"note":"第2報で追加確認した内容は公式本文に基づく。既存3経路の詳細は従前の報道由来の記録を含むため、それぞれの出典と続報で確認する。","updated":"2026-10-18","changeType":"続報・訂正","change":"カード番号保有なしの断定を撤回。旧プレミアム手数料決済ログ最大6,140人のPAN・名義・有効期限、一部PANのみ、CVVなし。BenefitStation ID・氏名・PWも流出、復号鍵も取得。既存3経路に追加して単純合算しない","evidence":"公式続報本文を2026-10-18に確認","history":[{"date":"2026-10-09","text":"10月9日朝の調査で新規掲載。公表日と一覧反映日は区別。"},{"date":"2026-10-09","text":"3経路の対象情報・件数を更新。サーバーから約1,464万件の流出、約413万件にハッシュ化パスワード。"},{"date":"2026-10-18","text":"更新前：{\"info\": \"①氏名（パスポート表記含む）、生年月日、メール、電話番号、住所、振込依頼人名、ハッシュ化されたログインパスワード。②氏名・電話番号・返金先銀行口座（金融機関・支店・種別・番号・名義）。一部メール、生年月日、住所。③高速バスの氏名カナ、年齢・性別、生年月日（入力時）、メール、電話、会員ID、予約日時、乗車日、乗降地、支払方法・金額、同行者情報など。\", \"scope\": \"①約1,464万件の流出確認、うち約413万件にパスワードのハッシュ値。②17,780件（重複含む）に加え調査中。③約12,000予約。人数と予約数・件数は異なり合算不可。\", \"impact\": \"公式に確認できたのは、情報流出の通知メールを10月8日19時頃から送付したことと、パスワード変更要請。取得できた公式ページでは詳しい内容を10月9日以降に公表予定としている。\", \"exclude\": \"カード番号・パスポート画像は保有していない。①にはパスポート番号を含まない。②のパスポート番号は漏えい未確認・調査中。\", \"action\": \"公式サイト・アプリからパスワードを変更し、同じパスワードを使用する他サービスも変更する。利用履歴・カード明細を確認。不審な連絡のリンクから手続きしない。\"}"},{"date":"2026-10-18","text":"カード番号保有なしの断定を撤回。旧プレミアム手数料決済ログ最大6,140人のPAN・名義・有効期限、一部PANのみ、CVVなし。BenefitStation ID・氏名・PWも流出、復号鍵も取得。既存3経路に追加して単純合算しない"}],"batch":"続報","sourceUpdated":"2026-10-16","id":"inc-333a2dbe9b","industry":"交通・旅行・宿泊","secondary":{"status":"未分類・未確認","date":"","text":"二次被害の有無を今回個別に確定していない。未分類は被害なしを意味しない。","checked":""},"checked":"2026-10-18"},{"date":"2026-10-08","org":"八十二長野銀行","cat":["フィッシング","アカウント乗っ取り","情報漏えい"],"status":"漏えいの可能性","info":"職員1人のメールアカウント内の一部メール等が閲覧されたことを確認し、漏えいの可能性がある範囲を精査。氏名・勤務先・電話・メール、法人名・海外拠点名や取引情報、関係機関名等を含む。","impact":"10月7日に海外企業を装うフィッシングメールから正規の認証機能を悪用した認証操作を誘導され、同日アカウントを遮断。10/19第2報で既存事案の可能性範囲を特定した。新たな漏えい発生の公表ではない。","scope":"個人34人、法人627社（社名・海外拠点名531社と取引情報96社）、関係11機関。初報の35メールアドレスは11機関分であり、34人へ加算しない。","exclude":"他の職員アカウントへの侵入、口座情報・暗証番号の漏えいは確認されていない。正規認証機能の具体的な悪用方式、MFA回避の有無は非開示。全件持ち出し確認としない。","action":"対象者・法人の個別連絡を確認し、不審連絡は既知の窓口へ照会。自組織では正規の認証画面でも操作の依頼元・目的を確認し、不審な認証操作後はセッションや連携権限を調べる。","sources":[{"label":"今回確認した公式発表・続報","url":"https://bank.82group.jp/file.jsp?id=release%2F2026%2Fpdf%2Fnews20261019.pdf"},{"label":"公式発表","url":"https://bank.82group.jp/file.jsp?id=release%2F2026%2Fpdf%2Fnews20261008.pdf"}],"note":"初報の「35人」を35メールアドレス・11機関と整理し直した続報。異なる単位を足して被害人数を作らない。","updated":"2026-10-20","changeType":"続報・補完","change":"第2報。個人34名・法人627社（社名／海外拠点名531社、取引情報96社）・関係11機関。初報35メールは11機関分の説明で、34名へ加算しない。同一事案の範囲精査で新たな攻撃・全件持ち出し確認としない。正規認証機能を悪用したメール誘導を公表したが具体的方式・MFA回避は未公表。","history":[{"date":"2026-10-09","text":"10月9日朝の調査で新規掲載。公表日と一覧反映日は区別。"},{"date":"2026-10-20","text":"更新前：{\"org\": \"八十二長野銀行\", \"info\": \"35人のメールアドレスが流出した可能性。その他の情報は確認中。\", \"scope\": \"メールアドレス35人分。その他の影響範囲は調査中。\", \"impact\": \"不審メールを起点に職員メールアカウントへ不正アクセス。発生10月7日、発覚10月8日。アカウントへのアクセスを遮断し対象者へ連絡。\", \"exclude\": \"不正利用は未確認。銀行口座情報が流出したとは断定できない。\", \"action\": \"対象者への個別通知を確認し、不審な連絡は公式窓口へ確認する。\", \"status\": \"漏えいの可能性\", \"sources\": [{\"label\": \"公式発表\", \"url\": \"https://bank.82group.jp/file.jsp?id=release%2F2026%2Fpdf%2Fnews20261008.pdf\"}], \"secondary\": {\"status\": \"未分類・未確認\", \"date\": \"\", \"text\": \"二次被害の有無を今回個別に確定していない。未分類は被害なしを意味しない。\", \"checked\": \"\"}, \"sourceUpdated\": \"2026-10-09\"}"},{"date":"2026-10-20","text":"第2報。個人34名・法人627社（社名／海外拠点名531社、取引情報96社）・関係11機関。初報35メールは11機関分の説明で、34名へ加算しない。同一事案の範囲精査で新たな攻撃・全件持ち出し確認としない。正規認証機能を悪用したメール誘導を公表したが具体的方式・MFA回避は未公表。"}],"batch":"続報","sourceUpdated":"2026-10-19","id":"inc-e0a82b848b","industry":"金融・保険","secondary":{"status":"公表時点で報告なし","date":"2026-10-19","checked":"2026-10-20","text":"公式第2報は不正利用による被害の申し出なしと説明。今後の可能性を否定するものではない。"},"checked":"2026-10-20","evidence":"公式発表・続報本文を2026-10-20（JST）の調査で確認。初回公表日・情報日・本HTMLの反映日を区別。"},{"date":"2026-10-08","org":"フレックス／FLEX GALLERY","cat":["設定不備","情報漏えい"],"status":"閲覧可能状態","info":"顧客の氏名、生年月日、性別、住所、電話番号、メールアドレス。","impact":"クラウド型本部システムの提供事業者の管理不備により、同じサーバーを利用する特定の1社が顧客情報を閲覧できる状態だった。問題は解消済み。","scope":"対象人数は確認できず。","exclude":"相手企業から閲覧していない旨を確認。実際の閲覧、不正利用、被害は未確認。","action":"対象者への個別通知を確認し、不審な連絡は公式窓口へ確認する。","sources":[{"label":"公式発表","url":"https://www.flex-g.com/topics/?c=zoom&pk=648"}],"note":"","updated":"2026-10-09","changeType":"新規追加","change":"10月9日朝の調査で新規掲載。公表日と一覧反映日は区別。","history":[{"date":"2026-10-09","text":"10月9日朝の調査で新規掲載。公表日と一覧反映日は区別。"}],"batch":"以前","sourceUpdated":"2026-10-09","id":"inc-6b3aa18d3e","industry":"その他企業・団体","secondary":{"status":"未分類・未確認","date":"","text":"二次被害の有無を今回個別に確定していない。未分類は被害なしを意味しない。","checked":""}},{"date":"2026-10-07","org":"IDCフロンティア／IDCFクラウド","cat":["ランサムウェア","サービス停止"],"status":"不正照会確認","info":"IDCFクラウドポータルの48社の登録情報への不正照会を確認。企業名、ログインID、パスワードのハッシュ値（同社は復元困難かつランダムと説明）、通知先の企業メールアドレス、月額利用料金合計。2社各1件のメールアドレスに担当者個人名を含む可能性。外部持ち出しの痕跡は未確認。","impact":"ランサムウェアにより10/7から東日本リージョン1の4ゾーン（tesla・henry・pascal・joule）で障害。10/14第5報：仮想サーバー内のデータの照会・持ち出しの痕跡や裏付ける事実はなく、同社は外部流出なしと判断。以前は取り出し・復元困難とされたが、495契約先のうちスナップショット利用194契約先でバックアップ取り出しが可能と判明。復元可否と提供方法は個別案内。 10/18第6報：安全性を確認した「IDCFクラウド バックアップ」の提供を再開。稼働継続中の東日本1（radian・newton）・東日本2・東日本3・西日本1の利用者がデータを取得し、他社クラウドやオンプレミスへ復元可能と案内。","scope":"495の企業・自治体に影響。","exclude":"仮想サーバー内データと、ポータル登録情報の不正照会は別。全データ復旧済みではない。他ゾーン等は安全性調査を継続。TypeS・プライベートクラウドは本事象対象外。 第6報時点でもスナップショット機能は停止中。今回のバックアップ再開は、障害対象4ゾーンの全面復旧を示す発表ではない。","action":"対象ゾーン・稼働状況とバックアップ利用可否を照合。復元先の容量・権限・業務データの整合性を検証し、停止機能と再開条件を別々に確認する。バックアップ取得・復元可否だけで業務再開を確定しない。","sources":[{"label":"今回確認した公式続報","url":"https://www.idcf.jp/news/topics/20261018001/"},{"label":"10/14公式第5報","url":"https://www.idcf.jp/news/topics/20261014001"},{"label":"公式サイト状況更新（10/13 18:00）","url":"https://www.idcf.jp/"},{"label":"公式第4報","url":"https://www.idcf.jp/news/topics/20261009001/"},{"label":"過去の出典：公式発表","url":"https://www.idcf.jp/news/topics/20261007002"},{"label":" part.jp/movabletype/news/2026/10/08-0900.html\"}, {\"label\": \"過去の出典：サイバー大学第2報（10/8）\", \"url\": \"https://www.cyber-u.ac.jp/information/y261008_02.html\"}, {\"label\": \"過去の出典：公式第3報（10/8）\", \"url\": \"https://www.idcf.jp/news/topics/20261008001\"}], \"secondary\": {\"status\": \"報告なし（公表時点）\", \"date\": \"2026-10-14\", \"checked\": \"2026-10-15\", \"text\": \"10/14第5報では、本件に起因する情報の不正利用や二次被害は現時点で未確認と説明。\"}, \"sourceUpdated\": \"2026-10-14\"}"},{"date":"2026-10-19","text":"第6報でIDCFクラウド バックアップ再開。稼働継続ゾーン等の利用者が対象。他社クラウド・オンプレミスへの復元も可能。スナップショットは引き続き停止。障害4ゾーン全面復旧を示す発表ではない。既存48社ポータル照会等の範囲は上書きしない。"}],"batch":"続報","sourceUpdated":"2026-10-18","id":"inc-ccef27afb5","group":"IDCF","industry":"IT・通信","secondary":{"status":"報告なし（公表時点）","date":"2026-10-14","checked":"2026-10-15","text":"10/14第5報では、本件に起因する情報の不正利用や二次被害は現時点で未確認と説明。"},"checked":"2026-10-19","evidence":"公式続報本文を2026-10-19（JST）の調査で確認。続報日と本HTMLの反映日を区別。"},{"date":"2026-10-07","org":"戸田建設","cat":["不正アクセス","情報漏えい"],"status":"漏えい確認","info":"取引先のメールアドレス最大7,200件、取引データ最大6,000件。従業員4,778人の氏名、住所、電話番号、メールアドレス、所属部署。","impact":"取引先への支払いを管理するシステム等への不正アクセス。対象システムを隔離。","scope":"取引先と従業員が対象。各区分の件数は単純合算しない。","exclude":"取引データの詳細項目は未公表。銀行口座情報などを含むとは推定しない。公開・不正利用は未確認。","action":"運営元の個別通知を確認し、関係者を装う不審な連絡は公式窓口で確認する。","sources":[{"label":"公式発表","url":"https://www.toda.co.jp/news/2026/20261007_006350.html"}],"note":"","updated":"2026-10-13","changeType":"記述補足","change":"10/7公表時点で流出情報の公開・悪用は確認されていない旨を補足。新たな続報ではない。","history":[{"date":"2026-10-07","text":"今回の一覧に新規掲載。"},{"date":"2026-10-13","text":"10/7公表時点で流出情報の公開・悪用は確認されていない旨を補足。新たな続報ではない。"}],"batch":"以前","sourceUpdated":"2026-10-07","id":"inc-026a358646","industry":"その他企業・団体","secondary":{"status":"公表時点で報告なし","date":"2026-10-07","checked":"2026-10-13","text":"10/7公表時点で流出情報の公開・悪用は確認されていない。現時点の被害不存在を保証しない。"}},{"date":"2026-10-07","org":"HIS／H.I.S. TOURS（タイ子会社）","cat":["不正アクセス","情報漏えい"],"status":"漏えいの可能性","info":"パスポート情報（ローマ字氏名、署名の氏名、性別、生年月日、パスポート番号、有効期限）およびアレルギー情報。","impact":"タイ子会社への不正アクセスに関する調査結果を公 性\"}"},{"date":"2026-10-17","text":"対象規模を最大59万3,000人へ更新。氏名、住所、電話、メール、過去の注文情報。カード情報・ログインパスワードは対象外。過去の注文情報を含むなりすましメール、フィッシングメールの配信を公式確認。 既掲載の注意事項に加え、二次被害欄の「未分類・未確認」を修正する。"}],"batch":"続報","sourceUpdated":"2026-10-15","id":"inc-e7b677efa1","industry":"その他企業・団体","secondary":{"status":"不審連絡確認","date":"2026-10-15","checked":"2026-10-17","text":"流出した過去の注文情報を含むなりすまし・フィッシングメールを公式確認。金銭被害の確認とは区別。"},"updated":"2026-10-17","changeType":"続報更新","change":"対象規模を最大59万3,000人へ更新。氏名、住所、電話、メール、過去の注文情報。カード情報・ログインパスワードは対象外。過去の注文情報を含むなりすましメール、フィッシングメールの配信を公式確認。 既掲載の注意事項に加え、二次被害欄の「未分類・未確認」を修正する。"},{"date":"2026-10-02","org":"大阪公立大学","cat":["ランサムウェア","サービス停止","委託先被害","情報漏えい"],"status":"一部漏えい確認","info":"NECが利用していたクラウドストレージ内の大学関連の個人情報・システム関連情報の漏えいを確認したとの報告。詳細な項目・件数は確認中。大学の仮想化基盤内からの漏えい有無は別途調査中。","impact":"10月9日から全キャンパスで対面授業を再開予定。Moodle等は暫定利用を案内。10月8日17時発表で学生・教職員間メールは利用可能。外部からの受信は10月8日中、外部への送信は10月13日頃の再開予定。調査・復旧は継続中。全面復旧ではない。 10/11 12:13更新：二要素認証の設定・リセットが利用不可。既に利用できているSSOは継続利用可能。 10/13公表：OMU認証パスワードの強制変更は10/12中に完了。Microsoft 365、Google、Zoom、Adobe等の認証には新パスワードが必要。同日21時にOMUメール利用再開を告知。全機能・学外送信の全面復旧を確認したものではない。 10/15 13:40：付番済みOMUIDの利用開始は4キャンパスの対面相談窓口で対応。10/2以降の新規採用者等への新規ID発行は準備中。 10/21第5報：9月下旬に攻撃を受けたNEC再委託先が持つ正規アカウントからの不正アクセスが、10/2障害の原因であると報告を受けたと大学が公表。NEC共有ストレージ内の情報漏えいも確認。","scope":"全キャンパスの多くの情報システム。NEC保存先の確認済み情報と、大学の仮想化基盤内の教務関連約13万件等の調査中情報を区別する。","exclude":"附属病院・獣医臨床センターは通常運営と説明。 教務関連約13万件等は大学の仮想化基盤内にある別の調査対象。NECのストレージで漏えい確認した情報の件数に置き換えない。","action":"大学の最新の構成員向け案内に従い、認証・メール・授業支援の機能別の稼働と代替手段を確認。自組織では再委託先の正規IDが到達できる基盤と、外部共有情報の調査を並行して進める。","sources":[{"label":"今回確認した公式続報","url":"https://www.omu.moe/news/2026-10-21-1d69aecb.html"},{"label":"今回確認した公式続報","url":"https://www.omu.moe/news/2026-10-15-c805484f.html"},{"label":"10/13公式続報：OMU認証パスワード強制変更完了","url":"https://www.omu.moe/news/2026-10-12-3bda82fa.html"},{"label":"公式お知らせ一覧（メール再開の告知。詳細は学内限定）","url":"https://www.omu.moe/news/"},{"label":"今回の公式続報","url":"https://www.omu.moe/news/2026-10-10-cc690fe5.html"},{"label":"臨時お知らせ・10/10相談窓口案内","url":"https://www.omu.moe/news/"},{"label":"10/9メール復旧状況","url":"https://www.omu.moe/news/2026-10-09-2a387318.html"},{"label":"過去の出典：公式発表","url":"https://www.omu.moe/news/2026-10-06-7fb5a624.html"},{"label":"過去の出典：公式：障害初報・休講案内","url":"https://e.omu.ac.jp/"},{"label":"過去の出典：報道：保管情報の規模（MBS）","url":"https://newsdig.tbs.co.jp/articles/mbs/2990964?display=1"},{"label":"過去の出典：授業に関する続報（10/7）","url":"https://www.omu.moe/news/2026-10-06-0e4be7e6.html"},{"label":"過去の出典：メールに関する続報（10/7）","url":"https://www.omu.moe/news/2026-10-06-9a161963.html"},{"label":"過去の出典：授業・システム続報（10/8）","url":"https://www.omu.moe/news/2026-10-08-c5873744.html"},{"label":"過去の出典：メール復旧状況（10/8）","url":"https://www.omu.moe/news/2026-10-08-a832f149.html"}],"note":"10/21第5報を追加。障害の原因判明、外部保存先の漏えい確認、大学基盤内の漏えい調査を別々に記載。従来の機能復旧記録は各告知日時点の経過であり、現時点の全機能の稼働確認ではない。","updated":"2026-10-22","followup":"2026-10-08 17:00","changeType":"続報・補完","change":"NEC再委託先の正規アカウントから侵入が障害原因。NEC共有ストレージの情報漏えい確認。仮想化基盤内の教務約13万件の疑いとは別で、後者は引き続き調査。","history":[{"date":"2026-10-08","text":"10/9の全キャンパス対面授業再開予定と、学内メールの一部復旧を反映。"},{"date":"2026-10-10","text":"10/9にOMU認証パスワードのリセット案内、10/10に相談窓口の案内。メールも段階的に復旧。"},{"date":"2026-10-12","text":"10/11 12:13更新：二要素認証の設定・リセットが利用不可。既に利用できているSSOは継続利用可能。"},{"date":"2026-10-13","text":"10/12：OMU認証パスワードの強制変更を案内。同日21時にOMUメール利用再開を告知。詳細は学内向け。"},{"date":"2026-10-14","text":"10/13公表：OMU認証パスワードの強制変更が10/12中に完了。新パスワード受領方法・相談窓口を更新。新たな漏えい確定ではない。"},{"date":"2026-10-16","text":"10/15 13:40：付番済みOMUIDの利用開始は4キャンパスの対面相談窓口で対応。10/2以降の新規採用者等への新規ID発行は準備中。"},{"date":"2026-10-22","text":"更新前：{\"sourceUpdated\": \"2026-10-15\", \"status\": \"調査中\", \"info\": \"個人情報流出の有無は調査中。具体的な漏えい項目・漏えい人数は未確定。報道の約13万人分は保管情報の規模であり流出人数ではない。\", \"scope\": \"全キャンパスの多くの情報システム。\", \"impact\": \"10月9日から全キャンパスで対面授業を再開予定。Moodle等は暫定利用を案内。10月8日17時発表で学生・教職員間メールは利用可能。外部からの受信は10月8日中、外部への送信は10月13日頃の再開予定。調査・復旧は継続中。全面復旧ではない。 10/11 12:13更新：二要素認証の設定・リセットが利用不可。既に利用できているSSOは継続利用可能。 10/13公表：OMU認証パスワードの強制変更は10/12中に完了。Microsoft 365、Google、Zoom、Adobe等の認証には新パスワードが必要。同日21時にOMUメール利用再開を告知。全機能・学外送信の全面復旧を確認 007件。暗号化本人確認画像1464800件外部送信、891602件はアクセス痕跡のみ計2356402件。重複合算人数不可。暗号化≠復号閲覧確認、将来リスク否定不可。本人確認終了後非保持へ規則変更、既存画像10月末削除予定（完了でない）。タイムズクラブ関連も少数内訳、画像表3枚目視確認済み。","history":[{"date":"2026-10-09","text":"公式FAQの10/6追加分と、宮崎県等の免許証再交付に関する報道を補足。漏えい件数の増加ではない。"},{"date":"2026-10-17","text":"更新前：{\"info\": \"氏名、住所、生年月日、電話、メール、法人・部署、運転免許証情報、連携ID、不可逆変換済みパスワード。約160万アカウントでは免許証、公共料金書類、学生証、家族確認書類等の画像にも影響。\", \"scope\": \"退会者を含む約660万アカウント。画像対象はその一部。\", \"status\": \"漏えい確認\"}"},{"date":"2026-10-17","text":"運転免許証等の本人確認書類画像の保有方針を変更。 登録確認後は即時削除し、現在保有する画像も本人の申出にかかわらず10月末までに削除予定。次の調査結果等の案内を10月23日へ変更。今回の続報で漏えい件数が増えたわけではない。"},{"date":"2026-10-24","text":"更新前：{\"status\": \"漏えい確認\", \"info\": \"氏名、住所、生年月日、電話、メール、法人・部署、運転免許証情報、連携ID、不可逆変換済みパスワード。約160万アカウントでは免許証、公共料金書類、学生証、家族確認書類等の画像にも影響。\", \"scope\": \"退会者を含む約660万アカウント。画像対象はその一部。\", \"impact\": \"会員システムへの不正アクセス。 10/16第4報：本人確認書類画像は登録確認後に即時削除。保有画像も本人の申出にかかわらず10月末までに削除予定。次の調査結果等の案内は10/23予定。\", \"exclude\": \"カード情報は対象外。不可逆変換済みでも使い回しは避ける。 同社保有画像の削除は流出済み画像の回収・無効化を意味しない。今回の続報による漏えい件数の増加ではない。\", \"action\": \"公式FAQの本人確認書類を用いたなりすまし・認証コード等の聞き出しへの注意を確認。不審な連絡へ情報を渡さない。同一パスワードを使う他サービスも見直す。宮崎県等では免許証再交付の特例措置が報道されているため、希望者は居住地の警察・免許窓口へ条件を確認する。全国一律の再交付条件や番号全桁の変更を保証するものではない。\", \"sourceUpdated\": \"2026-10-16\", \"secondary\": {\"status\": \"未分類・未確認\", \"date\": \"\", \"text\": \"二次被害の有無を今回個別に確定していない。未分類は被害なしを意味しない。\", \"checked\": \"\"}}"},{"date":"2026-10-24","text":"第5報。属性情報6628007件。暗号化本人確認画像1464800件外部送信、891602件はアクセス痕跡のみ計2356402件。重複合算人数不可。暗号化≠復号閲覧確認、将来リスク否定不可。本人確認終了後非保持へ規則変更、既存画像10月末削除予定（完了でない）。タイムズクラブ関連も少数内訳、画像表3枚目視確認済み。"}],"batch":"続報","sourceUpdated":"2026-10-23","id":"inc-eb7e432ef8","industry":"交通・旅行・宿泊","secondary":{"status":"未分類・未確認","date":"","text":"二次被害の有無を今回個別に確定していない。未分類は被害なしを意味しない。","checked":""},"checked":"2026-10-24"},{"date":"2026-09-18","org":"PFU／旧PFUダイレクト","cat":["委託先被害","情報漏えい"],"status":"漏えい確認","info":"購入者・配送先の氏名、住所、電話、FAX、メール、勤務先、自由記入欄等。","impact":"旧ショップサーブ利用店舗への攻撃に伴う影響。","scope":"最大169,355件の注文情報。主に2008年12月5日〜2025年10月31日の旧店舗注文等。","exclude":"注文件数であり実人 date":"2026-09-16","org":"Helpfeel／Gyazo","cat":["不正アクセス","情報漏えい"],"status":"漏えい確認","info":"氏名・ニックネーム、メール、パスワードハッシュ、ユーザーID、端末ID、セッションID、X連携トークン、Google SSO関連プロフィール、登録・ログイン・契約情報。画像URL・ID、送信元IP、EXIF位置情報、OCR、タイトル、元URL、非公開画像のパスフレーズハッシュ等のメタデータ。","impact":"10/21第三報：外部専門機関の最終調査報告を受領。自社の動画変換処理で入力がコマンドとして解釈される脆弱性を悪用され、到達可能なDBの大量読出しと外部送信を確認。9/12に修正。9/27にサービスを再開し、既存画像は所有者確認後に配信する方式を継続。","scope":"約2,362万アカウント（匿名約1,801万、メール登録約562万。概数のため内訳と総数が丸めで一致しない場合あり）。画像メタデータの記録と画像本体を区別。133ユーザーの一部画像の閲覧・取得を確認。","exclude":"サプライチェーン起因ではなく自社システムの脆弱性と提供元が説明。画像の大量取得を示す記録はなく、133ユーザーの特定画像を確認。それ以外の画像URL経由の閲覧可能性は完全には否定できない。送信内容のログがないため、第三者調査が全項目・件数を直接確認したという意味ではない。","action":"Gyazoと同一・類似パスワードを使うサービスのパスワード変更。連携アプリ・セッションも確認。画像URLや位置情報を含む公開範囲を見直す。 公開再開前に画像の内容と共有範囲を所有者が確認する。自組織では動画・画像変換処理の入力検証、変換環境からDBへの到達権限、保存期間と外部送信ログを点検する。","sources":[{"label":"今回確認した公式続報","url":"https://corp.helpfeel.com/news/news-20261021"},{"label":"公式発表","url":"https://corp.helpfeel.com/news/news-20260916-1"},{"label":"公式続報 9/25","url":"https://corp.helpfeel.com/en/news/news-20260925"}],"note":"約4.9億件・約240万件・削除済み約1.74億件は画像メタデータの各記録区分であり、画像ファイル流出件数や重複除外人数としない。133ユーザーの対象画像にHelpfeel・Cosense顧客情報は含まれないと説明。両サービス自体の不正アクセス・漏えいの痕跡は未確認という評価を維持。","history":[{"date":"2026-10-22","text":"更新前：{\"sourceUpdated\": \"2026-09-16\", \"status\": \"漏えい確認\", \"info\": \"氏名・ニックネーム、メール、パスワードハッシュ、ユーザーID、端末ID、セッションID、X連携トークン、Google SSO関連プロフィール、登録・ログイン・契約情報。画像URL・ID、送信元IP、EXIF位置情報、OCR、タイトル、元URL、非公開画像のパスフレーズハッシュ等のメタデータ。\", \"scope\": \"9月25日続報では匿名を含む約2,362万ユーザー記録。\", \"impact\": \"ユーザー情報と画像メタデータへの不正アクセス。削除済みデータの一部にも影響。\", \"exclude\": \"カード情報は含まない。メタデータの漏えいと全画像本体の流出を同一視しない。\", \"action\": \"Gyazoと同一・類似パスワードを使うサービスのパスワード変更。連携アプリ・セッションも確認。画像URLや位置情報を含む公開範囲を見直す。\", \"note\": \"9月25日の続報を反映。\"}"},{"date":"2026-10-22","text":"第三報最終報告。自社動画変換処理のコマンド注入→DB大量読出・外部送信。サプライチェーン起因ではないと明示。133ユーザーの一部画像閲覧取得確認。約2362万アカウントと画像メタデータを人数・画像本体に読み替えない。"}],"batch":"続報","sourceUpdated":"2026-10-21","id":"inc-00911a8c6d","industry":"IT・通信","secondary":{"status":"画像の閲覧・取得確認","date":"2026-1 時点で二次被害未確認。注文・配送・請求を装う連絡に注意。"},"group":"IDCF"},{"id":"inc-00807ad25f","date":"2026-10-13","org":"アルカディア／SpeeCAN RAIDEN・ライデン・スクール・NET119・119RAIDEN","info":"連絡先の氏名、メールアドレス、電話・FAX番号、担当者・契約者情報、配信履歴として保存された本文の内容。 10/14追加：NET119の利用者氏名、生年月日、性別、住所、電話番号、メールアドレス、FAX番号、その他登録情報。119RAIDENの連絡先氏名、メール・電話・FAX、担当者・契約情報、保存本文。","scope":"最大推定：メール約3,136,000件、電話約105,000件、FAX約15,000件。単位が異なり重複もあるため合算して人数にしない。対象6サーバー。 10/14追加の最大推定：NET119は9,020件のメールアドレスにひもづく個人情報、119RAIDENメール約97,000件・電話約17,000件・FAX約400件。サービス間・項目間の重複は不明で、合算不可。","impact":"10/11 16:30に不審挙動、10/12 3時頃に経路遮断の応急措置。10/13に侵入経路を特定し一部停止。18:47更新で項目・推定件数を公表。緊急停止対象はraiden3.ktaiwork.jpとs2.ktaiwork.jp。漏えい可能性の対象6サーバーと停止2サーバーは異なる。 10/14 15:00：NET119・119RAIDENでも不正アクセスの形跡を確認し調査を全サービスへ拡大。当該追加2サービスは公表時点で通常利用可能。 10/15第9報：停止対象サーバーは15時頃復旧。全サービス復旧と説明。漏えい範囲は調査継続。全顧客にログインパスワード変更を要請。 10/16 18:10第11報：NET119の対象件数を具体化。 10/19詳細報告では、メディアサーバーのパストラバーサルからソース・設定内のサービス間キーを取得され、アカウントIDへの総当たり・内部情報取得に至った経過を説明。経路修正後にもバックドア設置と不正メール配信を確認した。","sources":[{"label":"今回確認した公式続報","url":"https://raiden.site.ktaiwork.jp/wp-content/uploads/sites/2/2026/10/2026_10_19AccessIncident.pdf"},{"label":"今回確認した公式続報","url":"https://raiden.site.ktaiwork.jp/archives/4597"}],"industry":"IT・通信","exclude":"決済情報は取り扱いなし。全利用組織の情報流出が確定したものではない。 10/14 16:00訂正：fs119.speecan.jp・119r.speecan.jpは対象外。17:12訂正：映像通報は漏えい可能性なし。対象NET119はnet119.speecan.jp・net119fd.speecan.jp、119RAIDENはfs119.ktaiwork.jp。 復旧は漏えい調査の完了を意味しない。 10/16第11報：要配慮個人情報の漏えいはないと確認。 1,423,428は不正メールの送信通数であり、漏えい人数や受信者の被害確定件数ではない。","action":"管理者は公式管理画面でログインパスワードを変更して利用する。登録者には不審メール・電話への注意を継続。 10/16 15:30第10報で、個人情報保護委員会に相談し、同意を得た顧客の代行報告を行う準備中と案内。対象者には個別に同意依頼を送る予定とされているため、最新の個別案内を確認する。 設定ファイル・キーの流出と残存するバックドア、プラグイン、cron、DB改変を調査。認証情報変更後は外部連携・電話発信・自動応答まで動作を確認する。","cat":["不正アクセス","サービス停止","不正メール送信"],"status":"漏えいの可能性","updated":"2026-10-21","sourceUpdated":"2026-10-19","batch":"続報","changeType":"続報・補完","change":"経過報告PDFを追加。パストラバーサル→設定内サービス間キー取得→総当たり・内部情報取得、バックドアから不正メール配信。総数1,423,428通は被害人数・金銭被害ではない。資格情報変更で外部連携・電話・自動応答も不具合。パッチ・鍵失効・残存侵害・連携動作検証を別工程で点検。","history":[{"date":"2026-10-14","text":"10/13の公式発表に基づき追加。公表日と一覧反映日を区別。"},{"date":"2026-10-15","text":"10/14 17:12までの続報：NET119・119RAIDENへ対象拡大。一部URL・映像通報の対象外訂正と注意喚起を反映。"},{"date":"2026-10-16","text":"10/15第9報：停止対象サーバーは15時頃復旧。全サービス復旧と説明。漏えい範囲は調査継続。全顧客にログインパスワード変更を要請。"},{"date":"2026-10-17","text":"更新前：{\"info\": \"連絡先の氏名、メールアドレス、電話・FAX番号、担当者・契約者情報、配信履歴として保存された本文の内容。 10/14追加：NET119の利用者氏名、生年月日、性別、住所、電話番号、メールアドレス、FAX番号、その他登録情報。119RAIDENの連絡先氏名、メール・電話・FAX、担当者・契約情報、保存本文。\", \"scope\": \"最大推定：メール約3,136,000件、電話約105,000件、FAX約15,000件。単位が異なり重複もあるため合算して人数にしない。対象6サーバー。 10/14追加の最大推定：NET119約13,000件、119RAIDENメール約97,000件・電話約17,000件・FAX約400件。サービス間・項目間の重複は不明で、合算不可。\", \"status\": \"漏えいの可能性\"}"},{"date":"2026-10-17","text":"第11報を反映。NET119は従来の最大約13,000件から、9,020件のメールアドレスにひもづく個人情報へ具体化。氏名、生年月日、性別、住所、電話、メール、FAX、その他登録情報。要配慮個人情報の漏えいはないことを確認と公表。119RAIDENはメール約97,000件、電話約17,000件、FAX約400件等。映像通報は対象外。"},{"date":"2026-10-19","text":"更新前：{\"info\": \"連絡先の氏名、メールアドレス、電話・FAX番号、担当者・契約者情報、配信履歴として保存された本文の内容。 10/14追加：NET119の利用者氏名、生年月日、性別、住所、電話番号、メールアドレス、FAX番号、その他登録情報。119RAIDENの連絡先氏名、メール・電話・FAX、担当者・契約情報、保存本文。\", \"scope\": \"最大推定：メール約3,136,000件、電話約105,000件、FAX約15,000件。単位が異なり重複もあるため合算して人数にしない。対象6サーバー。 10/14追加の最大推定：NET119は9,020件のメールアドレスにひもづく個人情報、119RAIDENメール約97,000件・電話約17,000件・FAX約400件。サービス間・項目間の重複は不明で、合算不可。\", \"impact\": \"10/11 16:30に不審挙動、10/12 3時頃に経路遮断の応急措置。10/13に侵入経路を特定し一部停止。18:47更新で項目・推定件数を公表。緊急停止対象はraiden3.ktaiwork.jpとs2.ktaiwork.jp。漏えい可能性の対象6サーバーと停止2サーバーは異なる。 10/14 15:00：NET119・119RAIDENでも不正アクセスの形跡を確認し調査を全サービスへ拡大。当該追加2サービスは公表時点で通常利用可能。 10/15第9報：停止対象サーバーは15時頃復旧。全サービス復旧と説明。漏えい範囲は調査継続。全顧客にログインパスワード変更を要請。 10/16 18:10第11報：NET119の対象件数を具体化。\", \"exclude\": \"決済情報は取り扱いなし。全利用組織の情報流出が確定したものではない。 10/14 16:00訂正：fs119.speecan.jp・119r.speecan.jpは対象外。17:12訂正：映像通報は漏えい可能性なし。対象NET119はnet119.speecan.jp・net119fd.speecan.jp、119RAIDENはfs119.ktaiwork.jp。 復旧は漏えい調査の完了を意味しない。 10/16第11報：要配慮個人情報の漏えいはないと確認。\", \"action\": \"管理者は公式管理画面でログインパスワードを変更して利用する。登録者には不審メール・電話への注意を継続。\", \"status\": \"漏えいの可能性\", \"sources\": [{\"label\": \"今回反映した公式続報\", \"url\": \"https://raiden.site.ktaiwork.jp/archives/4597\"}, {\"label\": \"今回確認した公式続報\", \"url\": \"https://raiden.site.ktaiwork.jp/archives/4597\"}, {\"label\": \"公式発表（10/14 17:12までの更新）\", \"url\": \"https://raiden.site.ktaiwork.jp/archives/4597\"}], \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-13\", \"checked\": \"2026-10-15\", \"text\": \"提供元発表では二次被害の確定は確認できない。関連する横須賀市では不審メール着信を確認、因果関係は未確定。\"}, \"sourceUpdated\": \"2026-10-16\"}"},{"date":"2026-10-19","text":"第10報の未反映事項を補完。PPCと相談し同意を得て代行報告を行う準備中と公表。準備完了・報告完了とせず、個別案内確認として扱う。"},{"date":"2026-10-21","text":"更新前：{\"id\": \"inc-00807ad25f\", \"date\": \"2026-10-13\", \"org\": \"アルカディア／SpeeCAN RAIDEN・ライデン・スクール・NET119・119RAIDEN\", \"info\": \"連絡先の氏名、メールアドレス、電話・FAX番号、担当者・契約者情報、配信履歴として保存された本文の内容。 10/14追加：NET119の利用者氏名、生年月日、性別、住所、電話番号、メールアドレス、FAX番号、その他登録情報。119RAIDENの連絡先氏名、メール・電話・FAX、担当者・契約情報、保存本文。\", \"scope\": \"最大推定：メール約3,136,000件、電話約105,000件、FAX約15,000件。単位が異なり重複もあるため合算して人数にしない。対象6サーバー。 10/14追加の最大推定：NET119は9,020件のメールアドレスにひもづく個人情報、119RAIDENメール約97,000件・電話約17,000件・FAX約400件。サービス間・項目間の重複は不明で、合算不可。\", \"impact\": \"10/11 16:30に不審挙動、10/12 3時頃に経路遮断の応急措置。10/13に侵入経路を特定し一部停止。18:47更新で項目・推定件数を公表。緊急停止対象はraiden3.ktaiwork.jpとs2.ktaiwork.jp。漏えい可能性の対象6サーバーと停止2サーバーは異なる。 10/14 15:00：NET119・119RAIDENでも不正アクセスの形跡を確認し調査を全サービスへ拡大。当該追加2サービスは公表時点で通常利用可能。 10/15第9報：停止対象サーバーは15時頃復旧。全サービス復旧と説明。漏えい範囲は調査継続。全顧客にログインパスワード変更を要請。 10/16 18:10第11報：NET119の対象件数を具体化。\", \"sources\": [{\"label\": \"今回確認した公式続報\", \"url\": \"https://raiden.site.ktaiwork.jp/archives/4597\"}], \"industry\": \"IT・通信\", \"exclude\": \"決済情報は取り扱いなし。全利用組織の情報流出が確定したものではない。 10/14 16:00訂正：fs119.speecan.jp・119r.speecan.jpは対象外。17:12訂正：映像通報は漏えい可能性なし。対象NET119はnet119.speecan.jp・net119fd.speecan.jp、119RAIDENはfs119.ktaiwork.jp。 復旧は漏えい調査の完了を意味しない。 10/16第11報：要配慮個人情報の漏えいはないと確認。\", \"action\": \"管理者は公式管理画面でログインパスワードを変更して利用する。登録者には不審メール・電話への注意を継続。 10/16 15:30第10報で、個人情報保護委員会に相談し、同意を得た顧客の代行報告を行う準備中と案内。対象者には個別に同意依頼を送る予定とされているため、最新の個別案内を確認する。\", \"cat\": [\"不正アクセス\", \"サービス停止\"], \"status\": \"漏えいの可能性\", \"updated\": \"2026-10-19\", \"sourceUpdated\": \"2026-10-16\", \"batch\": \"続報\", \"changeType\": \"続報・補完\", \"change\": \"第10報の未反映事項を補完。PPCと相談し同意を得て代行報告を行う準備中と公表。準備完了・報告完了とせず、個別案内確認として扱う。\", \"note\": \"10/17：今朝抽出した続報を統合。過去の対象範囲は更新履歴に保存。 今回は既出の第10報の未反映事項を補完。代行報告の準備・報告が完了したとは扱わず、一般的な報告保留の指示に置き換えない。\", \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-13\", \"checked\": \"2026-10-15\", \"text\": \"提供元発表では二次被害の確定は確認できない。関連する横須賀市では不審メール着信を確認、因果関係は未確定。\"}, \"group\": \"RAIDEN\", \"checked\": \"2026-10-19\", \"evidence\": \"公式続報本文を2026-10-19（JST）の調査で確認。続報日と本HTMLの反映日を区別。\"}"},{"date":"2026-10-21","text":"経過報告PDFを追加。パストラバーサル→設定内サービス間キー取得→総当たり・内部情報取得、バックドアから不正メール配信。総数1,423,428通は被害人数・金銭被害ではない。資格情報変更で外部連携・電話・自動応答も不具合。パッチ・鍵失効・残存侵害・連携動作検証を別工程で点検。"}],"note":"10/19詳細報告は、従来告知より詳細な調査上の時系列。提供元は社内調査で安全性を確認したと説明し、より詳細な第三者調査を今後進める方針。社内確認と外部調査完了を混同しない。代行報告の準備と本人への注意喚起も分けて扱う。","secondary":{"status":"不正メール送信確認","date":"2026-10-19","checked":"2026-10-21","text":"提供元は不正プログラムによる外部メール配信の総数1,423,428通を確認。多くはカード会社の残高確認を装う内容と説明。通数を人数・金銭被害件数に換算しない。"},"group":"RAIDEN","checked":"2026-10-21","evidence":"承認済み差分に基づき、10/21の調査で本文を照合した続報を反映。未確認の日付・範囲を推定しない。"},{"id":"inc-648d0f077e","date":"2026-10-13","org":"横須賀市／防災情報・防犯あんしんメール等","info":"防災情報メール・防犯あんしんメールのメールアドレス。FAXサービスの氏名・事業者名、電話・FAX番号、メールアドレス。電話サービスの氏名、電話・FAX番号。","scope":"防災メール47,065人、防犯メール10,848人、FAX996人、電話11人。サービス間重複の可能性があり合算して人数にしない。","impact":"RAIDEN不正アクセスに伴う漏えいの可能性。10/13に利用者から不審メールの問い合わせ。4サービスを停止し、公式サイト・SNS・防災行政無線等で代替発信。","sources":[{"label":"公式発表（10/13）","url":"https://www.city.yokosuka.kanagawa.jp/0525/nagekomi/20261013_roueinoosore.html"}],"industry":"行政・公共","exclude":"","action":"不審なメール・電話に応じず、公式サイトで確認した窓口へ照会する。リンクから認証情報を入力しない。","cat":["委託先被害","不正アクセス","サービス停止"],"status":"漏えいの可能性","updated":"2026-10-14","sourceUpdated":"2026-10-13","batch":"以前","changeType":"新規追加","change":"10/14：10/13の公式発表を確認し未掲載案件を追加。","history":[{"date":"2026-10-14","text":"10/13の公式発表に基づき追加。公表日と一覧反映日を区別。"}],"note":"攻撃手法がA2Bであるとの公式確認は得られていない。" 026-10-16","text":"公表日・公式更新日と一覧反映日を区別して追加。"}],"note":"","secondary":{"status":"報告なし（公表時点）","date":"2026-10-15","checked":"2026-10-16","text":"10/15時点で不特定多数への公開や不正利用は未確認。"}},{"id":"inc-163062585e","org":"メドレー／アットリンク","date":"2026-10-15","sourceUpdated":"2026-10-23","updated":"2026-10-24","info":"氏名、フリガナ、誕生月日、利用医療機関名、利用登録日、最終来院日。アプリ・Web予約利用者のログインID・PW、登録したメール。非利用者もID・初期PW。決済利用者は決済日・金額。","scope":"対象人数・正確な件数は外部専門機関と調査中。項目は利用状況により異なる。","impact":"9月下旬〜10月中旬に不正設置プログラム経由でDB情報を取得されたことを確認。侵入経路遮断・関係認証情報無効化。23日16時時点で一部機能の提供開始目途は未定、全機能を再開発中。","exclude":"カード番号等は非保持。PWの保存形式・具体的な侵入手法は断定しない。今回公表以外の情報が盗まれたID等による不正ログインで漏えいしたことは未確認。電子カルテ本体の侵害としない。","action":"当該サービスのPWは再開時に新設定、今変更する必要はないと案内。使い回し先の他サービスのPWを変更。不審連絡に注意し、医療機関は予約一覧等の代替と最新案内を確認。","sources":[{"label":"今回確認した公式続報","url":"https://at-link.net/information/アットリンクへの不正アクセスに関する調査状況/"},{"label":"今回確認した公式続報","url":"https://at-link.net/information/%E3%82%A2%E3%83%83%E3%83%88%E3%83%AA%E3%83%B3%E3%82%AF%E3%81%B8%E3%81%AE%E4%B8%8D%E6%AD%A3%E3%82%A2%E3%82%AF%E3%82%BB%E3%82%B9%E3%81%8A%E3%82%88%E3%81%B3%E3%82%B5%E3%83%BC%E3%83%93%E3%82%B9%E3%81%AE/"},{"label":"公式発表・続報","url":"https://at-link.net/?p=3237"}],"industry":"医療・福祉","group":"","status":"個人情報漏えい確認・再開未定","cat":["不正アクセス","情報漏えい","サービス停止"],"batch":"続報","changeType":"続報・補完","change":"23日16時。9月下旬〜10月中旬に不正プログラム経由DB取得、漏えい確認へ。氏名ふりがな誕生月日、利用医療機関名・登録日・最終来院日、ID/PW（非利用者初期PW）等、決済利用者は日付金額、カード番号非保持。人数調査中。アットリンクPW再開時新設定、今の変更不要、使い回し先は変更。再開未定継続、全機能再開発中。暗号化方式断定不可。","history":[{"date":"2026-10-16","text":"公表日・公式更新日と一覧反映日を区別して追加。"},{"date":"2026-10-19","text":"更新前：{\"info\": \"漏えいの有無、対象情報の項目、対象医療機関は調査中。\", \"scope\": \"患者数・漏えい件数は未確定。\", \"impact\": \"不正アクセスを確認。10/14深夜からアプリ・Web予約・問診等を停止。10/15 16時に運営状況と調査状況を更新。\", \"exclude\": \"停止機能の一覧は漏えい項目の一覧ではない。診療情報・問診内容・カード情報の流出を断定しない。\", \"action\": \"新規予約・予約変更は受診先へ直接問い合わせる。アプリの問い合わせは運営元公式窓口へ。\", \"status\": \"調査中\", \"sources\": [{\"label\": \"公式発表・続報\", \"url\": \"https://at-link.net/?p=3237\"}], \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-15\", \"checked\": \"2026-10-16\", \"text\": \"確認した公式発表では二次被害の有無は未公表。\"}, \"sourceUpdated\": \"2026-10-15\"}"},{"date":"2026-10-19","text":"オンプレミス・クラウド混在により影響精査が長期化。受付・予約・問診・決済等の停止範囲を補完。具体的な段階再開の見通しを10/19中に公表予定という案内。再開済みと記載しない。"},{"date":"2026-10-20","text":"更新前：{\"org\": \"メドレー／アットリンク\", \"info\": \"漏えいの有無、対象情報の項目、対象医療機関は調査中。\", \"scope\": \"患者数・漏えい件数は未確定。\", \"impact\": \"不正アクセスを確認し10/14深夜から受付・アプリ／Web予約・問診・決済等の対象機能を停止。10/16 19時の案内では、オンプレミスとクラウドが混在する構成のため影響精査に時間を要していると説明。具体的な段階再開の見通しを10/19中に公表予定としている。\", \"exclude\": \"停止機能の一覧は漏えい項目の一覧ではない。診療情報・問診内容・カード情報の流出を断定しない。\", \"action\": \"新規予約・予約変更は受診先へ直接問い合わせる。利用医療機関は既知の窓口で停止対象機能を確認し、代替受付と必要な照合を整理。10/19予定の続報を確認する。\", \"status\": \"調査中\", \"sources\": [{\"label\": \"今回確認した公式続報\", \"url\": \"https://at-link.net/information/%E3%82%A2%E3%83%83%E3%83%88%E3%83%AA%E3%83%B3%E3%82%AF%E3%81%B8%E3%81%AE%E4%B8%8D%E6%AD%A3%E3%82%A2%E3%82%AF%E3%82%BB%E3%82%B9%E3%81%8A%E3%82%88%E3%81%B3%E3%82%B5%E3%83%BC%E3%83%93%E3%82%B9%E3%81%AE/\"}, {\"label\": \"公式発表・続報\", \"url\": \"https://at-link.net/?p=3237\"}], \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-16\", \"checked\": \"2026-10-19\", \"text\": \"確認した続報では二次被害の有無は未公表。漏えい項目・対象医療機関等を引き続き精査中。\"}, \"sourceUpdated\": \"2026-10-16 19:00\"}"},{"date":"2026-10-20","text":"10/22朝7時以降の段階再開予定へ更新。旧環境再稼働ではなく別環境の@linkクラウドβ版で予約・患者データ等移行。予約確認・受付・登録、患者管理、診察カレンダー等が先行予定。患者アプリ、Web予約、問診、決済等の残る停止範囲は別記。再開済みや全機能復旧としない。"},{"date":"2026-10-21","text":"更新前：{\"id\": \"inc-163062585e\", \"org\": \"メドレー／アットリンク\", \"date\": \"2026-10-15\", \"sourceUpdated\": \"2026-10-19 19:00\", \"updated\": \"2026-10-20\", \"info\": \"漏えいの有無、対象情報の項目、対象医療機関は調査中。\", \"scope\": \"患者数・漏えい件数は未確定。\", \"impact\": \"10/14深夜から対象機能を停止。10/19 19時の続報は、10/22朝7時以降、別環境へ予約・患者データ等を移した「@linkクラウドβ版」で段階的に再開する予定と案内。予約確認・受付・登録、患者管理、診察カレンダー等の機能が先行予定。\", \"exclude\": \"10/19公表時点で再開済みではなく、旧環境の全面復旧でもない。患者アプリ、Web予約、問診、決済、システム連携等は引き続き停止する範囲として確認する。情報漏えい有無・項目・件数は調査中。\", \"action\": \"医療機関はWindows 11とEdge、別途案内の事前設定手順、移行データの照合、利用可能な機能を確認。残る停止機能の代替受付を維持する。患者は新規予約・変更を受診先へ直接照会。調査報告は10/20公表を目指すとの予告で、完了報告とは区別する。\", \"sources\": [{\"label\": \"今回確認した公式発表・続報\", \"url\": \"https://at-link.net/information/%E3%82%A2%E3%83%83%E3%83%88%E3%83%AA%E3%83%B3%E3%82%AF%E3%81%B8%E3%81%AE%E4%B8%8D%E6%AD%A3%E3%82%A2%E3%82%AF%E3%82%BB%E3%82%B9%E3%81%8A%E3%82%88%E3%81%B3%E3%82%B5%E3%83%BC%E3%83%93%E3%82%B9%E3%81%AE/\"}, {\"label\": \"公式発表・続報\", \"url\": \"https://at-link.net/?p=3237\"}], \"industry\": \"医療・福祉\", \"group\": \"\", \"status\": \"調査中\", \"cat\": [\"不正アクセス\", \"サービス停止\"], \"batch\": \"続報\", \"changeType\": \"続報・補完\", \"change\": \"10/22朝7時以降の段階再開予定へ更新。旧環境再稼働ではなく別環境の@linkクラウドβ版で予約・患者データ等移行。予約確認・受付・登録、患者管理、診察カレンダー等が先行予定。患者アプリ、Web予約、問診、決済等の残る停止範囲は別記。再開済みや全機能復旧としない。\", \"note\": \"再開予定は10/22朝7時以降。10/19の見通し公表を再開完了とは扱わない。部分再開、移行データ、端末の前提条件を一緒に確認する。\", \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-19\", \"checked\": \"2026-10-20\", \"text\": \"確認した続報では二次被害の有無は未公表。情報漏えいの調査と機能再開の予定を分ける。\"}, \"checked\": \"2026-10-20\", \"evidence\": \"公式発表・続報本文を2026-10-20（JST）の調査で確認。初回公表日・情報日・本HTMLの反映日を区別。\"}"},{"date":"2026-10-21","text":"調査結果の公表を10/21以降へ延期。10/22朝7時以降のβ版別環境による段階再開予定は継続。予約一覧ファイルと代替運用案内、残る停止機能・Windows11＋Edgeの前提を保持。再開済みや漏えい件数確定としない。"},{"date":"2026-10-23","text":"更新前：{\"sourceUpdated\": \"2026-10-20 23:00\", \"status\": \"調査中\", \"info\": \"漏えいの有無、対象情報の項目、対象医療機関は調査中。\", \"scope\": \"患者数・漏えい件数は未確定。\", \"impact\": \"10/14深夜から対象機能を停止。10/20 23時の続報も、10/22朝7時以降、別環境へ予約・患者データ等を移した「@linkクラウドβ版」で段階的に再開する予定と案内。予約確認・受付・登録、患者管理、診察カレンダー等の機能が先行予定。 同続報は追加調査が必要になったため、10/20中に予定していた調査結果の報告を10/21以降へ延期すると案内。\", \"exclude\": \"10/20 23時の公表時点で再開済みではなく、旧環境の全面復旧でもない。患者アプリ、Web予約、問診、決済、システム連携等は引き続き停止する範囲として確認する。情報漏えい有無・項目・件数は調査中。\", \"action\": \"医療機関はWindows 11とEdge、事前設定の手順、移行データの照合、先行機能を確認。提供元が案内する予約一覧ファイル・代替運用マニュアルを活用し、未着時は既知のサポート窓口へ照会。新規予約・変更は受診先で対応し、残る停止機能の代替運用を維持する。\", \"note\": \"10/22朝7時以降の部分再開は予定で、再開完了を意味しない。調査結果の報告も10/21以降へ延期されたため、公表済み・漏えい範囲確定と扱わない。\"}"},{"date":"2026-10-23","text":"22日10時更新。一部機能の22日朝再開予定は不具合で延期、再開見通し未定に置換。"},{"date":"2026-10-24","text":"更新前：{\"status\": \"調査中\", \"info\": \"漏えいの有無、対象情報の項目、対象医療機関は調査中。\", \"scope\": \"患者数・漏えい件数は未確定。\", \"impact\": \"10/14深夜から対象機能を停止。10/22朝に予定していた@linkクラウドβ版の一部機能再開は、不具合により延期。10/22 10時の更新では提供開始の見通しは未定。予約・患者管理・診察カレンダー等の先行予定も実施済みとしない。漏えい有無・影響は引き続き調査中。\", \"exclude\": \"旧再開予定を現行予定にしない。患者アプリ、Web予約、問診、決済、連携等の停止と、情報漏えい項目を区別。オンプレミス・クラウドの混在で影響調査は長期化。\", \"action\": \"医療機関はWindows 11とEdge、事前設定の手順、移行データの照合、先行機能を確認。提供元が案内する予約一覧ファイル・代替運用マニュアルを活用し、未着時は既知のサポート窓口へ照会。新規予約・変更は受診先で対応し、残る停止機能の代替運用を維持する。\", \"sourceUpdated\": \"2026-10-22 10:00 JST\", \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-20\", \"checked\": \"2026-10-21\", \"text\": \"確認した続報では二次被害の有無は未公表。情報漏えいの調査と機能再開の予定を分ける。\"}}"},{"date":"2026-10-24","text":"23日16時。9月下旬〜10月中旬に不正プログラム経由DB取得、漏えい確認へ。氏名ふりがな誕生月日、利用医療機関名・登録日・最終来院日、ID/PW（非利用者初期PW）等、決済利用者は日付金額、カード番号非保持。人数調査中。アットリンクPW再開時新設定、今の変更不要、使い回し先は変更。再開未定継続、全機能再開発中。暗号化方式断定不可。"}],"note":"23日16時。9月下旬〜10月中旬に不正プログラム経由DB取得、漏えい確認へ。氏名ふりがな誕生月日、利用医療機関名・登録日・最終来院日、ID/PW（非利用者初期PW）等、決済利用者は日付金額、カード番号非保持。人数調査中。アットリンクPW再開時新設定、今の変更不要、使い回し先は変更。再開未定継続、全機能再開発中。暗号化方式断定不可。","secondary":{"status":"未公表・不明","date":"2026-10-20","checked":"2026-10-21","text":"確認した続報では二次被害の有無は未公表。情報漏えいの調査と機能再開の予定を分ける。"},"checked":"2026-10-24","evidence":"承認済み差分に基づき、10/21の調査で本文を照合した続報を反映。未確認の日付・範囲を推定しない。"},{"id":"inc-72c807254c","org":"イエローハット／WEB作業予約システム","date":"2026-08-28","sourceUpdated":"2026-10-15","updated":"2026-10-16","info":"氏名、住所、生年月日、性別、電話番号、メールアドレス、会員番号、ログインID、パスワード（同社表記：復元できない状態）。","scope":"1,797,124人。初報の最大1,801,499人から特定。","impact":"10/15第2報で流出確認。初報から住所・生年月日・性別・ログインID・パスワードを追加。システムは対策後再開。初報は期間外だが直近の重要続報として掲載。","exclude":"カード情報は保持せず対象外。同社は当該パスワード情報による不正利用のおそれはないと説明。具体的保存方式は未公表。2りんかん事案とは別。","action":"公式発表・個別通知を確認。不審なメール・SMS・電話で認証情報等を伝えず、公式窓口に確認する。","sources":[{"label":"公式発表・続報","url":"https://finance-frontend-pc-dist.west.edge.storage-yahoo.jp/disclosure/20261015/20261015551164.pdf"}],"industry":"小売・サービス","group":"","status":"漏えい確認","cat":["不正アクセス","情報漏えい"],"batch":"以前","changeType":"新規追加","ch 日、性別で、PWは含まれない。項目は対象者ごとに異なる。","scope":"会員DB319件とログ最大約420万件。ログは同一顧客の重複を含む可能性があり、単純合算して被害人数としない。","impact":"10/21第4報：侵入経路・攻撃手法の特定と遮断対応は完了と説明。システム改修・再点検を実施。購入済み作品・読み放題のWeb閲覧を優先して再開準備し、購入・決済等は安全確認後に順次再開予定。再開日時は未確定。","exclude":"クレジットカード情報は対象システムで保有しておらず流出していないと説明。購入履歴の流出、MY本棚の流出・消失・欠損は公表時点で確認されていない。","action":"同じメールアドレス・パスワードを使う他社サービスのパスワード変更を依頼。公式の続報と個別通知を確認し、不審な連絡から認証情報を入力しない。全会員のパスワード再設定はサービス再開時に予定されており、実施済みとは扱わない。","sources":[{"label":"今回確認した公式続報","url":"https://www.nttsolmare.com/press/2026/1021.html"},{"label":"今回確認した公式続報","url":"https://www.nttsolmare.com/press/2026/1016-1.html"},{"label":"公式第2報（10/16）","url":"https://www.nttsolmare.com/press/2026/1016.html"}],"industry":"小売・サービス","group":"","status":"漏えい確認","cat":["不正アクセス","情報漏えい","サービス停止"],"batch":"続報","changeType":"続報・補完","change":"第4報。登録DB319件、ログ最大約420万件。重複可能性、ログにPWなし。経路対処完了、再開時期未定。既購入・読み放題閲覧優先、購入決済は段階再開準備。全員PW再設定は再開時予定。","history":[{"date":"2026-10-17","text":"今朝抽出した公表情報を統合。公表・続報日と一覧反映日を区別。"},{"date":"2026-10-19","text":"更新前：{\"info\": \"漏えいの有無・情報項目・件数は10/15発表では未公表、調査中。\", \"scope\": \"サービス停止に伴う影響。漏えい人数未公表。\", \"impact\": \"外部からの不正アクセスの可能性が高いと判断し、サービスを停止。\", \"exclude\": \"\", \"action\": \"公式発表・個別通知を確認。不審な連絡中のリンクではなく公式窓口から確認し、認証情報や送金要求に応じない。\", \"status\": \"調査中\", \"sources\": [{\"label\": \"公式発表・続報\", \"url\": \"https://www.nttsolmare.com/press/2026/0616-1.html\"}], \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-15\", \"checked\": \"2026-10-17\", \"text\": \"二次被害の確定情報は今回の公表内容では確認していない。\"}, \"sourceUpdated\": \"2026-10-15\"}"},{"date":"2026-10-19","text":"現行「調査中」から「漏えい確認」へ。メール・ハッシュ化PW・生年月日・性別・ニックネームの流出。第3報では一部ログファイルの閲覧取得も確認、ログ内の会員情報は精査中。対象件数未確定。カードは対象システム非保有、購入履歴・MY本棚の流出等は未確認。攻撃手法特定を公表したが具体的手法は非開示。購入済み書籍のWeb閲覧から段階再開準備、日時未定。全会員PW再設定は再開時に予定。"},{"date":"2026-10-22","text":"更新前：{\"sourceUpdated\": \"2026-10-18\", \"status\": \"漏えい確認\", \"info\": \"メールアドレス、ハッシュ化パスワード、生年月日、性別、ニックネームの流出を確認。第3報ではシステムログの一部の閲覧・取得も判明し、ログ内に会員情報が含まれるかを精査中。\", \"scope\": \"対象となる会員数・情報件数は精査中で未確定。ログ取得の確認を、追加の会員情報流出件数と同一視しない。\", \"impact\": \"不正アクセスによりサービスを停止。第3報で侵入経路・攻撃手法を特定し対処したと説明するが、具体的な手法は公表していない。購入済み書籍のWeb閲覧から段階的に再開する準備中で、正確な再開日時は未定。\", \"exclude\": \"クレジットカード情報は対象システムで保有しておらず流出していないと説明。購入履歴の流出、MY本棚の流出・消失・欠損は公表時点で確認されていない。\", \"action\": \"同じメールアドレス・パスワードを使う他社サービスのパスワード変更を依頼。公式の続報と個別通知を確認し、不審な連絡から認証情報を入力しない。全会員のパスワード再設定はサービス再開時に予定されており、実施済みとは扱わない。\", \"note\": \"10/16第2報・10/18第3報で従前の調査中から漏えい確認へ更新。過去の不適切な日付の出典URLは現行出典から外し、更新前情報として履歴に保存。\", \"group\": \"\"}"},{"date":"2026-10-22","text":"第4報。登録DB319件、ログ最大約420万件。重複可能性、ログにPWなし。経路対処完了、再開時期未定。既購入・読み放題閲覧優先、購入決済は段階再開準備。全員PW再設定は再開時予定。"}],"note":"第4報でDBとログの対象項目・件数を具体化。停止中の月額課金は基本的に引落しなし、一部決済は個別対応。期限切れポイントの再付与等は検討中で確定措置とは扱わない。全会員PW再設定も再開時予定。","secondary":{"status":"注意喚起のみ","date":"2026-10-21","checked":"2026-10-22","text":"流出情報を用いた他サービスへの不正ログイン、不審なメールへの注意を案内。これらが実際に発生したと確認した発表ではない。"},"checked":"2026-10-22","evidence":"10/22の調査で10/21の公式続報本文を照合。従来の公表日は保持。"},{"id":"inc-0a47f4ad2e","date":"2026-10-16","sourceUpdated":"2026-10-16","updated":"2026-10-18","checked":"2026-10-18","cat":["不正アクセス","情報漏えい","委託先被害"],"status":"漏えいの可能性","changeType":"新規追加","batch":"新規","evidence":"公式発表本文を2026-10-18に確認","note":"","org":"Luup","industry":"交通・旅行・宿泊","info":"フォームに入力された氏名、メール、電話、住所、会社・部署名、自由記述等。フォームにより項目が異なる。","scope":"21,368件のフォーム送信情報。重複を含む可能性があり、人数ではない。","impact":"Studio経由の旧ポート設置依頼・UNIMO・交通ルール関連等の保存情報が対象となる可能性。実際の取得は未確認。","exclude":"LUUPアプリの登録情報および既に移行した現行フォーム等は対象外。","action":"対象のStudioフォームを停止。個別の対象期間・フォームは公式案内で確認し、不審な連絡には既知の窓口で確認する。","group":"Studio","sources":[{"label":"公式発表・続報","url":"https://luup.sc/embed/"}],"change":"21,368件のフォーム送信情報。重複を含む可能性があり、人数ではない。 Studio経由の旧ポート設置依頼・UNIMO・交通ルール関連等の保存情報が対象となる可能性。実際の取得は未確認。","history":[{"date":"2026-10-18","text":"21,368件のフォーム送信情報。重複を含む可能性があり、人数ではない。 Studio経由の旧ポート設置依頼・UNIMO・交通ルール関連等の保存情報が対象となる可能性。実際の取得は未確認。"}],"secondary":{"status":"調査中","date":"2026-10-16","checked":"2026-10-18","text":"確認した公式発表の範囲で、漏えい情報を用いた二次被害の確認情報はない。未確認は被害なしを意味しない。"}},{"id":"inc-b3ae40831b","date":"2026-10-16","sourceUpdated":"2026-10-16","update
