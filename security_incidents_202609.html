一般化しない。","change":"10/18公表分を追加。不正アクセスと一部機能停止を確認。個人情報への影響は調査中。","secondary":{"status":"未公表・不明","date":"2026-10-18","checked":"2026-10-19","text":"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-19","text":"10/18公表分を追加。不正アクセスと一部機能停止を確認。個人情報への影響は調査中。"}]},{"id":"inc-af5aafc071","org":"セカンドリテイリング／ゲオ・セカンドストリート等","date":"2026-10-17","sourceUpdated":"2026-10-19","checked":"2026-10-20","updated":"2026-10-20","batch":"続報","changeType":"続報・補完","sources":[{"label":"今回確認した公式発表・続報","url":"https://2nd-rtl.com/news/82032/"},{"label":"公式発表・続報","url":"https://2nd-rtl.com/news/82023/"},{"label":"関連する公式案内","url":"https://geo-online.co.jp/maintenance/index.html?cid=32"}],"evidence":"公式発表・続報本文を2026-10-20（JST）の調査で確認。初回公表日・情報日・本HTMLの反映日を区別。","industry":"小売・サービス","status":"不正アクセス確認","cat":["不正アクセス","サービス停止"],"info":"10/19第2報の調査では、DBへの不審な接続・直接アクセスの形跡はなく、個人情報・機密情報の外部漏えいは確認されなかったと公表。","scope":"ゲオ・セカンドストリート等のアプリ・Web・オンラインショップ、宅配買取など。ブランド・機能によって影響が異なる。","impact":"10月15日に不正アクセスを確認し、10月17日21時から関連サービスを停止。実店舗の営業時間は変更せず、アプリを使わない購入・買取等は継続すると案内。 10/19第2報時点でも、安全性強化のためアプリ・Web等の停止を継続し、再開日時は未定。","exclude":"情報漏えい未確認と、事案・業務停止がなかったことは異なる。攻撃主体・具体的な侵入方法・ランサムウェア被害は当該続報から確定できない。","action":"公式案内で停止機能と利用可能な業務を照合。会員証はPontaカード・デジタルPontaカード等、ゲーム予約は店舗受付などの代替手段を確認する。既存の通販注文は順次発送と案内。","note":"10/19第2報で漏えい調査の結果を更新。実店舗の継続業務・代替方法と、停止中のアプリ・Webを分けて確認する。","change":"第2報。調査でDBへの不審接続・直接アクセスの形跡なく、個人・機密情報の外部漏えいは確認されなかったと公表。アプリ・Web停止は継続、再開未定。漏えい未確認と業務停止の継続を分ける。","secondary":{"status":"未公表・不明","date":"2026-10-19","checked":"2026-10-20","text":"第2報は情報の外部漏えい未確認と説明。二次被害の個別確認状況は未公表。"},"history":[{"date":"2026-10-19","text":"10/17公表分を追加。アプリ・Web等を停止し、実店舗の営業は継続。代替手段と停止機能を整理。"},{"date":"2026-10-20","text":"更新前：{\"org\": \"セカンドリテイリング／ゲオ・セカンドストリート等\", \"info\": \"情報漏えいの有無、対象情報・件数は確認した発表では未公表。\", \"scope\": \"ゲオ・セカンドストリート等のアプリ・Web・オンラインショップ、宅配買取など。ブランド・機能によって影響が異なる。\", \"impact\": \"10月15日に不正アクセスを確認し、10月17日21時から関連サービスを停止。実店舗の営業時間は変更せず、アプリを使わない購入・買取等は継続すると案内。\", \"exclude\": \"攻撃主体、ランサムウェア被害、情報流出は当該発表からは確定できない。各ブランドを別々の攻撃件数として追加しない。\", \"action\": \"公式案内で停止機能と利用可能な業務を照合。会員証はPontaカード・デジタルPontaカード等、ゲーム予約は店舗受付などの代替手段を確認する。既存の通販注文は順次発送と案内。\", \"status\": \"不正アクセス確認\", \"sources\": [{\"label\": \"公式発表・続報\", \"url\": \"https://2nd-rtl.com/news/82023/\"}, {\"label\": \"関連する公式案内\", \"url\": \"https://geo-online.co.jp/maintenance/index.html?cid=32\"}], \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-17\", \"checked\": \"2026-10-19\", \"text\": \"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。\"}, \"sourceUpdated\": \"2026-10-17\"}"},{"date":"2026-10-20","text":"第2報。調査でDBへの不審接続・直接アクセスの形跡なく、個人・機密情報の外部漏えいは確認されなかったと公表。アプリ・Web停止は継続、再開未定。漏えい未確認と業務停止の継続を分ける。"}]},{"id":"inc-caac547632","org":"石川コンピュータ・センター／顧客向けサポートサイト","date":"2026-10-17","sourceUpdated":"2026-10-17","checked":"2026-10-19","updated":"2026-10-19","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://www.icc.co.jp/news/2026/20261017.html"}],"evidence":"公式発表本文を2026-10-19（JST）の調査で確認。公表・続報時点の事実と、編集上の点検案を区別。","industry":"IT・通信","status":"不正アクセス確認","cat":["不正アクセス","サービス停止"],"info":"具体的な情報項目・個人情報への影響・人数は当該発表では未公表。","scope":"顧客向けサポートサイト。原因・侵入経路・影響範囲を調査中。","impact":"10月16日に不正アクセスを確認し、10月17日に公表。対象サイトを停止し、サーバーをネットワークから遮断して調査。","exclude":"復旧日時は未公表。過去のメールサーバー事案とは区別し、その人数や情報項目を本件へ転記しない。","action":"利用組織は、既知の担当窓口・電話等の代替連絡先でサポート受付方法を確認。利用再開・対象情報の追加案内を確認する。","note":"今回の対象は10月の顧客向けサポートサイト事案。","change":"10/17公表分を追加。顧客向けサポートサイトを停止・遮断し調査。影響範囲・復旧日時は未公表。","secondary":{"status":"未公表・不明","date":"2026-10-17","checked":"2026-10-19","text":"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-19","text":"10/17公表分を追加。顧客向けサポートサイトを停止・遮断し調査。影響範囲・復旧日時は未公表。"}]},{"id":"inc-6d39f8fa8a","org":"ワサビ／WASABI SWITCH","date":"2026-10-16","sourceUpdated":"2026-10-20","checked":"2026-10-21","updated":"2026-10-21","batch":"続報","changeType":"続報・補完","sources":[{"label":"今回確認した公式続報","url":"https://wasabi-inc.biz/help/news/20261020-01/"},{"label":"今回確認した公式発表・続報","url":"https://wasabi-inc.biz/help/news/20261018-01/"},{"label":"公式発表・続報","url":"https://wasabi-inc.biz/help/news/20261017-03/"},{"label":"関連する公式案内","url":"https://wasabi-inc.biz/help/news/20261016-01/"},{"label":"公式第5報（10/18）","url":"https://wasabi-inc.biz/help/news/20261018-02/"}],"evidence":"承認済み差分に基づき、10/21の調査で本文を照合した続報を反映。未確認の日付・範囲を推定しない。","industry":"IT・通信","status":"漏えい確認","cat":["不正アクセス","情報漏えい","アカウント侵害","不正利用"],"info":"10月17日の注文データの一部と、サービスに登録されていたメールアカウント情報の取得を確認。管理者パスワードの流出を利用した再侵入も確認。","scope":"一部・複数の利用店舗。対象人数・注文件数・メールアカウント数の確定値は当該第3報では未公表。","impact":"10月14日の侵入原因となった脆弱性は修正済みだが、流出した管理者パスワードで10月16日3時頃と17日13:25〜15:07頃に再侵入。管理画面の機能で不正プログラムを設置し、情報を取得。店舗の正式メールアドレスからの不審メール送信を確認。 第5報では10/18 20:30〜23:30のメンテナンスで全アカウントPWの強制変更・メール2段階認証等を実施すると案内。実施案内と完了確認は区別する。 第6報：登録認証情報の暗号化を10/20 5時頃に完了したと公表。メール・FTP等の再登録案内と、API連携の停止・再認証の対象を追記。","exclude":"不正メール送信の確認は、受信者の送金被害・感染を確認したという意味ではない。脆弱性修正済みという説明だけで認証情報の安全性を確定しない。 暗号化を完了しても、既に流出した認証情報・トークンが安全になるわけではない。停止中の連携を全て再開済みと扱わない。","action":"実際のメール提供元でSMTP認証・POPパスワードを変更し、第6報で再登録可能となった変更後のメールPW・外部連携FTP PWを登録する。ワサビ発行FTPのPWは別案内待ち。eBay・Amazon・Walmartはトークン再発行まで連携・在庫更新が停止するため、各モールで在庫調整する。DHLは再認証が必要。LAZADAは10/20 19時頃から24時間以内、Shopeeは3日以内に変更しない場合の連携停止を案内。その他の連携も公式の対象一覧を照合する。","note":"暗号化完了と再登録可否を第6報で更新。提供元による完了の説明であり、独立した暗号設計の検証を行ったという意味ではない。漏えい済みPW・トークンの失効は別工程。第4報の変更前の削除方針は現行指示にしない。第5報のメンテナンス完了はこの第6報から一括して確定しない。","change":"第6報。10/20 05時頃に登録認証情報の暗号化が完了と公表。新PW・外部FTP PW再登録可能へ。自社発行FTP PWは別案内待ち。eBay/Amazon/Walmartはトークン再発行まで連携・在庫更新停止。DHL再認証必要。LAZADAは10/20 19時頃から24時間以内、Shopeeは3日以内等の変更案内。漏えい済み認証情報の失効は別工程。","secondary":{"status":"不正メール送信確認","date":"2026-10-18","checked":"2026-10-21","text":"店舗の正式メールアドレスから不審メールが送られたことを提供元が確認。受信者の金銭被害等の確定とは区別する。"},"history":[{"date":"2026-10-19","text":"第3報を追加。流出した管理者PWによる再侵入と正規メールの悪用を確認。10/18更新でPOP PWも変更対象に追加。"},{"date":"2026-10-20","text":"更新前：{\"org\": \"ワサビ／WASABI SWITCH\", \"info\": \"10月17日の注文データの一部と、サービスに登録されていたメールアカウント情報の取得を確認。管理者パスワードの流出を利用した再侵入も確認。\", \"scope\": \"一部・複数の利用店舗。対象人数・注文件数・メールアカウント数の確定値は当該第3報では未公表。\", \"impact\": \"10月14日の侵入原因となった脆弱性は修正済みだが、流出した管理者パスワードで10月16日3時頃と17日13:25〜15:07頃に再侵入。管理画面の機能で不正プログラムを設置し、情報を取得。店舗の正式メールアドレスからの不審メール送信を確認。\", \"exclude\": \"不正メール送信の確認は、受信者の送金被害・感染を確認したという意味ではない。脆弱性修正済みという説明だけで認証情報の安全性を確定しない。\", \"action\": \"当該第3報では、登録メールのSMTP認証パスワードとPOPパスワードを実際のメール提供元で変更し、同じ値を使わないよう依頼。送信履歴・自動転送も点検する。暗号化対応の完了までは新パスワードをWASABI SWITCHへ再登録しないとの案内があるため、再登録の可否は提供元の最新告知で確認する。\", \"status\": \"漏えい確認\", \"sources\": [{\"label\": \"公式発表・続報\", \"url\": \"https://wasabi-inc.biz/help/news/20261017-03/\"}, {\"label\": \"関連する公式案内\", \"url\": \"https://wasabi-inc.biz/help/news/20261016-01/\"}], \"secondary\": {\"status\": \"不正メール送信確認\", \"date\": \"2026-10-18\", \"checked\": \"2026-10-19\", \"text\": \"店舗の正式メールアドレスから不審メールが送られたことを提供元が確認。受信者の金銭被害等の確定とは区別する。\"}, \"sourceUpdated\": \"2026-10-18 15:02\"}"},{"date":"2026-10-20","text":"第4・5報を補完。全アカウントPW強制変更・メール2段階認証等の実施案内（10/18 20:30〜23:30）を追記。第4報の取引データ一時削除等は10/19 17:30に方針変更され、具体的内容は利用者宛チャットで案内。公開前文の削除予定を確定指示として転記しない。暗号化完了は別途確認。"},{"date":"2026-10-21","text":"更新前：{\"id\": \"inc-6d39f8fa8a\", \"org\": \"ワサビ／WASABI SWITCH\", \"date\": \"2026-10-16\", \"sourceUpdated\": \"2026-10-19 17:30\", \"checked\": \"2026-10-20\", \"updated\": \"2026-10-20\", \"batch\": \"続報\", \"changeType\": \"続報・補完\", \"sources\": [{\"label\": \"今回確認した公式発表・続報\", \"url\": \"https://wasabi-inc.biz/help/news/20261018-01/\"}, {\"label\": \"公式発表・続報\", \"url\": \"https://wasabi-inc.biz/help/news/20261017-03/\"}, {\"label\": \"関連する公式案内\", \"url\": \"https://wasabi-inc.biz/help/news/20261016-01/\"}, {\"label\": \"公式第5報（10/18）\", \"url\": \"https://wasabi-inc.biz/help/news/20261018-02/\"}], \"evidence\": \"公式発表・続報本文を2026-10-20（JST）の調査で確認。初回公表日・情報日・本HTMLの反映日を区別。\", \"industry\": \"IT・通信\", \"status\": \"漏えい確認\", \"cat\": [\"不正アクセス\", \"情報漏えい\", \"アカウント侵害\", \"不正利用\"], \"info\": \"10月17日の注文データの一部と、サービスに登録されていたメールアカウント情報の取得を確認。管理者パスワードの流出を利用した再侵入も確認。\", \"scope\": \"一部・複数の利用店舗。対象人数・注文件数・メールアカウント数の確定値は当該第3報では未公表。\", \"impact\": \"10月14日の侵入原因となった脆弱性は修正済みだが、流出した管理者パスワードで10月16日3時頃と17日13:25〜15:07頃に再侵入。管理画面の機能で不正プログラムを設置し、情報を取得。店舗の正式メールアドレスからの不審メール送信を確認。 第5報では10/18 20:30〜23:30のメンテナンスで全アカウントPWの強制変更・メール2段階認証等を実施すると案内。実施案内と完了確認は区別する。\", \"exclude\": \"不正メール送信の確認は、受信者の送金被害・感染を確認したという意味ではない。脆弱性修正済みという説明だけで認証情報の安全性を確定しない。\", \"action\": \"第3報のSMTP認証PW・POPパスワード変更と、実際のメール提供元での失効・再設定を確認。第5報の全PW強制変更・メール2段階認証の最新手順と完了状況を提供元へ確認する。第4報の取引データ等の一時削除方針は10/19 17:30に変更され、具体的な内容は利用者宛チャットで案内されるため、旧案を現在の削除指示として実行しない。\", \"note\": \"第4報は10/19 17:30更新で対応方針変更を追記。公開本文だけでは変更後の具体策、暗号化の適用完了、メンテナンス完了は確認できない。PWの再登録可否は最新の顧客向け案内で確認する。\", \"change\": \"第4・5報を補完。全アカウントPW強制変更・メール2段階認証等の実施案内（10/18 20:30〜23:30）を追記。第4報の取引データ一時削除等は10/19 17:30に方針変更され、具体的内容は利用者宛チャットで案内。公開前文の削除予定を確定指示として転記しない。暗号化完了は別途確認。\", \"secondary\": {\"status\": \"不正メール送信確認\", \"date\": \"2026-10-18\", \"checked\": \"2026-10-20\", \"text\": \"店舗の正式メールアドレスから不審メールが送られたことを提供元が確認。受信者の金銭被害等の確定とは区別する。\"}}"},{"date":"2026-10-21","text":"第6報。10/20 05時頃に登録認証情報の暗号化が完了と公表。新PW・外部FTP PW再登録可能へ。自社発行FTP PWは別案内待ち。eBay/Amazon/Walmartはトークン再発行まで連携・在庫更新停止。DHL再認証必要。LAZADAは10/20 19時頃から24時間以内、Shopeeは3日以内等の変更案内。漏えい済み認証情報の失効は別工程。"}]},{"id":"inc-6465987c60","org":"CREAVE／Snapmart","date":"2026-10-16","sourceUpdated":"2026-10-16","checked":"2026-10-19","updated":"2026-10-19","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://info.snapmart.jp/notice-20261016/"},{"label":"関連する公式案内","url":"https://creave.co.jp/news/news20261016/"}],"evidence":"公式発表本文を2026-10-19（JST）の調査で確認。公表・続報時点の事実と、編集上の点検案を区別。","industry":"IT・通信","status":"不正閲覧の可能性","cat":["設定不備","情報漏えい"],"info":"本人確認書類の画像。運転免許証・パスポート・健康保険証・マイナンバーカード等。マイナンバーは番号をマスキングせず提出した場合に含まれる可能性。","scope":"2019年3月頃〜2026年10月8日の保存先設定が対象。各画像は提出後おおむね1年で自動削除する運用で、全画像が全期間保存されていたという意味ではない。対象人数は未公表。","impact":"保存先のアクセス設定により、画像のURLを直接指定すると認証せず閲覧できる状態だった。10月7日の発見後、10月8日までに残存画像の削除・非公開化等を実施。","exclude":"2020年5月以降の現存ログでは第三者の取得・総当たりアクセスを確認していない。2019年3月〜2020年5月のログは残っておらず、その期間は判定できない。メール・パスワード・銀行口座・作品・カード情報等は別環境で対象外。","action":"提供元の対象者向け案内を確認。自組織では本人確認画像の匿名アクセス、利用者ごとの認可、保存期限・削除、アクセスログの保存期間を点検する。提供元は本件を理由とするパスワード変更は不要と説明。","note":"保存先の設定不備と第三者による取得確認を区別する。画像の取得・悪用が確認されたという発表ではない。","change":"10/16公表の未掲載分を追加。本人確認画像が認証なしで閲覧可能な設定。取得は現存ログで未確認、古い期間はログなし。","secondary":{"status":"公表時点で報告なし","date":"2026-10-16","checked":"2026-10-19","text":"確認した公式発表では画像の第三者取得・不正利用は確認されていない。ログのない期間は取得有無を判定できない。"},"history":[{"date":"2026-10-19","text":"10/16公表の未掲載分を追加。本人確認画像が認証なしで閲覧可能な設定。取得は現存ログで未確認、古い期間はログなし。"}]},{"id":"inc-01936ff5ef","org":"静岡市／防災メール・認知症しずメール等","date":"2026-10-13","sourceUpdated":"2026-10-14","checked":"2026-10-19","updated":"2026-10-19","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://www.city.shizuoka.lg.jp/documents/59469/kaiken1014.pdf"},{"label":"アルカディア｜10/15全サービス復旧等の続報","url":"https://raiden.site.ktaiwork.jp/archives/4597"}],"evidence":"公式発表本文を2026-10-19（JST）の調査で確認。公表・続報時点の事実と、編集上の点検案を区別。","industry":"行政・公共","status":"一部漏えい確認","cat":["委託先被害","情報漏えい","サービス停止"],"info":"防災メールの市民・職員と認知症しずメールのメールアドレス。職員分は氏名・職員番号・所属等も含む。電話・FAX等は別範囲として調査中。","scope":"漏えい確認の内訳は市民34,336人、職員6,915人、認知症しずメール1,779人で、内訳合計43,030人分。サービス間の重複は不明。別途、電話サービスの市民21人と清水病院の職員連絡709人（内訳計730人）は調査中であり、確認分へ加算しない。","impact":"アルカディアの配信サービスへの不正アクセスに関連。10月14日の会見資料で漏えい範囲と不審メールを説明。同資料は10/13の市HP公表に言及。認知症しずメール等の停止は同資料の公表時点。提供元は10/15に全サービス復旧と公表している。","exclude":"43,030は公表内訳の合計で、重複を除いた実人数ではない。提供元の最大推定値と合算しない。電話・病院職員連絡分の漏えいは当該資料時点では未確定。","action":"市は不審メール内のリンク等を開かないよう案内。一方、防災配信アドレスを受信拒否・迷惑メールへ登録すると本来の防災・行方不明者情報が届かなくなると注意しているため、当該サービスの最新案内と代替受信手段を確認する。","note":"RAIDEN関連の利用組織の公表として登録。10/14資料が記載する初回公表日10/13を採用。配信アドレスの受信設定に関する案内は本サービス固有。","change":"10/13初回公表・10/14会見の未掲載分を補完。内訳計43,030人分は漏えい確認、別の730人分は調査中。","secondary":{"status":"不審連絡確認","date":"2026-10-14","checked":"2026-10-19","text":"市民・職員への不審メールを複数確認し、事案と関連すると思われると市が説明。防災メールを装うクレジットカード関連の連絡等。送金等の実被害確認とは区別する。"},"group":"RAIDEN","history":[{"date":"2026-10-19","text":"10/13初回公表・10/14会見の未掲載分を補完。内訳計43,030人分は漏えい確認、別の730人分は調査中。"}]},{"id":"inc-5ce201e230","org":"芦屋学園／芦屋大学ほか","date":"2026-10-19","sourceUpdated":"2026-10-22","checked":"2026-10-23","updated":"2026-10-23","industry":"教育・研究","batch":"続報","changeType":"続報・補完","sources":[{"label":"今回確認した公式続報","url":"https://www.ashiya-u.ac.jp/topics/news/20261022ky/"},{"label":"公式発表・続報","url":"https://www.ashiya-u.ac.jp/topics/news/20261019gs/"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"内部DBへのアクセス痕跡確認","cat":["不正アクセス","サービス停止"],"info":"内部データベースの個人情報へのアクセス痕跡。対象項目・件数・実際の持ち出し範囲は調査中。","scope":"学内システムと関連するデータベースサーバー。一部システムが利用できない状態。","impact":"10/22第2報：海外IPから、サーバー機能の脆弱性を通じた内部データベースの個人情報へのアクセス痕跡を確認。対象サーバーは切り離し、機能を停止して封じ込め。","exclude":"アクセス痕跡と外部搬出確認を区別。該当CVE・攻撃主体は未公表で、海外IPから国籍を断定しない。","action":"停止するシステムと継続する授業・保育を分けて確認する。自組織でも代替の案内経路、受付方法、復旧判断の担当を整理する。","note":"10/19の学園公式発表を採用。情報システムと業務全体の稼働を分けて読む事例。","change":"22日続報。サーバー機能脆弱性を通じ内部DB個人情報へのアクセス痕跡。搬出・件数・CVE未確定。海外IPから攻撃者国籍断定不可。","secondary":{"status":"未公表・不明","date":"2026-10-19","checked":"2026-10-20","text":"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-20","text":"10/19公表分を追加。DBサーバー停止と、授業・保育の通常実施を区別して整理。"},{"date":"2026-10-23","text":"更新前：{\"sourceUpdated\": \"2026-10-19\", \"status\": \"不正アクセス確認\", \"info\": \"情報漏えいの有無、対象情報の項目・人数は調査中。\", \"scope\": \"学内システムと関連するデータベースサーバー。一部システムが利用できない状態。\", \"impact\": \"10月14日に不正アクセスの形跡を確認。関連DBサーバーを停止し、外部専門事業者と調査・復旧を進めている。大学、中学校・高等学校、附属幼稚園の授業・保育は通常どおり実施。\", \"exclude\": \"システム停止は、授業・保育の停止や情報流出の確認を意味しない。具体的な侵入方法・再開日時は未公表。\", \"action\": \"停止するシステムと継続する授業・保育を分けて確認する。自組織でも代替の案内経路、受付方法、復旧判断の担当を整理する。\", \"note\": \"10/19の学園公式発表を採用。情報システムと業務全体の稼働を分けて読む事例。\"}"},{"date":"2026-10-23","text":"22日続報。サーバー機能脆弱性を通じ内部DB個人情報へのアクセス痕跡。搬出・件数・CVE未確定。海外IPから攻撃者国籍断定不可。"}]},{"id":"inc-77e5f2ea90","org":"ユミルリンク／Cuenote FC","date":"2026-10-19","sourceUpdated":"2026-10-26","checked":"2026-10-27","updated":"2026-10-27","industry":"IT・通信","batch":"続報","changeType":"続報更新","sources":[{"label":"公式第2報（2026/10/26）","url":"https://www.cuenote.jp/information/news/unauthorizedaccess2.html"},{"label":"公式発表・続報","url":"https://www.cuenote.jp/information/news/unauthorizedaccess.html"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"漏えい確認","cat":["不正アクセス","情報漏えい","アカウント侵害"],"info":"Cuenote FC 49システムからメールアドレス等のデータ出力を確認。Cuenote BASE 1システムでは契約者情報190件が閲覧可能な状態。FC登録項目は利用企業ごとに異なり、氏名等の内訳は調査中。","scope":"FC 49システム、延べ51,628,280件（16システムは件数調査中）。BASE 1システム190件。50システムの公表項目であり、5,163万人・独立攻撃50件ではない。","impact":"10/16検知、ライブラリ脆弱性から保守・品質管理認証情報の取得、不正プログラム設置、他システムへの横展開とデータ出力を確認。10/25新たな42システムを確認し26日顧客通知。脆弱性修正・保守認証情報削除・不正プログラム検知・IP制限を実施。","exclude":"Cuenote SR-S、SMS、Auth、Survey、Push、安否確認サービスは提供元が漏えい影響なしと公表。FCの複数企業共用3システムは漏えい痕跡0。16システムの件数調査中。具体的CVEと利用先の個別件数は未公表。","action":"配信委託先・再委託先に対象環境を照会。保守アカウント、API、セッション、ログ、IP制限、配信先属性を確認し、緊急メールの代替配信と委託先からの通知経路を準備。","note":"10/19 19:05更新の第1報を採用。約900万件は出力件数の試算であり、900万人の被害確認とは記載しない。","change":"10/26第2報：FC49システム延べ51,628,280件、BASE190件。横展開と不審メール送信を確認。","secondary":{"status":"不審連絡確認・因果未確定","date":"2026-10-26","checked":"2026-10-27","text":"同社ドメインを送信元表示に用いたセゾンカードを装う迷惑メールを複数確認。ただし漏えいデータが利用されたかの因果関係は未確認。個人情報の不特定多数への公開や本件起因の不正利用は同日時点で確認なし。"},"history":[{"date":"2026-10-20","text":"専用ASPの5システムからの持ち出しを追加。延べ約900万件という試算と、保守認証情報を用いた他環境への試行を整理。"},{"date":"2026-10-21","text":"更新前：{\"id\": \"inc-77e5f2ea90\", \"org\": \"ユミルリンク／Cuenote FC\", \"date\": \"2026-10-19\", \"sourceUpdated\": \"2026-10-19 19:05\", \"checked\": \"2026-10-20\", \"updated\": \"2026-10-20\", \"industry\": \"IT・通信\", \"batch\": \"新規\", \"changeType\": \"新規追加\", \"sources\": [{\"label\": \"公式発表・続報\", \"url\": \"https://www.cuenote.jp/information/news/unauthorizedaccess.html\"}], \"evidence\": \"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。\", \"status\": \"漏えい確認\", \"cat\": [\"不正アクセス\", \"情報漏えい\", \"アカウント侵害\"], \"info\": \"メールアドレスを含む情報の外部持ち出しを確認。出力された情報の詳細は調査中。\", \"scope\": \"Cuenote FC 専用ASPプランの5システム。延べ約900万件の情報が出力されたとの試算で、重複を除いた人数ではない。\", \"impact\": \"10月16日未明に検知。プログラムの脆弱性からサポート・品質管理担当者の認証情報を取得され、不正プログラム設置とDB出力が発生。他システムへの認証試行も確認した。提供元は遮断、修正、担当者認証情報の削除等を実施。\", \"exclude\": \"全Cuenote製品・全顧客を対象とした公表ではない。具体的なCVE、出力情報の確定内訳、利用者への二次被害は当該発表では未公表。\", \"action\": \"提供元に自組織のプラン・システムが対象かを照会。自組織の保守担当者・委託先アカウントが別環境へ接続できる範囲を点検し、修正と認証情報の失効を別々に確認する。\", \"note\": \"10/19 19:05更新の第1報を採用。約900万件は出力件数の試算であり、900万人の被害確認とは記載しない。\", \"change\": \"専用ASPの5システムからの持ち出しを追加。延べ約900万件という試算と、保守認証情報を用いた他環境への試行を整理。\", \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-19\", \"checked\": \"2026-10-20\", \"text\": \"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。\"}}"},{"date":"2026-10-21","text":"提供元と埼玉県利用先の公表を関連付ける。延べ約900万件と669者を合算しない。"},{"date":"2026-10-27","text":"2026-10-26公式続報反映。変更前：{\"sourceUpdated\": \"2026-10-19 19:05\", \"info\": \"メールアドレスを含む情報の外部持ち出しを確認。出力された情報の詳細は調査中。\", \"scope\": \"Cuenote FC 専用ASPプランの5システム。延べ約900万件の情報が出力されたとの試算で、重複を除いた人数ではない。\", \"impact\": \"10月16日未明に検知。プログラムの脆弱性からサポート・品質管理担当者の認証情報を取得され、不正プログラム設置とDB出力が発生。他システムへの認証試行も確認した。提供元は遮断、修正、担当者認証情報の削除等を実施。\", \"exclude\": \"全Cuenote製品・全顧客を対象とした公表ではない。具体的なCVE、出力情報の確定内訳、利用者への二次被害は当該発表では未公表。\", \"action\": \"提供元に自組織のプラン・システムが対象かを照会。自組織の保守担当者・委託先アカウントが別環境へ接続できる範囲を点検し、修正と認証情報の失効を別々に確認する。\", \"change\": \"提供元と埼玉県利用先の公表を関連付ける。延べ約900万件と669者を合算しない。\"}"}],"group":"ユミルリンク関連","relatedIncidents":["inc-767804e269","inc-exreservation-cuenote-20261026","inc-cybozu-cuenote-20261026","inc-gundambase-cuenote-20261027"]},{"id":"inc-d91e3e4fd5","org":"阪急阪神百貨店／H2O ID・予約・通販等","date":"2026-10-19","sourceUpdated":"2026-10-19","checked":"2026-10-20","updated":"2026-10-20","industry":"小売・サービス","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://www.hankyu-dept.co.jp/honten/info/detail/__icsFiles/afieldfile/2026/10/19/1019owabi1.pdf"},{"label":"関連する公式案内","url":"https://www.hankyu-dept.co.jp/honten/info/detail/__icsFiles/afieldfile/2026/10/19/1019owabi2.pdf"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"一部漏えい確認","cat":["不正アクセス","情報漏えい","サービス停止"],"info":"H2O ID、氏名・カナ、性別、メール、郵便番号・住所、電話、年齢・生年月日、利用サービス項目の一部。通販等の注文履歴、カード情報の一部、アドレス帳等は漏えい有無を調査中。","scope":"ほぼ全てのH2O ID会員約126万件の個人情報の一部が漏えい。通販・Remo Orderが保持する情報の調査範囲とは区別する。","impact":"10月16日に予約サイト、17日にE-STORES・Remo Orderへの不正アクセスを確認し停止。19日に会員情報の一部漏えいが判明。同日14時、E-STORESのみ再発防止策と安全確認後に再開したと別の公式案内で公表。","exclude":"カード番号全桁・セキュリティコードは保持していない。通販等が持つカード種別・下4桁・名義・有効期限、ポイントカードの一部、注文履歴等の漏えいは調査中。ログインPW漏えいは未確認。E-STORES再開を全サービス復旧と扱わない。","action":"対象者向けの公式案内と利用機能ごとの稼働を確認。不審なメール・SMS・電話から認証情報を入力しない。自組織では共通IDにひも付く複数サイトの調査範囲と、個別の再開判断を整理する。","note":"10/19の情報漏えい告知と、E-STORES再開告知の2資料を照合。保有情報と実際の漏えい確認範囲を分けて記載。","change":"H2O ID約126万件の一部情報漏えいを追加。通販等の調査中情報と、E-STORESのみの10/19 14時再開を区別。","secondary":{"status":"公表時点で報告なし","date":"2026-10-19","checked":"2026-10-20","text":"公式は本件に起因する不正利用・二次被害を現時点で確認していないと説明。将来の不審連絡に注意を案内。"},"history":[{"date":"2026-10-20","text":"H2O ID約126万件の一部情報漏えいを追加。通販等の調査中情報と、E-STORESのみの10/19 14時再開を区別。"}]},{"id":"inc-4a377622df","org":"ニフティ／回線申込・受付管理システム","date":"2026-10-19","sourceUpdated":"2026-10-19","checked":"2026-10-20","updated":"2026-10-20","industry":"IT・通信","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://www.nifty.co.jp/newsrelease/nifty202610195434.htm"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"漏えいの可能性","cat":["不正アクセス","情報漏えい"],"info":"会員ID、氏名、性別、生年月日、住所、電話番号、メールアドレス。漏えいした可能性のある項目であり、持ち出し確認の公表ではない。","scope":"最大542,513件。2019年以降の対象回線申込者（公式は「当社Webサイトをのぞく」と記載）。対象は@nifty光、@nifty MAX光、@nifty auひかりプラス。","impact":"10月19日10:20頃、回線申込・受付管理システムへの不正アクセスを確認し通信を遮断。顧客が直接使う申込フォームとは異なる、社内で情報を登録する管理用ツール。専門機関と調査中。","exclude":"銀行口座・カード情報は当該システムで保有しておらず対象外。侵入経路・原因は調査中で、既掲載のLinux脆弱性や他ISPの事案との関連は未公表。","action":"対象回線・申込経路を公式案内と照合。不審な連絡から暗証番号・PW・カード情報を渡さない。自組織では顧客向け画面に加え、受付・代理店等の内部管理ツールの認証と保存情報を点検する。","note":"事業者が同じ業種であることだけを理由に、共通の脆弱性や侵入方法と結び付けない。","change":"10/19公表分を追加。社内受付管理ツールの最大542,513件が対象となる可能性。口座・カードは非保持。","secondary":{"status":"未公表・不明","date":"2026-10-19","checked":"2026-10-20","text":"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-20","text":"10/19公表分を追加。社内受付管理ツールの最大542,513件が対象となる可能性。口座・カードは非保持。"}]},{"id":"inc-f6e4ac7260","org":"LIXIL／L-ポケット・L-ポケットLite版","date":"2026-10-19","sourceUpdated":"2026-10-19","checked":"2026-10-20","updated":"2026-10-20","industry":"製造","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://www.lixil.co.jp/announce/notice-info-leak-20261019.htm"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"漏えい確認","cat":["不正アクセス","情報漏えい","サービス停止"],"info":"氏名・カナ、メール、生年月日、性別、会員番号・登録コード、事業者情報（会社名、住所、電話、部署、業種）。","scope":"登録会員等3,379人。その内数としてLIXIL・グループ会社の従業員・退職者375人を含む。","impact":"10月13日に不正アクセスを検知し、外部接続を遮断。L-ポケットとLite版のサービス・アプリ運用、ストア公開を停止。19日から対象者へ個別通知を順次送ると案内。","exclude":"カード・銀行口座等の決済情報への影響はないと説明。基幹システム・社内NWへの侵入、既存データの改ざん・破壊は確認されていない。サービス再開日は未定。","action":"対象サービスと個別案内を確認し、不審な連絡から秘密情報を入力しない。自組織では業務支援アプリと社内基幹環境の境界、会員・取引先情報の保存範囲を点検する。","note":"既掲載のLIXIL・Communeコミュニティ事案とは対象サービスが異なる。共通原因や同一侵入とは認定しない。","change":"L-ポケット等の3,379人の漏えい確認を追加。375人は内数。既存コミュニティ事案とは区別。","secondary":{"status":"公表時点で報告なし","date":"2026-10-19","checked":"2026-10-20","text":"公式は本件に起因する個人情報の不正利用等を現時点で確認していないと説明。"},"history":[{"date":"2026-10-20","text":"L-ポケット等の3,379人の漏えい確認を追加。375人は内数。既存コミュニティ事案とは区別。"}]},{"id":"inc-e7875dbd88","org":"Joshin／社内ネットワーク・一部サービス","date":"2026-10-17","sourceUpdated":"2026-10-26","checked":"2026-10-27","updated":"2026-10-27","industry":"小売・サービス","batch":"続報","changeType":"続報更新","sources":[{"label":"第2報の公表確認（適時開示、本文数値は報道でも照合）","url":"https://finance.yahoo.co.jp/quote/8173.T/disclosure"},{"label":"第2報の具体的内容（INTERNET Watch）","url":"https://internet.watch.impress.co.jp/docs/news/2151273.html"},{"label":"公式発表・続報","url":"https://www.joshin.co.jp/ja/news/info/info-20261017/main/0/link/20261017Notice%20and%20Apology%20Regarding%20System%20Disruption%20Caused%20by%20Unauthorized%20Access.pdf"},{"label":"関連する公式案内","url":"https://www.joshin.co.jp/ja/ir/news/auto_20261019552813/pdfFile.pdf"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"不正アクセス確認・個人情報漏えいの可能性","cat":["不正アクセス","情報漏えい","サービス停止"],"info":"会員情報DB：氏名・住所・電話番号・会員番号。サブスク：会員番号、電話番号・手書きサイン、ログインID・初期パスワード、請求履歴等。リフォーム写真管理：運転免許証画像2件、マイナンバー画像1件、口座番号5件等が漏えいした可能性。","scope":"会員DB最大約600万件、サブスク最大約23万件、リフォーム写真最大約800件（別システムの件数であり独立人数として合算しない）。","impact":"10月16日に異常検知、17日初報、19日追加発表、26日第2報。緊急措置に伴う一部サービス停止と漏えい可能性を調査中。","exclude":"クレジットカード情報は保持していないと説明。漏えい可能性と確認済み流出を区別。攻撃主体・侵入経路・全面復旧は未確認。","action":"初期パスワードの利用状況と変更・失効を確認。本人確認画像の保管・アクセス・削除、委託先保守権限、サービス停止時の代替手順を点検。利用者へなりすまし連絡への注意を案内。","note":"10/19の資料を続報・確認資料として追加し、初回公表日10/17を保持。","change":"10/26第2報で最大約600万件の会員情報、サブスク初期パスワード、免許証・マイナンバー画像等の漏えい可能性を追記。","secondary":{"status":"注意喚起のみ","date":"2026-10-26","checked":"2026-10-27","text":"不審メール・SMS・電話への注意を公表。元事案に起因する金銭被害・不正利用の確認は本文で確認できず、因果関係未確認。"},"history":[{"date":"2026-10-20","text":"10/17初報・10/19確認資料の未掲載分を追加。社内NWへの不正アクセスと一部サービス停止を整理。"},{"date":"2026-10-27","text":"2026-10-26公式続報反映。変更前：{\"sourceUpdated\": \"2026-10-19\", \"status\": \"不正アクセス確認\", \"cat\": [\"不正アクセス\", \"サービス停止\"], \"info\": \"個人情報の漏えいの可能性を否定できず調査中。具体的な項目・対象件数は未公表。\", \"scope\": \"社内ネットワークと一部サービス。詳細な影響範囲を調査中。\", \"impact\": \"10月16日に不正アクセスを検知。アクセス制限に伴い一部サービスが停止し、外部専門機関と調査・復旧を進めている。初報は17日、19日にも公式資料を掲載。\", \"exclude\": \"ランサムウェア、攻撃主体、情報持ち出しの確定は当該発表に記載なし。再開日時は未公表。\", \"action\": \"公式案内で利用できるサービスと停止機能を確認。自組織ではネットワーク遮断時の業務影響、利用者向け案内と代替手段を準備する。\", \"change\": \"10/17初報・10/19確認資料の未掲載分を追加。社内NWへの不正アクセスと一部サービス停止を整理。\"}"}]},{"id":"inc-a2413cf898","org":"トラストバンク／ふるさとチョイス","date":"2026-10-19","sourceUpdated":"2026-10-20","checked":"2026-10-21","updated":"2026-10-21","industry":"IT・通信","batch":"続報","changeType":"続報・補完","sources":[{"label":"今回確認した公式続報","url":"https://www.trustbank.co.jp/newsroom/newsrelease/news261020/"},{"label":"公式発表・続報","url":"https://www.trustbank.co.jp/newsroom/news/news261019/"}],"evidence":"承認済み差分に基づき、10/21の調査で本文を照合した続報を反映。未確認の日付・範囲を推定しない。","status":"漏えい確認","cat":["不正アクセス","情報漏えい","サービス停止"],"info":"氏名、メールアドレス、住所、電話番号、ハッシュ化されたパスワード、寄附控除試算額の外部流出を確認。","scope":"ふるさとチョイス会員情報4,454,097件。10/20時点の確認範囲であり、今後の調査で件数・項目が変動する可能性がある。","impact":"10/19に通常と異なるアクセス傾向を把握し、10/17の不正アクセスと会員情報の流出を確認。10/19 15:50に関連サービスを停止。10/20に個人情報保護委員会へ報告し、10/21に警察へ被害申告予定と説明。再開時期は未定。","exclude":"疑いの検知から流出確認へ更新。具体的な侵入方法・CVEと他社事案との共通原因は未公表。ハッシュ化パスワードの流出を平文パスワードの流出としない。","action":"同じメールアドレス・パスワードを使う他サービスのパスワードを変更し、不審なメール・SMS・電話・郵便に注意。リンク先から秘密情報を入力せず、既知の公式窓口で確認する。自組織では情報漏えいと寄附・申込等の業務停止の対応を分けて整理する。","note":"10/19第1報の「疑い」から、10/20公式の流出確認へ更新。件数は人数と置き換えず公表単位を保持。","change":"疑いから流出確認へ。4,454,097件、氏名・メール・住所・電話・ハッシュ化PW・寄附控除試算額。10/17侵入、19日15:50関連サービス停止、再開未定。PW使い回し先変更と不審連絡への注意を反映。件数は調査で変動し得る。","secondary":{"status":"注意喚起のみ","date":"2026-10-20","checked":"2026-10-21","text":"パスワード使い回しによる他サービスへの不正ログイン、不審連絡への注意を案内。これらが実際に発生したという公表ではない。"},"history":[{"date":"2026-10-20","text":"10/19の疑い検知と関連サービス停止を追加。侵入・漏えいの確定や他社との関連付けは行わない。"},{"date":"2026-10-21","text":"更新前：{\"id\": \"inc-a2413cf898\", \"org\": \"トラストバンク／ふるさとチョイス\", \"date\": \"2026-10-19\", \"sourceUpdated\": \"2026-10-19\", \"checked\": \"2026-10-20\", \"updated\": \"2026-10-20\", \"industry\": \"IT・通信\", \"batch\": \"新規\", \"changeType\": \"新規追加\", \"sources\": [{\"label\": \"公式発表・続報\", \"url\": \"https://www.trustbank.co.jp/newsroom/news/news261019/\"}], \"evidence\": \"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。\", \"status\": \"不正アクセスの疑い\", \"cat\": [\"不正アクセスの疑い\", \"サービス停止\"], \"info\": \"個人情報への影響、漏えい有無・項目・件数は未公表。\", \"scope\": \"ふるさとチョイスと関連サービス。事実関係・影響範囲を調査中。\", \"impact\": \"不正アクセスの疑いがある事象を検知し、被害拡大防止と安全確保のため関連サービスを一時停止したと10月19日に公表。\", \"exclude\": \"不正侵入や情報流出を確定した発表ではない。ユミルリンク事案との関係、攻撃方法、再開日時は未公表。\", \"action\": \"利用者は公式続報を確認。自組織では寄付・申込・決済等の業務依存を把握し、安全確認中の受付方法と問い合わせ経路を整理する。\", \"note\": \"疑いの検知と侵害の確認を区別。同日の他社公表や報道の見出しから共通原因を推定しない。\", \"change\": \"10/19の疑い検知と関連サービス停止を追加。侵入・漏えいの確定や他社との関連付けは行わない。\", \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-19\", \"checked\": \"2026-10-20\", \"text\": \"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。\"}}"},{"date":"2026-10-21","text":"疑いから流出確認へ。4,454,097件、氏名・メール・住所・電話・ハッシュ化PW・寄附控除試算額。10/17侵入、19日15:50関連サービス停止、再開未定。PW使い回し先変更と不審連絡への注意を反映。件数は調査で変動し得る。"}]},{"id":"inc-348c296a22","org":"スカイマーク／新卒・既卒採用お問い合わせ","date":"2026-10-19","sourceUpdated":"2026-10-19","checked":"2026-10-20","updated":"2026-10-20","industry":"交通・旅行・宿泊","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://www.skymark.co.jp/ja/company/press/pdf/__icsFiles/afieldfile/2026/10/19/press_1019.pdf"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"閲覧可能状態","cat":["設定不備","情報漏えいの可能性"],"info":"氏名・フリガナ、メール、学校名・勤務先名や学部・部署、問い合わせ内容。","scope":"2016年3月〜2020年2月の採用問い合わせ488人分。設定不備により2016年3月〜2026年10月16日に外部から閲覧可能だった。","impact":"10月16日にアクセス設定を修正。2025年6月9日以降の保存ログにはアクセス記録なし。それより前はログが残っておらず、閲覧有無を判定できない。","exclude":"住所・電話番号・カード情報は含まれない。第三者の閲覧・流出、二次被害、外部からの攻撃の痕跡は確認されていない。ログのない期間を未閲覧と確定しない。","action":"利用終了済みの採用・問い合わせデータも含め、認証・認可、公開設定、保存期限と削除、アクセスログの保存期間を点検する。","note":"設定上閲覧できたことと、実際に第三者が取得したことを区別。10/19公式PDFで確認。","change":"採用問い合わせ488人分の閲覧可能状態を追加。現存ログでの未確認と、古い期間の記録なしを区別。","secondary":{"status":"公表時点で報告なし","date":"2026-10-19","checked":"2026-10-20","text":"公式は第三者閲覧・情報流出・二次被害を確認していないと説明。古い期間はログがなく判定不能。"},"history":[{"date":"2026-10-20","text":"採用問い合わせ488人分の閲覧可能状態を追加。現存ログでの未確認と、古い期間の記録なしを区別。"}]},{"id":"inc-a2fc11f8ee","org":"日本貿易振興機構／JETROウェブサイト","date":"2026-10-19","sourceUpdated":"2026-10-19","checked":"2026-10-20","updated":"2026-10-20","industry":"行政・公共","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://www.jetro.go.jp/"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"漏えい確認","cat":["不正アクセス","情報漏えい","サービス停止"],"info":"企業名、企業担当者のメールアドレスなど743件の個人情報の漏えいを確認。","scope":"一部ウェブサイトへの不正アクセス。743件は公表された情報件数で、重複を除いた人数とは明記されていない。","impact":"10月14日から不正アクセスを確認し、17日からウェブサイトを停止。19日の臨時サイト告知で漏えい確認と対象企業への通知済みを公表。臨時サイトにサービス別の連絡先を掲載。","exclude":"臨時サイトの開設は全システム復旧を意味しない。具体的な侵入経路、追加の被害範囲、全面再開日は調査中・未公表。","action":"貿易相談等の継続サービスと公式の問い合わせ先を確認。イベントは既に受付完了メールを受けた申込の扱いを公式案内で照合。自組織でも本サイト停止時の臨時告知と受付記録の引継ぎを準備する。","note":"10/19臨時サイトの本文を採用し、初期報道の「漏えい不明」から公式の確認情報へ整理。","change":"公式の743件の漏えい確認を追加。サイト停止と、臨時サイト経由の業務継続を整理。","secondary":{"status":"未公表・不明","date":"2026-10-19","checked":"2026-10-20","text":"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-20","text":"公式の743件の漏えい確認を追加。サイト停止と、臨時サイト経由の業務継続を整理。"}]},{"id":"inc-3cd294f104","org":"スクウェア・エニックス／アカウント","date":"2026-10-19","sourceUpdated":"2026-10-19","checked":"2026-10-20","updated":"2026-10-20","industry":"小売・サービス","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://jp.finalfantasyxiv.com/lodestone/news/detail/7a3ea81bad4e15c107251cfe644209dcc2cd4e08"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"不正ログイン確認","cat":["不正アクセス","アカウント侵害"],"info":"他社サービスから流出したと思われるID・PWの組合せを使った不正ログインを確認。具体的な流出元・対象件数は未公表。","scope":"スクウェア・エニックス アカウント。個別の被害範囲は当該案内では未公表。","impact":"10月19日に不正ログインへの注意を公表。第三者の利用が疑われるアカウントを制限し、PWの使い回しや推測しやすいPWの見直し、ワンタイムパスワード利用を案内。","exclude":"同社DBから認証情報が新たに漏えいしたという発表ではない。全アカウントPWの強制リセットは今後の状況次第の可能性であり、実施済みではない。","action":"公式サイトからPWの使い回しを解消し、OTPを設定。自組織でも外部で使ったPWの再利用、休眠アカウント、不審ログインの検知とセッション失効を点検する。","note":"流出元は「他社サービスからと思われる」という提供元の評価。具体的な他社を推定しない。","change":"10/19の不正ログイン確認を追加。PW再利用とOTP、対象アカウント制限の案内を整理。","secondary":{"status":"未公表・不明","date":"2026-10-19","checked":"2026-10-20","text":"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-20","text":"10/19の不正ログイン確認を追加。PW再利用とOTP、対象アカウント制限の案内を整理。"}]},{"id":"inc-b9c19cea5f","org":"リクルート／カーセンサーnet","date":"2026-10-17","sourceUpdated":"2026-10-17","checked":"2026-10-20","updated":"2026-10-20","industry":"交通・旅行・宿泊","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://www.carsensor.net/"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"不審アクセス検知","cat":["不正アクセスの疑い","サービス停止"],"info":"情報漏えいの有無、対象情報・件数は未公表。","scope":"カーセンサーnet、アプリ版カーセンサー、中古車販売店向けC-match等の全関連サービス。","impact":"10月17日に外部からの不審なアクセスを検知し、安全確保と影響確認のため同日17時頃から関連サービスを一時停止。原因・影響範囲を調査中。","exclude":"不審なアクセスの検知を、侵入・情報持ち出しの確定とは扱わない。攻撃方法、情報漏えいの有無、再開日時は未公表。","action":"利用者・販売店は公式の続報と代替連絡方法を確認。自組織でもWeb・アプリ・取引先業務支援の共通基盤が停止した場合の受付・連絡手順を準備する。","note":"10/20に公式停止画面の日本語本文を再確認。HTTP 503でも掲載されている公式告知を根拠とする。","change":"10/17検知・同日17時頃からの全関連サービス一時停止を追加。原因・漏えいは未確定。","dateBasis":"公式告知に記載の検知・停止日（掲載日の明記なし）","secondary":{"status":"未公表・不明","date":"2026-10-17","checked":"2026-10-20","text":"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-20","text":"10/17検知・同日17時頃からの全関連サービス一時停止を追加。原因・漏えいは未確定。"}]},{"id":"inc-7722fce380","org":"アジケ／コーポレートサイトのStudioフォーム","date":"2026-10-19","sourceUpdated":"2026-10-19","checked":"2026-10-20","updated":"2026-10-20","industry":"IT・通信","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://ajike.co.jp/news/notice-studio-unauthorized-access-2026-10"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"漏えいの可能性","cat":["委託先被害","情報漏えい"],"info":"氏名、会社名、メール、電話、問い合わせ等のフォーム入力内容。暗号化されていたが、提供元は復号に必要な鍵も読み出されたと説明。","scope":"お問い合わせ・資料請求・採用応募フォームの提供開始〜10月1日の送信734件。送信件数であり人数ではない。","impact":"Studioのクラウド環境への不正アクセスに関連。10月16日に提供元から連絡を受け、19日に第1報を公表。PW変更・不要アカウント削除、オーナー変更、プレビューURL再発行、Googleスプレッドシート連携解除を実施。","exclude":"自社提供サービスや業務システムで預かる情報は本件の対象外。自社サイトサーバー・社内システムへの侵入は未確認。第三者による取得の事実は未確認だが、取得された前提で対応すると説明。","action":"対象者は公式の案内と続報を確認。自組織でもフォーム保存先、復号鍵、スプレッドシート連携、プレビューURLと管理者権限を見直す。","note":"公式ページの埋込み本文を照合し734件を確認。共通グループStudioの利用組織の公表として扱い、独立した攻撃として加算しない。","change":"Studio関連の利用組織公表を追加。フォーム送信734件は人数ではない。連携解除等の対応を整理。","secondary":{"status":"公表時点で報告なし","date":"2026-10-19","checked":"2026-10-20","text":"アジケは二次被害を把握していないと説明。提供元は引き続き調査中。"},"group":"Studio","history":[{"date":"2026-10-20","text":"Studio関連の利用組織公表を追加。フォーム送信734件は人数ではない。連携解除等の対応を整理。"}]},{"id":"inc-0e48740f3f","org":"GreenEchoes Studio／Greenkeys・会社サイト","date":"2026-10-19","sourceUpdated":"2026-10-20","checked":"2026-10-20","updated":"2026-10-20","industry":"IT・通信","batch":"新規","changeType":"新規追加","sources":[{"label":"公式発表・続報","url":"https://company.greenechoes-studio.com/archives/2053"},{"label":"関連する公式案内","url":"https://green-keys.info/security-incident-report-20261019/"}],"evidence":"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。","status":"不正プラグイン設置確認","cat":["不正アクセス","サイト改ざん","サービス停止"],"info":"問い合わせ情報等は外部サービスで管理し、Webサーバー内には保存しない運用。管理用アカウントや外部連携情報への影響を引き続き確認中。","scope":"GreenkeysとGreenEchoes Studioの2サイト。管理者が意図しないWordPressプラグインの設置と表示障害を確認。","impact":"10月19日に設置を確認し、除去・接続解除・認証情報変更・整合性検査を実施。現在は通常表示が可能。20日追記ではUpdraftCentral経由の操作記録と設置時刻が一致し、TeamUpdraft事案との関連可能性が高いと利用者自身が説明。具体的な経路は未確定。","exclude":"TeamUpdraftと同じ原因と確定したものではない。主要検査で新たな明確な不正プログラムを確認していないが、全ての侵害の不存在を証明したとはしていない。漏えい人数・件数の公表なし。","action":"同社は旧接続キー削除、認証情報見直し、外部ストレージの旧許可・鍵の取消と再発行、バックアップ動作確認を実施し、当面再接続しない方針。自組織でも接続先ごとの権限・鍵と残存侵害を別々に確認する。","note":"提供元のTeamUpdraft事案との関連は利用者による調査上の評価。共通原因を確定するグループには登録せず、関連資料として相互参照する。","change":"2サイトの不正プラグイン設置と復旧を追加。UpdraftCentralとの関連は可能性として記載し、接続解除・外部鍵更新・バックアップ試験を整理。","secondary":{"status":"未公表・不明","date":"2026-10-20","checked":"2026-10-20","text":"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-20","text":"2サイトの不正プラグイン設置と復旧を追加。UpdraftCentralとの関連は可能性として記載し、接続解除・外部鍵更新・バックアップ試験を整理。"}],"relatedVulnerabilities":["v-updraftcentral-202610"],"relatedIncidents":["inc-802064bf02"]},{"id":"inc-802064bf02","org":"TeamUpdraft／UpdraftCentral・UpdraftVault・UpdraftClone","date":"2026-10-19","sourceUpdated":"2026-10-21 00:25 JST（10/20 16:25 BST）","checked":"2026-10-21","updated":"2026-10-21","industry":"IT・通信","batch":"続報","changeType":"続報・補完","sources":[{"label":"今回確認した公式続報","url":"https://teamupdraft.com/blog/security-incident-october-2026/"},{"label":"Xserver｜10/20接続キーの注意喚起","url":"https://www.xserver.ne.jp/news_detail.php?view_id=19722"}],"evidence":"承認済み差分に基づき、10/21の調査で本文を照合した続報を反映。未確認の日付・範囲を推定しない。","status":"漏えいの可能性","cat":["不正アクセス","情報漏えい","委託先被害"],"info":"氏名・メール・請求先・注文履歴、ハッシュ化パスワード、2FA設定、UpdraftCentral／Vault／Cloneの接続キー等を持つ顧客DBにアクセスされた可能性があると提供元が説明。","scope":"teamupdraft.comの顧客DB。対象人数・サイト数は未公表。海外提供元の事案で、国内のWordPress利用にも関連する。","impact":"10月17〜18日に不正アクセスを検知。侵入経路の遮断、全アカウントのサインアウト、鍵・認証情報の変更を実施。UpdraftCentral接続キーがサイト管理操作に使えるため、接続先の調査と旧キー削除を求めている。 最新追記では、不正アクセスの経路を解消し、10/19 22時BST過ぎに公開した更新で旧Central接続キーを失効させたと説明。これは接続先に残る侵害の調査完了を意味しない。","exclude":"プラグイン本体・公式配布物は影響なしと説明。自己ホスト型UpdraftCentralは対象外。無料プラグインのみで同社アカウントを持たない利用者には本件固有の対応不要と案内。接続先侵害の可能性は別に調べる。","action":"UpdraftPlus無料版1.26.13／Premium版2.26.13以降の対策版を適用し、実際の稼働版を確認する。各サイトの旧Centralキーを削除し、不審な管理者・通常／MUプラグイン・PHP・定期実行等を調査。管理者とteamupdraft.comのPW・2FAを再設定し、Vault再接続後の手動バックアップ試験、Cloneの新キーも確認する。Central経由で侵害された可能性があるサイトは外部保存先の再認証・鍵変更も確認する。","note":"公式最終更新10/20 16:25 BSTはJST10/21 00:25。前回の指定版から1.26.13／2.26.13へ更新。Xserverも10/20に接続キー削除等の注意喚起を公表。自己ホスト型等の除外と、プラグイン配布物は対象外という説明を維持。","change":"公式指定版が1.26.13無料／2.26.13Premiumへ更新。19日22時BST過ぎに公開した更新で旧Centralキーを失効したと説明。各サイトでの適用確認・旧キー削除・既存侵害調査は継続。Xserverも10/20に注意喚起。プラグイン本体や配布ファイルの改ざん事案としない。","secondary":{"status":"未公表・不明","date":"2026-10-20","checked":"2026-10-21","text":"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-20","text":"提供元の顧客DB・接続キーへの影響を追加。旧キー削除、接続先調査、Vault再接続後のバックアップ試験を優先確認。"},{"date":"2026-10-21","text":"更新前：{\"id\": \"inc-802064bf02\", \"org\": \"TeamUpdraft／UpdraftCentral・UpdraftVault・UpdraftClone\", \"date\": \"2026-10-19\", \"sourceUpdated\": \"2026-10-20 03:03 JST（10/19 19:03 BST）\", \"checked\": \"2026-10-20\", \"updated\": \"2026-10-20\", \"industry\": \"IT・通信\", \"batch\": \"新規\", \"changeType\": \"新規追加\", \"sources\": [{\"label\": \"公式発表・続報\", \"url\": \"https://teamupdraft.com/blog/security-incident-october-2026/\"}], \"evidence\": \"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。\", \"status\": \"漏えいの可能性\", \"cat\": [\"不正アクセス\", \"情報漏えい\", \"委託先被害\"], \"info\": \"氏名・メール・請求先・注文履歴、ハッシュ化パスワード、2FA設定、UpdraftCentral／Vault／Cloneの接続キー等を持つ顧客DBにアクセスされた可能性があると提供元が説明。\", \"scope\": \"teamupdraft.comの顧客DB。対象人数・サイト数は未公表。海外提供元の事案で、国内のWordPress利用にも関連する。\", \"impact\": \"10月17〜18日に不正アクセスを検知。侵入経路の遮断、全アカウントのサインアウト、鍵・認証情報の変更を実施。UpdraftCentral接続キーがサイト管理操作に使えるため、接続先の調査と旧キー削除を求めている。\", \"exclude\": \"プラグイン本体・公式配布物は影響なしと説明。自己ホスト型UpdraftCentralは対象外。無料プラグインのみで同社アカウントを持たない利用者には本件固有の対応不要と案内。接続先侵害の可能性は別に調べる。\", \"action\": \"公式が指定するUpdraftPlus無料版1.26.12／Premium2.26.12以降の提供・適用を確認し、各サイトの旧Centralキーを削除。不審な管理者・プラグイン等と既存侵害を調査し管理者PWを変更。teamupdraft.comのPW・2FAを再設定。Vaultは再接続後の手動バックアップ、Cloneは新キーを確認する。\", \"note\": \"海外公式の最終更新10/19 19:03 BSTはJST10/20 03:03。本文には指定版のリリース説明と提供時の追記予告が併存するため、実際の配布・適用は各環境で確認する。単一CVEのプラグイン脆弱性として扱わない。\", \"change\": \"提供元の顧客DB・接続キーへの影響を追加。旧キー削除、接続先調査、Vault再接続後のバックアップ試験を優先確認。\", \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-20\", \"checked\": \"2026-10-20\", \"text\": \"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。\"}, \"relatedVulnerabilities\": [\"v-updraftcentral-202610\"], \"relatedIncidents\": [\"inc-0e48740f3f\"]}"},{"date":"2026-10-21","text":"公式指定版が1.26.13無料／2.26.13Premiumへ更新。19日22時BST過ぎに公開した更新で旧Centralキーを失効したと説明。各サイトでの適用確認・旧キー削除・既存侵害調査は継続。Xserverも10/20に注意喚起。プラグイン本体や配布ファイルの改ざん事案としない。"}],"relatedVulnerabilities":["v-updraftcentral-202610"],"relatedIncidents":["inc-0e48740f3f"]},{"id":"inc-f4fb390c80","org":"Rank Math／Rank Math PRO配布物","date":"2026-10-16","sourceUpdated":"追記日未記載（2026-10-21本文確認）","checked":"2026-10-21","updated":"2026-10-21","industry":"IT・通信","batch":"続報","changeType":"続報・補完","sources":[{"label":"今回確認した公式続報","url":"https://rankmath.com/kb/pro-3-0-123-security-incident/"},{"label":"CNA｜CVE登録情報","url":"https://cveawg.mitre.org/api/cve/CVE-2026-111862"}],"evidence":"承認済み差分に基づき、10/21の調査で本文を照合した続報を反映。未確認の日付・範囲を推定しない。","status":"配布物改ざん確認","cat":["不正アクセス","配布物改ざん","委託先被害"],"info":"Rank Math PRO 3.0.123の一部配布ファイルにマルウェア混入。対象サイト数・情報流出件数は未公表。CVE-2026-111862として登録。","scope":"公式の対象取得期間は10/15 20:02〜10/16 07:12 UTC（JST10/16 05:02〜16:12）。版番号だけで全3.0.123を侵害済みと判定しない。","impact":"対象ファイルを有効化したWordPressサイトは、侵害済みとして対応するよう提供元が要請。3.0.124への更新だけでは既に設置された不正コード等を取り除けないため、復元・調査と認証情報の変更を案内。 対応時のシステム更新で10/13〜16登録の無料アカウントが削除され、一部の連携機能が再作成・再接続まで使えない旨の追記を確認。","exclude":"WordPress.orgの無料版は対象外。対象ファイルのダウンロードのみ、未有効化、有効化済みで必要な処置が異なる。全利用者の情報流出を確認したという発表ではない。 無料アカウント削除の追記は無料プラグインの感染を示すものではない。サイト内のSEO設定・コンテンツは影響なしとの説明。","action":"版・取得日時・有効化の有無を照合。有効化済みは公式案内に従い証拠を保全し、侵害前の正常なバックアップから復元・スキャン、管理者やDB・連携先等の秘密情報を更新する。未有効化は対象ファイルを除去し正常版3.0.124等へ入れ替え、確認する。 対象の無料アカウント利用者は公式サイトから同じメール・ログイン方法で再作成し、サイトを再接続する。メール中の不審な再設定・ダウンロード要求には従わず、既知の公式サイトから確認する。","note":"海外の配布物事案。手動での不正ファイル削除等は個別の専門手順を要するため公式・担当者の案内を参照。更新だけで対応完了とはしない。 無料アカウントに関する追記日は未記載のため、10/21は本文確認日として示す。","change":"10/13〜16登録の無料アカウントが対応時のシステム更新で削除されたため再作成・再接続が必要な旨を追記。無料プラグインの感染ではなく、サイト内SEO設定・コンテンツは影響なしとの説明。既存PRO配布物の取得期間・有効化・3.0.124と侵害後復旧の注意は保持。","secondary":{"status":"未公表・不明","date":"2026-10-19","checked":"2026-10-20","text":"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-20","text":"CVE-2026-111862の配布物改ざんを追加。3.0.123の対象取得期間と有効化を照合し、正常版更新と侵害済みサイトの復旧を分ける。"},{"date":"2026-10-21","text":"更新前：{\"id\": \"inc-f4fb390c80\", \"org\": \"Rank Math／Rank Math PRO配布物\", \"date\": \"2026-10-16\", \"sourceUpdated\": \"2026-10-19\", \"checked\": \"2026-10-20\", \"updated\": \"2026-10-20\", \"industry\": \"IT・通信\", \"batch\": \"新規\", \"changeType\": \"新規追加\", \"sources\": [{\"label\": \"公式発表・続報\", \"url\": \"https://rankmath.com/kb/pro-3-0-123-security-incident/\"}, {\"label\": \"CNA｜CVE登録情報\", \"url\": \"https://cveawg.mitre.org/api/cve/CVE-2026-111862\"}], \"evidence\": \"公式発表本文を2026-10-20（JST）の調査で確認。公表時点の事実と編集上の点検案を区別。\", \"status\": \"配布物改ざん確認\", \"cat\": [\"不正アクセス\", \"配布物改ざん\", \"委託先被害\"], \"info\": \"Rank Math PRO 3.0.123の一部配布ファイルにマルウェア混入。対象サイト数・情報流出件数は未公表。CVE-2026-111862として登録。\", \"scope\": \"公式の対象取得期間は10/15 20:02〜10/16 07:12 UTC（JST10/16 05:02〜16:12）。版番号だけで全3.0.123を侵害済みと判定しない。\", \"impact\": \"対象ファイルを有効化したWordPressサイトは、侵害済みとして対応するよう提供元が要請。3.0.124への更新だけでは既に設置された不正コード等を取り除けないため、復元・調査と認証情報の変更を案内。\", \"exclude\": \"WordPress.orgの無料版は対象外。対象ファイルのダウンロードのみ、未有効化、有効化済みで必要な処置が異なる。全利用者の情報流出を確認したという発表ではない。\", \"action\": \"版・取得日時・有効化の有無を照合。有効化済みは公式案内に従い証拠を保全し、侵害前の正常なバックアップから復元・スキャン、管理者やDB・連携先等の秘密情報を更新する。未有効化は対象ファイルを除去し正常版3.0.124等へ入れ替え、確認する。\", \"note\": \"海外の配布物事案。手動での不正ファイル削除等は個別の専門手順を要するため公式・担当者の案内を参照。更新だけで対応完了とはしない。\", \"change\": \"CVE-2026-111862の配布物改ざんを追加。3.0.123の対象取得期間と有効化を照合し、正常版更新と侵害済みサイトの復旧を分ける。\", \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-19\", \"checked\": \"2026-10-20\", \"text\": \"確認した当該発表では二次被害の有無は未公表。未記載を被害なしと扱わない。\"}, \"relatedVulnerabilities\": [\"v-rankmath-202610\"]}"},{"date":"2026-10-21","text":"10/13〜16登録の無料アカウントが対応時のシステム更新で削除されたため再作成・再接続が必要な旨を追記。無料プラグインの感染ではなく、サイト内SEO設定・コンテンツは影響なしとの説明。既存PRO配布物の取得期間・有効化・3.0.124と侵害後復旧の注意は保持。"}],"relatedVulnerabilities":["v-rankmath-202610"]},{"id":"inc-cd8e8d21af","org":"GMOインターネット／お名前.com デスクトップクラウド","date":"2026-10-21","sourceUpdated":"2026-10-28 11:00 JST","checked":"2026-10-29","updated":"2026-10-29","industry":"IT・通信","cat":["不正アクセス","サービス停止"],"status":"情報持出し・攻撃者による公開確認／不正取引報告","info":"サーバー内情報の閲覧可能性。サーバーで利用した認証情報の取得・悪用の可能性を調査中。決済情報は非保持と説明。","scope":"影響可能性のあるサーバー26,739件。人数ではない。10/20に一部環境の不正プログラムを確認。","impact":"現行基盤をそのまま再開せず構成刷新の方針。利用者の不正取引報告に加え、10月27日に攻撃者とみられる者による顧客関連情報の公開を提供元が確認。公開対象と個別確認された利用者には、情報区分に応じた特別見舞金（基本情報1万円、金融・認証情報1万5千円、機微情報2万5千円、1公開当たり上限300万円）を第4報の見舞金・不正取引補償とは別に案内。 10/28午前4時頃、情報掲載サイトのドメイン停止を確認。新規ミラー等の監視とテイクダウンを継続。","action":"安全な端末からパスワード変更・全セッション失効・取引確認を行い、不審取引は金融事業者へ連絡。公開情報を称するサイトへアクセス・転載せず、既にアクセスした場合は端末をフルスキャン。便乗フィッシングや『被害金回収』を装う費用請求を避け、個別対象・補償は公式24時間窓口で確認する。","exclude":"26,739は影響可能性のあるサーバー数で人数ではない。公開情報の個別対象・範囲は提供元確認後に本人へ連絡する方針。情報公開そのものを金銭被害等の二次被害とは数えず、不正取引報告との因果・件数は未確定。特定アクターへの帰属は未確認。","note":"第12報（10/27 19:10）を反映。攻撃者への支払い拒否と、捜査協力情報を募る懸賞制度を公表。漏えいデータや認証情報の購入・拡散・独自接触を求める制度ではない。","batch":"続報","changeType":"続報更新","change":"犯人サイトのドメイン停止確認を追記。停止は流出済み情報の回収を意味しない。","evidence":"GMOインターネット第12報本文で情報公開、脅迫、補償区分、公開サイトアクセス時の情報取得、今後の対応を確認。","sources":[{"label":"GMO｜第4報・復旧方針と補償","url":"https://group.gmo/info/alert/20261024/"},{"label":"今回確認した公式続報","url":"https://group.gmo/info/alert/20261023/"},{"label":"今回確認した公式続報","url":"https://group.gmo/info/alert/20261022/"},{"label":"公式発表・続報","url":"https://www.onamae.com/news/article/11584"},{"label":"関連する公式案内","url":"https://www.onamae.com/news/article/11583"},{"label":"GMOインターネット｜第12報（2026/10/27 19:10）","url":"https://internet.gmo/news/article/258"},{"label":"GMO第13報｜10/28","url":"https://internet.gmo/news/article/259"}],"secondary":{"status":"被害確認（不正取引報告）／情報公開確認","date":"2026-10-27","checked":"2026-10-28","text":"一部利用者から身に覚えのない取引の報告があり、攻撃者による顧客関連情報の公開も提供元が確認。個別対象は提供元が確認後に連絡する。公開それ自体を金銭被害等の二次被害とは数えず、全報告の因果・人数・件数は未確定。"},"history":[{"date":"2026-10-21","text":"10/21 4時の公表を追加。全プランの順次停止と26,739サーバーの影響可能性、保存認証情報の変更を整理。"},{"date":"2026-10-23","text":"更新前：{\"sourceUpdated\": \"2026-10-21 04:00 JST\", \"status\": \"不正プログラム設置確認・情報閲覧の可能性\", \"info\": \"サーバー内情報の閲覧可能性。預託個人情報の漏えい・不正利用は未確認。決済情報は非保持と説明。\", \"scope\": \"影響可能性のあるサーバー26,739件。人数ではない。10/20に一部環境の不正プログラムを確認。\", \"impact\": \"10/21 04:00以降、全プランのサーバーを順次停止。新規申込とコントロールパネルも停止。再開時期未定。旧メンテナンス予告の10/21 12:00を現行の再開予定にしない。\", \"exclude\": \"預託個人情報の漏えい・閲覧情報の悪用は未確認。決済情報は非保持と説明。26,739は影響可能性のあるサーバー数で、侵害確認数や人数ではない。具体的な原因・CVEや他社事案との関係は未公表。\", \"action\": \"サーバー内で保管・利用していたID・パスワードと使い回し先を速やかに変更し、業務の代替手段を確認。調査の記録を保全し、公式の再開・個別案内を確認する。\", \"note\": \"10/20の旧メンテナンス予告と、10/21 4時時点の停止告知を区別。旧予告の10/21正午を現在の再開予定として扱わない。\"}"},{"date":"2026-10-23","text":"利用者から不正取引操作の報告あり。因果・全被害確認済みとしない。別端末でPW変更、取引確認、業者連絡。"},{"date":"2026-10-24","text":"更新前：{\"status\": \"不正プログラム設置確認・情報閲覧の可能性\", \"info\": \"サーバー内情報の閲覧可能性。サーバーで利用した認証情報の取得・悪用の可能性を調査中。決済情報は非保持と説明。\", \"scope\": \"影響可能性のあるサーバー26,739件。人数ではない。10/20に一部環境の不正プログラムを確認。\", \"impact\": \"10/21 04:00以降、全プランのサーバーを順次停止。新規申込とコントロールパネルも停止。再開時期未定。旧メンテナンス予告の10/21 12:00を現行の再開予定にしない。 10/21以降、利用者から取引口座の不正操作の報告を受領。全プラン停止は継続し再開日時未定。\", \"exclude\": \"26,739は影響可能性のあるサーバー数で、侵害確認数や人数ではない。不正取引の利用者報告と、全被害の因果関係・原因CVEの確定を区別。\", \"action\": \"影響サーバー以外の別端末から、保存・利用していた認証情報と使い回し先を変更。セッションを終了し、取引履歴・残高を確認。不審取引は取引業者へ連絡し、多要素認証と代替業務を確認。\", \"sourceUpdated\": \"2026-10-22 16:59 JST\", \"secondary\": {\"status\": \"不正取引操作の報告\", \"date\": \"2026-10-22\", \"checked\": \"2026-10-23\", \"text\": \"利用者から不正操作の報告があると提供元が公表。すべての被害と本件との因果関係を確定したという意味ではない。\"}}"},{"date":"2026-10-24","text":"第3報16:10。PW変更済みでも残存取引セッションが継続し得るため全セッション切断必須。他端末で変更、証券/FX事業者へ失効依頼。端末スキャンは予防措置で端末感染確認ではない。26739サーバー可能性・全プラン停止・再開未定維持。"},{"date":"2026-10-25","text":"更新前：{\"info\": \"サーバー内情報の閲覧可能性。サーバーで利用した認証情報の取得・悪用の可能性を調査中。決済情報は非保持と説明。\", \"scope\": \"影響可能性のあるサーバー26,739件。人数ではない。10/20に一部環境の不正プログラムを確認。\", \"status\": \"不正プログラム設置確認・情報閲覧の可能性\", \"impact\": \"10/21 04:00以降、全プランのサーバーを順次停止。新規申込とコントロールパネルも停止。再開時期未定。旧メンテナンス予告の10/21 12:00を現行の再開予定にしない。 10/21以降、利用者から取引口座の不正操作の報告を受領。全プラン停止は継続し再開日時未定。\", \"exclude\": \"26,739は影響可能性のあるサーバー数で確認侵害数・人数ではない。利用者端末スキャンは予防要請で端末感染確認を意味しない。個別の情報取得・不正利用の有無と範囲は調査中。\", \"action\": \"FX取引に使っていない別端末からPW変更。変更済みでも取引セッションが残る場合があるため、全セッションを切断するか証券・FX事業者へ失効を依頼。取引履歴・残高と二要素認証、サーバーやブラウザーに保存した他認証情報も確認。\", \"sourceUpdated\": \"2026-10-23 16:10 JST\"}"},{"date":"2026-10-25","text":"第4報：現行基盤はそのまま再開せず代替サービスを案内。見舞金・条件付き補償と脅迫受領を公表。"},{"date":"2026-10-28","text":"更新前：10/24第4報まで。10/27第12報で攻撃者による情報公開、金銭要求を伴う脅迫、公開確認対象への追加見舞金、公開サイト閲覧者情報の取得確認を反映。"},{"date":"2026-10-28","text":"第12報を反映。情報公開確認と個別対象確認を区別し、追加見舞金・公開サイト閲覧リスク・便乗詐欺対策を更新。"},{"date":"2026-10-29","text":"第13報：犯人サイトのドメイン停止を確認。再出現監視・拡散防止を継続。"}]},{"id":"inc-0ae32cb2f4","org":"NEC／開発・保守委託先経由の顧客被害","date":"2026-10-20","sourceUpdated":"2026-10-20","checked":"2026-10-21","updated":"2026-10-22","industry":"IT・通信","cat":["委託先被害","不正アクセス","情報漏えい","暗号化","サービス停止"],"status":"漏えい確認","info":"顧客の個人情報・システム関連情報を含む共有クラウドストレージのファイル漏えいを確認。","scope":"複数顧客。人数・企業数・情報件数・委託先名は未公表。","impact":"9月下旬の委託先被害で窃取された正規アカウントを悪用し、顧客環境のファイルを暗号化・システム停止。","action":"提供元の個別案内を確認。自組織では保守端末・正規ID・顧客環境への接続・共有ストレージを棚卸しし、権限の失効、暗号化範囲、漏えい範囲を別々に確認する。","exclude":"委託先名、被害顧客数・人数、具体的な侵入経路やランサムウェアの名称は未公表。他社事案との共通原因を推定しない。","note":"顧客サーバーのファイル暗号化と、共有クラウドストレージのファイル漏えいを分けて整理。","batch":"続報","changeType":"関連付け補完","change":"大学2組織の公式公表とNEC提供元の公表を関連付け。人数・件数は合算しない。","evidence":"公表本文を2026-10-21（JST）の調査で確認。発生・公表・情報更新・一覧反映の日付を区別。","sources":[{"label":"公式発表・続報","url":"https://jpn.nec.com/news/info/20261020.html"}],"secondary":{"status":"未公表・不明","date":"2026-10-20","checked":"2026-10-21","text":"確認した当該公表では、二次被害の個別確認状況は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-21","text":"未掲載の公表を追加。複数顧客。人数・企業数・情報件数・委託先名は未公表。"},{"date":"2026-10-22","text":"更新前：{\"sourceUpdated\": \"2026-10-20\", \"status\": \"漏えい確認\", \"info\": \"顧客の個人情報・システム関連情報を含む共有クラウドストレージのファイル漏えいを確認。\", \"scope\": \"複数顧客。人数・企業数・情報件数・委託先名は未公表。\", \"impact\": \"9月下旬の委託先被害で窃取された正規アカウントを悪用し、顧客環境のファイルを暗号化・システム停止。\", \"exclude\": \"委託先名、被害顧客数・人数、具体的な侵入経路やランサムウェアの名称は未公表。他社事案との共通原因を推定しない。\", \"action\": \"提供元の個別案内を確認。自組織では保守端末・正規ID・顧客環境への接続・共有ストレージを棚卸しし、権限の失効、暗号化範囲、漏えい範囲を別々に確認する。\", \"note\": \"顧客サーバーのファイル暗号化と、共有クラウドストレージのファイル漏えいを分けて整理。\"}"},{"date":"2026-10-22","text":"大学2組織の公式公表とNEC提供元の公表を関連付け。人数・件数は合算しない。"}],"group":"NEC委託先関連","relatedIncidents":["inc-e060744680","inc-5070a0a689"]},{"id":"inc-139bd9d3eb","org":"岩井コスモ証券／トレードワークス委託システム","date":"2026-10-16","sourceUpdated":"2026-10-20","checked":"2026-10-21","updated":"2026-10-21","industry":"金融・保険","cat":["委託先被害","不正アクセス","情報漏えい","不正取引"],"status":"漏えい確認","info":"氏名・メールアドレス等、初報で示した範囲の情報。取引暗証番号は含まれないと説明。","scope":"4,975人（従来4,611人＋再調査364人）。新たな侵入・漏えいではない。","impact":"別に売買管理システムへの攻撃で7口座に不正注文、うち5口座で約定。取引前へ戻す措置済みで顧客負担なしと公表。漏えい情報を使ったものではないと明記。通常取引可能。","action":"漏えいと業務システムの不正操作の因果関係を区別し、取引ログ・改変検知・権限分離を確認。","exclude":"再調査による364人の追加であり、新たな侵入・漏えい発生ではない。漏えい情報だけで口座ログイン・取引はできないと説明。不正注文は漏えい個人情報を利用したものではない。","note":"10/16初報・10/20第2報の未掲載分を補完。同一組織内でも情報漏えいと不正注文の原因を分けて読む。","batch":"新規","changeType":"新規追加","change":"未掲載の公表を追加。4,975人（従来4,611人＋再調査364人）。新たな侵入・漏えいではない。","evidence":"公表本文を2026-10-21（JST）の調査で確認。発生・公表・情報更新・一覧反映の日付を区別。","sources":[{"label":"公式発表・続報","url":"https://www.iwaicosmo.co.jp/info/2026/10201710.html"}],"secondary":{"status":"不正注文確認（漏えい情報の利用ではない）","date":"2026-10-20","checked":"2026-10-21","text":"10/14の売買管理システムへの攻撃で7口座に不正注文、うち5口座で約定。取引前の状態へ戻す措置を完了し、顧客負担なしと公式が説明。情報漏えいを原因とする二次被害とは結び付けない。"},"group":"トレードワークス関連","history":[{"date":"2026-10-21","text":"未掲載の公表を追加。4,975人（従来4,611人＋再調査364人）。新たな侵入・漏えいではない。"}]},{"id":"inc-767804e269","org":"埼玉県／ぷらっとさいたま","date":"2026-10-20","sourceUpdated":"2026-10-20","checked":"2026-10-21","updated":"2026-10-21","industry":"行政・公共","cat":["委託先被害","情報漏えい"],"status":"漏えいの可能性","info":"法人名、担当者名、氏名、メールアドレス、業種等。","scope":"669者（法人・個人を含む）。ユミルリンクの延べ約900万件と合算しない。","impact":"運用委託先ナレッジクライマーからメールマガジン提供元ユミルリンクの不正アクセスについて報告。","action": 新・一覧反映を区別。","sources":[{"label":"公式公表・続報","url":"https://otspremium.com/news/3008"}],"secondary":{"status":"未公表・不明","date":"2026-10-21","checked":"2026-10-22","text":"当該公表では二次被害の個別確認状況は未公表。不審連絡への注意を実被害確認と読み替えない。"},"industry":"旅行・宿泊","cat":["情報漏えいの可能性","サービス停止"],"info":"漏えいした可能性のある情報項目・件数・人数は詳細調査中。","scope":"新規予約を停止：OTSレンタカー、OTS HOTEL、OTS ACTIVITIES、デジタルDMOプラットフォーム、OTS Club。","impact":"社外からの照会を受けた初期調査で漏えい可能性を把握。10/18に対象サイトの外部アクセスを遮断し、10/20 16:30から対象5サービスの新規予約受付を停止。","exclude":"10/20 16:30までの申込完了分は申込内容どおり利用可能と説明。記載した以外のサービスは継続。流出確認・全予約取消・全業務停止と扱わない。","action":"既予約は公式のサービス別窓口へ照会。新規受付停止と既存予約の継続を分け、予約台帳・連絡手段・本人確認と変更受付の代替を準備する。","history":[{"date":"2026-10-22","text":"未掲載の公表を追加。新規予約を停止：OTSレンタカー、OTS HOTEL、OTS ACTIVITIES、デジタルDMOプラットフォーム、OTS Club。"}]},{"id":"inc-0c4290fec3","org":"フューチャーショップ／futureshop運用サーバー","date":"2026-10-21","sourceUpdated":"2026-10-22 23:35 JST","updated":"2026-10-24","checked":"2026-10-24","status":"サービス再開・調査継続","batch":"続報","changeType":"関連付け補完","change":"10/23公表の10/17侵入・1店舗の会員情報漏えいを別項目へ関連付け。","note":"10/22朝の停止情報より23:35の再開告知を優先。外部専門機関の調査は予定であり完了ではない。","evidence":"10/22（JST）の調査で公表本文を確認。発生・初回公表・情報更新・一覧反映を区別。","sources":[{"label":"今回確認した公式続報","url":"https://www.future-shop.jp/news/2026/10/22-3.html"},{"label":"公式公表・続報","url":"https://www.future-shop.jp/news/2026/10/21.html"}],"secondary":{"status":"未公表・不明","date":"2026-10-21","checked":"2026-10-22","text":"当該公表では二次被害の個別確認状況は未公表。不審連絡への注意を実被害確認と読み替えない。"},"industry":"IT・通信","cat":["不正アクセス","サービス停止"],"group":"futureshop","info":"この4サーバーへの侵入に関する22日23:35の公表では購入者情報流出は未確認。10/23の別公表は17〜18日の1店舗漏えいを確認している。","scope":"10/21に検知したc02・c05・c12・g06の4サーバー。10/17侵入の1店舗漏えいは別公表項目を参照。","impact":"10/22 23:35にPHP対応の緊急メンテナンスを終了。侵入を受けたc02・c05・c12・g06も侵入経路対策・サーバー再構築と安全確認後に同時再開。全店舗でECサイト・管理画面・APIを利用可能。","exclude":"FTP・メールの再開や、各利用企業の独自業務再開までこの発表だけで断定しない。購入者情報の流出未確認は調査完了・完全否定を意味しない。既掲載のIDCF関連事案とは区別。 17〜18日の1店舗事案と同一攻撃・対象とは確定しない。","action":"店舗ごとに表示・注文・決済・在庫・APIの正常性と停止中の滞留・重複処理を確認し、公式の調査続報を確認。利用企業自身の再開案内は別途照合。","history":[{"date":"2026-10-22","text":"未掲載の公表を追加。c02、c05、c12、g06の4サーバー。c02はトライアル環境。"},{"date":"2026-10-23","text":"更新前：{\"sourceUpdated\": \"2026-10-21\", \"status\": \"不正アクセス確認\", \"info\": \"個人情報への影響は調査中。項目・件数・漏えい確定は当該第1報では未公表。\", \"scope\": \"c02、c05、c12、g06の4サーバー。c02はトライアル環境。\", \"impact\": \"10/21 10:14頃に一部運用サーバーへの不正アクセスを確認。11:30から対象をメンテナンス状態とし、ECサイト・管理画面・FTP・APIが利用不可。対象店舗へ個別連絡。\", \"exclude\": \"上記以外のサーバー利用店舗では当該公表時点で影響未確認。既掲載のfuture Scenario Cast／futureCartRecoveryのIDCF関連事案とは別対象であり、共通原因を推定しない。\", \"action\": \"対象サーバーと提供元の個別通知を照合。他サービスでも使う管理画面PWはそちらも変更。不審連絡に注意し、店舗・注文・在庫・API処理の停止範囲と代替受付を確認する。\", \"note\": \"\"}"},{"date":"2026-10-23","text":"22日23:35にEC・管理画面・API再開。4サーバー再構築。購入者PII流出未確認、外部調査予定。FTP・メールやTAMRON自身の再開を推認しない。"},{"date":"2026-10-24","text":"更新前：{\"status\": \"サービス再開・調査継続\", \"info\": \"現時点の調査で購入者の個人情報流出は未確認。外部専門機関の調査は今後予定。\", \"scope\": \"c02、c05、c12、g06の4サーバー。c02はトライアル環境。\", \"impact\": \"10/22 23:35にPHP対応の緊急メンテナンスを終了。侵入を受けたc02・c05・c12・g06も侵入経路対策・サーバー再構築と安全確認後に同時再開。全店舗でECサイト・管理画面・APIを利用可能。\", \"exclude\": \"FTP・メールの再開や、各利用企業の独自業務再開までこの発表だけで断定しない。購入者情報の流出未確認は調査完了・完全否定を意味しない。既掲載のIDCF関連事案とは区別。\", \"action\": \"店舗ごとに表示・注文・決済・在庫・APIの正常性と停止中の滞留・重複処理を確認し、公式の調査続報を確認。利用企業自身の再開案内は別途照合。\", \"sourceUpdated\": \"2026-10-22 23:35 JST\", \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-21\", \"checked\": \"2026-10-22\", \"text\": \"当該公表では二次被害の個別確認状況は未公表。不審連絡への注意を実被害確認と読み替えない。\"}}"},{"date":"2026-10-24","text":"10/23公表の10/17侵入・1店舗の会員情報漏えいを別項目へ関連付け。"}],"relatedIncidents":["inc-a47c201807","inc-134ba7cc39"]},{"id":"inc-a47c201807","org":"タムロン／TAMRON ONLINE STORE・TAMRON ID","date":"2026-10-21","sourceUpdated":"2026-10-21","updated":"2026-10-22","checked":"2026-10-22","status":"委託先被害に伴う停止","batch":"新規","changeType":"新規追加","change":"未掲載の公表を追加。オンラインストアの商品閲覧・注文・発送・問い合わせ、TAMRON IDの会員登録・ログイン・マイページ・キャンペーン応募等。","note":"","evidence":"10/22（JST）の調査で公表本文を確認。発生・初回公表・情報更新・一覧反映を区別。","sources":[{"label":"公式公表・続報","url":"https://www.tamron.com/jp/consumer/news/detail/20261021.html"}],"secondary":{"sta "text":"更新前：{\"status\": \"漏えい確認\", \"info\": \"個人情報を含むデータの外部持出しを確認と親会社第2報が説明。項目・件数・全体人数は精査中。\", \"scope\": \"ブラストメール。個別利用組織の対象情報は各社の公表を別途確認する。\", \"impact\": \"10/21 0:30から不審アクセス検知に伴い停止。親会社の同日第2報は不正アクセスと外部持出しの確認を公表。個別顧客へ連絡すると説明。\", \"exclude\": \"ブラストメール事案と、親会社の別サービスに対する予防メンテナンスを混同しない。全利用組織の全情報流出や他製品の侵害を推定しない。全体件数は未確定。\", \"action\": \"自組織の配信先台帳・保存項目・個別通知を確認し、メール配信停止時の公式Web・電話等の代替を用意。お詫びを装う不審メールから情報を入力しないよう案内する。\", \"sourceUpdated\": \"2026-10-21\", \"secondary\": {\"status\": \"未公表・不明\", \"date\": \"2026-10-21\", \"checked\": \"2026-10-22\", \"text\": \"当該公表では二次被害の個別確認状況は未公表。不審連絡への注意を実被害確認と読み替えない。\"}}"},{"date":"2026-10-24","text":"公式17:00本文直接取得。全契約者情報持出し（会社担当者連絡先請求先契約支払履歴）、一部配信先情報。288は契約件数で人数・全体情報件数でない。APIサーバー2台侵入→販売管理・DB接続、初期侵入経路調査中。内部調査24日10時予定、外部調査並行、停止継続再開未定。予定のまま確認日時明示。"},{"date":"2026-10-25","text":"更新前：{\"info\": \"全契約者の会社名・担当者名・電話・メール・請求先メール・契約支払履歴等を持出し。一部契約の配信先リスト等も漏えい。カード番号非保持。\", \"scope\": \"配信先等の漏えい確認は288契約、全288契約へ通知済み。被害人数や情報の全件数ではなく調査継続。\", \"status\": \"漏えい確認\", \"impact\": \"APIサーバー2台へ侵入・コマンド実行後、販売管理システムとサービスDBへ接続し持出し。初期侵入経路は調査中。21日00:30から管理画面・API、1時頃から配信停止継続。再開未定。\", \"exclude\": \"内部調査24日10時頃完了は23日17時時点の予定で、実施済みとはしない。外部調査も並行。全契約の配信先流出や他ラクス製品の侵害に拡張しない。\", \"action\": \"自組織の配信先台帳・保存項目・個別通知を確認し、メール配信停止時の公式Web・電話等の代替を用意。お詫びを装う不審メールから情報を入力しないよう案内する。\", \"sourceUpdated\": \"2026-10-23 17:00 JST\"}"},{"date":"2026-10-25","text":"漏えい確認は288契約から344契約へ増加。追加56契約を含む全344契約へ個別連絡完了。再開未定。"},{"date":"2026-10-26","text":"ピッコマと一関市の公式公表を関連付け。利用組織の流出件数・停止影響・対象外を提供元の件数と分けて保持。"},{"date":"2026-10-28","text":"更新前：{\"scope\": \"契約者情報以外の情報漏えいを確認した344契約。全344契約への個別連絡完了。人数や漏えい情報の全件数ではなく、外部調査の進捗で変動する可能性。\", \"exclude\": \"全契約者の契約情報と、一部契約の配信先情報を区別。専門機関の外部調査は継続。次回10/25 10時頃の報告は24日13:20時点の予定で、実施済みとしない。内部調査の完了状況も未確認。\", \"sourceUpdated\": \"2026-10-24 13:20 JST\"}"},{"date":"2026-10-28","text":"配信先等の漏えい確認は344→345契約。全対象へ連絡済み、外部調査・停止継続。ミナオシの40,026件を利用組織の公表として追加。"}],"relatedIncidents":["inc-df76f8b8ea","inc-b0b446164c","inc-b51943e910","inc-0ae9696597","inc-4c60438ff7","inc-569f98da atest・main-stableの対象イメージ。取得日時とdigestを照合する。"},{"date":"2026-10-23","text":"更新前：{\"sourceUpdated\": \"2026-10-22 01:00 JST（10/21 16:00 UTC）\", \"status\": \"配布物改ざん確認\", \"info\": \"該当環境が保持・参照できるクラウド資格情報、AIプロバイダー鍵、DB認証、環境変数等を窃取するマルウェア。実際の利用者全体の漏えい件数は未公表。\", \"scope\": \"PyPIのlitellm 1.107.0の全7wheelと、公式コンテナv1.107.0・latest・main-latest・main-stableの対象イメージ。取得日時とdigestを照合する。\", \"impact\": \"開発者3人のGitHub認証情報が不正利用され、リリースパイプラインを改変。資格情報窃取・遠隔コード実行ツールを含む配布物を公開したと提供元が説明。PyPI対象期間は10/21 11:39〜13:23 UTC（JST20:39〜22:23）、Docker Hubは11:46〜14:20 UTC（JST20:46〜23:20）。\", \"exclude\": \"提供元の私有enterpriseレジストリは対象外。GitHubの正規ソースタグに悪性ファイルは含まれず、配布済みwheel・コンテナを照合する。タグの現在の正常性だけで過去取得物を安全と判定しない。GHCRはDocker Hubと撤去時点が異なるため公式表を確認。\", \"action\": \"対象配布物を実行した環境は侵害済みとして扱い、隔離と証拠保全、正常な環境からの再構築、到達可能だった鍵・トークン・DB認証情報の失効を行う。単純なpip更新から始めるとPython起動で再実行され得るため、担当者が公式の個別対処手順を参照する。\", \"note\": \"提供元の10/21 16:00 UTC更新（JST10/22 01:00）を確認した調査分。封じ込めと調査継続を区別。認証情報窃取の初期手段は調査中で、他の国内事案との同一主体・共通原因を推定しない。\"}"},{"date":"2026-10-23","text":"21日20:30UTC更新の仮説攻撃経路。AI応答やログに含まれたGitHub CLIトークン等。仮説と確定を分離。"}],"relatedVulnerabilities":["v-litellm-202610"]},{"id":"inc-7943fed5af","date":"2026-10-22","sourceUpdated":"2026-10-23","updated":"2026-10-24","checked":"2026-10-24","batch":"続報","changeType":"続報・補完","change":"第2報。PW不正変更196件のうち国内19件がイーカプコンマイページ侵入・氏名住所購入履歴問合せ履歴アドレス帳等漏えい。196・19は既存11774247の内数、単純加算不可。カード除外。影響範囲調査完了、監視継続。","note":"第2報。PW不正変更196件のうち国内19件がイーカプコンマイページ侵入・氏名住所購入履歴問合せ履歴アドレス帳等漏えい。196・19は既存11774247の内数、単純加算不可。カード除外。影響範囲調査完了、監視継続。","sources":[{"label":"今回確認した公式続報","url":"https://www.capcom.co.jp/ir/news/html/261023.html"},{"label":"公式発表・続報","url":"https://www.capcom.co.jp/ir/news/html/261022.html"}],"secondary":{"status":"関連通販への不正アクセス・漏えい確認","date":"2026-10-23","checked":"2026-10-24","text":"196件のうち国内19件でイーカプコンへの不正アクセスと追加情報漏えい。金銭被害の確認とは区別。"},"history":[{"date":"2026-10-23","text":"CAPCOM ID 11774247件のメール等、うち43件追加属性、196件PW不正変更。PW漏えい未確認。"},{"date":"2026-10-24","text":"更新前：{\"status\": \"情報流出・PW不正変更確認\", \"info\": \"メールアドレス、アカウント作成日時・最終ログイン日時・ログイン回数・最終クライアントIP等のシステム識別情報。うち43件では生年月日、性別、国・地域、ニックネームも対象。\", \"scope\": \"全世界11,774,247件。追加属性43件、パスワード不正変更196件はいずれも上記対象の内数。\", \"impact\": \"10/19に不正アクセスを検知・遮断し、同日侵入を確認。196件のパスワード不正変更を確認し、対象アカウントのPWをリセット。緊急対策は完了し、CAPCOM IDとゲームの利用は継続。\", \"exclude\": \"利用者が設定したパスワードの漏えいは未確認。クレジットカード情報は対象外。11,774,247件すべての乗っ取りやPW流出と扱わない。原因CVE・攻撃主体は未確定。\", \"action\": \"対象者通知と公式アカウント状況を確認し、身に覚えのない変更やログインを点検。不審メールから認証情報を入力しない。自組織では変更通知・セッション管理・アカウント回復を点検。\", \"sourceUpdated\": \"2026-10-22\", \"secondary\": {\"status\": \"PW不正変更確認\", \"date\": \"2026-10-22\", \"checked\": \"2026-10-23\", \"text\": \"196件でPWの不正変更を確認。金銭被害等の確認とは区別。\"}}"},{"date":"2026-10-24","text":"第2報。PW不正変更196件のうち国内19件がイーカプコンマイページ侵入・氏名住所購入履歴問合せ履歴アドレス帳等漏えい。196・19は既存11774247の内数、単純加算不可。カード除外。影響範囲調査完了、監視継続。"}],"org":"カプコン／CAPCOM ID","industry":"ゲーム・娯楽","cat":["不正アクセス","情報漏えい","アカウント乗っ取り"],"status":"情報流出・PW不正変更確認","info":"メールアドレス、アカウント作成日時・最終ログイン日時・ログイン回数・最終クライアントIP等のシステム識別情報。うち43件では生年月日、性別、国・地域、ニックネームも対象。 PW不正変更196件のうち国内19件で、イーカプコンの氏名・住所・電話・購入履歴・問い合わせ履歴・会員アドレス帳等も漏えい。","scope":"全世界11,774,247件。追加属性43件、パスワード不正変更196件はいずれも上記対象の内数。","impact":"10/23第2報：PWを不正変更された196件のうち19件で関連通販のマイページ不正アクセスと追加情報漏えいを確認。影響範囲調査は完了し、監視継続。","exclude":"追加19件はPW不正変更196件の内数。既存11,774,247件へ別被害人数として合算しない。カード情報は対象外。利用者設定PWの漏えいと不正変更を区別。","action":"対象者通知と公式アカウント状況を確認し、身に覚えのない変更やログインを点検。不審メールから認証情報を入力しない。自組織では変更通知・セッション管理・アカウント回復を点検。"},{"id":"inc-1c12b197a9","date":"2026-10-22","sourceUpdated":"2026-10-22","updated":"2026-10-23","checked":"2026-10-23","batch":"新規","changeType":"新規追加","change":"公式がPHP原因説を誤報と訂正。独自サービス脆弱性。不正アクセス、複数MOTサービス停止、最短26日昼再開見込みは確約でない。","note":"公表日・続報日と今回の確認日を区別。共通提供元の関連公表は独立した攻撃件数に合算しない。","sources":[{"label":"公式発表・続報","url":"https://www.webjapan.co.jp/maintenance/serviceteishi261022/"}],"secondary":{"status":"未公表・不明","date":"2026-10-22","checked":"2026-10-23","text":"確認した公式発表では二次被害の個別確認は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-23","text":"公式がPHP原因説を誤報と訂正。独自サービス脆弱性。不正アクセス、複数MOTサービス停止、最短26日昼再開見込みは確約でない。"}],"org":"バルテック／MOT関連サービス","industry":"IT・通信","cat":["不正アクセス","情報漏えいの可能性","サービス停止"],"status":"不正アクセス確認・流出範囲調査中","info":"顧客情報の流出とみなされる事実を確認と公表。情報項目・対象件数・範囲は調査中。","scope":"MOT/HG Cloud、MOT/Rec、MOT勤怠・経費・文書・SFA、予約・ホテル・飲食関連、POS、施設・レンタルオフィス、ダウンロードセンター、WEB請求書等の複数サービス。詳細は公式対象一覧を確認。","impact":"第三者の不正アクセスを受け対象サービスを停止。再開は最短10/26昼の見込みで、遅れる可能性あり。公式は初報の「PHP脆弱性が原因」を誤報と訂正し、自社独自サービスの脆弱性が原因で、別のPHP対応と混同したと説明。","exclude":"今回の事案をPHPのCVEに関連付けない。再開見込みは確約・完了ではない。サービス停止一覧を漏えい項目や被害人数に読み替えない。","action":"利用中サービス・業務と停止一覧を照合し、受付・勤怠・請求等の代替運用と滞留処理を準備。再開日時と個別通知は公式窓口で確認する。"},{"id":"inc-be24bf0eaf","date":"2026-10-22","sourceUpdated":"2026-10-22","updated":"2026-10-23","checked":"2026-10-23","batch":"新規","changeType":"新規追加","change":"フォーム最大13323件とアカウント35件、重複未確認。既存GSS事案とは別。","note":"公表日・続報日と今回の確認日を区別。共通提供元の関連公表は独立した攻撃件数に合算しない。","sources":[{"label":"公式発表・続報","url":"https://www.digital.go.jp/press/a0a8f66c-b32d-4695-9372-bcd5d4280f22"}],"secondary":{"status":"未公表・不明","date":"2026-10-22","checked":"2026-10-23","text":"確認した公式発表では二次被害の個別確認は未公表。未記載を被害なしと扱わない。"},"history":[{"date":"2026-10-23","text":"フォーム最大13323件とアカウント35件、重複未確認。既存GSS事案とは別。"}],"org":"デジタル庁／Studioの過去フォーム","industry":"行政・公共","cat":["委託先被害","情報漏えいの可能性"],"group":"Studio","status":"漏えいの可能性","info":"一般意見、採用問い合わせ、ワクチン接種証明書アプリ問い合わせ、着ぐるみ貸出、ワークショップ参加の各フォーム。氏名・メール・電話・所属・配送先・問い合わせ内容等はフォームごとに異なる。Studioアカウントでは職員・委託先の氏名とメール。","scope":"各フォームの最大件数8,833／250／3,661／117／462件（合計最大13,323件）と、アカウント35件。重複を除いた人数ではない。2021年5月〜2023年3月の過去フォームを含む。","impact":"10/16にStudioから報告を受領。Studioに保存していた過去の入力情報等が漏えいした可能性。","exclude":"ワクチン接種記録やマイナンバー自体の漏えいを示すものではない。既掲載のGSS関連事案と別件。","action":"対象者通知を確認し不審連絡へ注意。自組織では終了したフォームの残存データ、運用アカウント、保存期間と削除実績を確認。","relatedIncidents":["inc-0aa91af2ec","inc-d5c1bf400c","inc-5da670570e","inc-95e23adf9e","inc-0ec95afa41","inc-952cc2be65","inc-0a47f4ad2e","inc-b3ae40831b","inc-7f5133aa9b","inc-42af6ba48e","inc-e164a3b2b5","inc-65964fc823","inc-82adf559a7","inc-98880ff9d6","inc-7722fce380","inc-c854479702","inc-1e155f1873","inc-aea978d3b4","inc-c329fa3727","inc-298919441e","inc ck-public","exploitation":"当該公表で実悪用の確認記載なし","exploitationTone":"amber","sources":[{"label":"提供元・公式アドバイザリ","url":"https://www.knot-dns.cz/2026-10-21-version-362.html"}],"sourceNote":"発生日・提供元公表日・国内機関掲載日と今回確認日を区別。","history":[{"date":"2026-10-25","type":"新規掲載","note":"Knot DNS：DoS等に関する複数のセキュリティ修正"}],"referenceLabel":"3.6.2 セキュリティ修正（CVEは当該リリースに記載なし）"},{"id":"v-php-uploadprogress-202610","product":"PHP｜追加公表","title":"PHPの追加脆弱性：特定のセッション設定を確認","identifiers":["CVE-2026-115560"],"published":"2026-10-23","sourceUpdated":"2026-10-23","priority":"特定条件の有無とアップロード進捗設定を確認","conditions":"session.serialize_handlerがphp_binary又はphp_serializeの設定から、実行時ini_set()でphpへ変更され、session_start()を呼ぶなどの特殊な構成で、session upload progressも有効な場合。実行時にハンドラーを変更しないアプリはこの経路の対象外とPHPが説明。","impact":"限られた設定・アプリ処理の組み合わせで任意コード実行につながる別問題。先日の修正版8.5.12等でも、この別問題が修正済みとは判断できない。","fix":"PHPは次の通常バグ修正リリースまでsession.upload_progress.enabled=0を推奨。リクエスト解析前に有効なphp.ini・FPMプール等で適用し、ワーカーを再起動。修正版番号・日程は未確定。","investigation":"設定とアプリ内のハンドラー変更を確認。既存109618／109619の更新は継続して必要であり、今回の設定変更だけで先の2件の対策を完了としない。","bcp":"アップロード進捗表示等への影響を試験。ホスト管理と自主管理の責任範囲を分け、既存2件の対応完了告知を新CVEへ流用しない。","tech":"public","check":"ck-public","change":"23日情報提供。php_binary/php_serialize設定を実行時phpへ変更してsession_startするなど特定条件＋upload_progress有効。既存修正版にも残る別問題。session.upload_progress.enabled=0を起動前に適用しワーカー再起動、次の通常リリース予定。21日2件の修正版適用不要としない。","sources":[{"label":"PHP｜10/23追加公表","url":"https://www.php.net/"},{"label":"CERT-EU｜更新情報","url":"https://cert.europa.eu/publications/security-advisories/2026-018"}],"relatedVulnerabilities":["v-php-202610"],"checked":"2026-10-24","updated":"2026-10-24","changeType":"新規追加","exploitation":"当該公表で実悪用の確認記載なし","exploitationTone":"amber","sourceNote":"公表日・JVN掲載日と今回確認日を区別。実悪用の記載がないことは未侵害や安全の保証ではない。","history":[{"date":"2026-10-24","type":"新規掲載","note":"23日情報提供。php_binary/php_serialize設定を実行時phpへ変更してsession_startするなど特定条件＋upload_progress有効。既存修正版にも残る別問題。session.upload_progress.enabled=0を起動前に適用しワーカー再起動、次の通常リリース予定。21日2件の修正版適用不要としない。"}]},{"id":"v-pleasanter-ldap-202610","product":"プリザンター","title":"LDAP認証の特定構成でパスワード検証を回避","identifiers":["CVE-2026-113438"],"published":"2026-10-23","sourceUpdated":"2026-10-23","priority":"認証設定・OS・LDAP接続先と実稼働版を照合","conditions":"1.1.0.0〜1.5.9.0。LDAP認証を利用し、Linux/Docker又はWindowsでDsProvider=Novell、かつ接続先がAD又は匿名バインド許可のLDAPである構成。","impact":"有効なIDを知る第三者が正しいPWなしに当該ユーザーとしてログインし、権限内の情報を閲覧・改ざん・削除できる可能性。AD自体の脆弱性ではない。","fix":"1.5.9.1以降へ更新。1.5.9.0には修正なし。困難な場合は提供元へ回避策を照会。Pleasanter.netと提供元プライベートクラウドはLDAP未設定のため対象外と説明。","investigation":"ログイン・権限操作・データ変更と外部公開範囲を調査。画面上で通常操作が正常でも、不正リクエスト耐性を保証しない。","bcp":"LDAP認証、登録・検索・権限設定を更新後に確認し、代替手続き・切戻しを準備。","tech":"identity","check":"ck-identity","change":"1.1.0.0〜1.5.9.0、修正1.5.9.1。LDAP有効＋Linux/Docker又はWindows Novell＋AD/匿名bind許可LDAP。全AD自体の脆弱性でない。ログインIDだけで認証回避可能。Pleasanter.net/提供元privatecloud LDAP未設定で対象外。","sources":[{"label":"開発元｜影響条件と対策","url":"https://pleasanter.org/news/vulnerability-update-20261023/"},{"label":"JVN｜CVE-2026-113438","url":"https://jvn.jp/jp/JVN82312317/index.html"}],"checked":"2026-10-24","updated":"2026-10-24","changeType":"新規追加","exploitation":"当該公表で実悪用の確認記載なし","exploitationTone":"amber","sourceNote":"公表日・JVN掲載日と今回確認日を区別。実悪用の記載がないことは未侵害や安全の保証ではない。","history":[{"date":"2026-10-24","type":"新規掲載","note":"1.1.0.0〜1.5.9.0、修正1.5.9.1。LDAP有効＋Linux/Docker又はWindows Novell＋AD/匿名bind許可LDAP。全AD自体の脆弱性でない。ログインIDだけで認証回避可能。Pleasanter.net/提供元privatecloud LDAP未設定で対象外。"}]},{"id":"v-mitsubishi-scada-202610","product":"三菱電機｜監視・制御","title":"GENESIS・ICONICS等：認証・権限・ファイル処理の複数問題","identifiers":["CVE-2023-4863","CVE-2026-16436","CVE-2026-16437","CVE-2026-16438"],"published":"2026-10-15","sourceUpdated":"2026-10-23（JVN掲載）","priority":"設備管理・監視制御端末の製品版とアクセス経路を照合","conditions":"GENESIS11.03以前、GENESIS64／ICONICS Suite等10.97.3以前、MC Works64・GENESIS32・BizViz全版等。CVEごとに製品と成立条件が異なる。","impact":"細工ファイルのインポート、固定のロック解除応答、管理ファイル改変、過剰DCOM権限の問題。管理権限・ローカル操作等の条件を区別し、全CVEが認証不要の遠隔攻撃とはしない。","fix":"ICONICS Suite／IoTWorX10.98、GENESIS11.04等、製品・CVE別の修正版へ。libwebp問題は10.97.3以降。MC Works64・GENESIS32・BizVizは修正版予定なしのため公式軽減策又は置換を検討。","investigation":"管理者ログイン、ロック解除、DCOM・ファイル変更と到達経路を点検。古い共通ライブラリのCVEを製品影響として今回確認したもので、全件新規CVEではない。","bcp":"設備・監視業務の影響と保守窓口を確認し、ネットワーク分離・遠隔接続制限、更新・置換と手動監視の代替を準備。","tech":"public","check":"ck-public","change":"ベンダー初報10/15、JVN10/23。GENESIS等4脆弱性、認証回避・DCOM・ファイルimport等成立条件別。ICONICS Suite/IoTWorX10.98、GENESIS11.04等。MCWorks64/GENESIS32/BizViz修正版予定なし、軽減と置換。","sources":[{"label":"三菱電機｜製品別対策","url":"https://www.mitsubishielectric.co.jp/psirt/vulnerability/pdf/2026-006.pdf"},{"label":"JVN｜10/23掲載","url":"https://jvn.jp/vu/JVNVU93251594/index.html"}],"checked":"2026-10-24","updated":"2026-10-24","changeType":"新規追加","exploitation":"当該公表で実悪用の確認記載なし","exploitationTone":"amber","sourceNote":"公表日・JVN掲載日と今回確認日を区別。実悪用の記載がないことは未侵害や安全の保証ではない。","history":[{"date":"2026-10-24","type":"新規掲載","note":"ベンダー初報10/15、JVN10/23。GENESIS等4脆弱性、認証回避・DCOM・ファイルimport等成立条件別。ICONICS Suite/IoTWorX10.98、GENESIS11.04等。MCWorks64/GENESIS32/BizViz修正版予定なし、軽減と置換。"}]},{"id":"v-bind-202610","product":"ISC BIND","title":"BIND 9：DNS停止等につながる4件の脆弱性","identifiers":["CVE-2026-19630","CVE-2026-94300","CVE-2026-96888","CVE-2026-97313"],"published":"2026-10-21","sourceUpdated":"2026-10-22","priority":"DNSの冗長化と、版・設定・修正適用を確認","conditions":"対象版と各機能の設定条件を個別照合。GSS-TSIG、redirect zoneとstrict QNAME minimisation、RPZ等の利用により成立条件は異なる。","impact":"CPU・メモリ枯渇、メモリ破損、named終了など。DNS停止は認証・メール・外部サービス利用の障害に波及し得るため業務依存も確認。","fix":"BIND 9.20.30／9.21.27、又は各ディストリビューションの対応パッケージへ更新。9.18等の終了済み系列を安全とせず、対応系列へ移行。","investigation":"DNSログ、異常終了・再起動、資源使用量と問い合わせ傾向を確認。設定条件・修正と侵害有無の評価を分ける。","bcp":"独立した代替DNS、設定保存、更新時の切替・切戻しと名前解決・認証・メールの動作確認を準備。","tech":"public","check":"ck-public","change":"ISC BINDの4件を追加。版と設定ごとの条件、修正版、DNS停止時の業務継続を確認。","sources":[{"label":"JVN｜BINDの複数脆弱性","url":"https://jvn.jp/vu/JVNVU91196958/index.html"},{"label":"ISC｜CVE-2026-19630","url":"https://kb.isc.org/docs/cve-2026-19630"},{"label":"ISC｜CVE-2026-94300","url":"https://kb.isc.org/docs/cve-2026-94300"},{"label":"ISC｜CVE-2026-96888","url":"https://kb.isc.org/docs/cve-2026-96888"},{"label":"ISC｜CVE-2026-97313","url":"https://kb.isc.org/docs/cve-2026-97313"}],"checked":"2026-10-23","updated":"2026-10-23","changeType":"新規追加","exploitation":"確認した公表で実悪用は未確認","exploitationTone":"amber","sourceNote":"10/23（JST）に確認した公式情報。実悪用未確認は、将来の悪用や自組織の安全を保証する意味ではない。","history":[{"date":"2026-10-23","type":"新規掲載","note":"ISC BINDの4件を追加。版と設定ごとの条件、修正版、DNS停止時の業務継続を確認。"}]},{"id":"v-liff-202610","product":"LIFF SDK","title":"LIFF SDK：LINE連携WebアプリのDOMベースXSS","identifiers":["CVE-2026-112148"],"published":"2026-10-22","sourceUpdated":"2026-10-22","priority":"LINE連携WebアプリのSDK組込版・CDN指定を確認","conditions":"LIFF SDK 2.20.0〜2.31.0を使うWebアプリ。LINEアプリ利用者すべてを侵害済みとするものではない。","impact":"影響を受けるサイトを利用したブラウザーで、不正なスクリプトが実行される可能性。","fix":"LIFF SDK 2.31.1へ更新。バンドル版・CDN・ビルド成果物・キャッシュを確認し、実際の配信版を照合。","investigation":"対象ページ・リンク・クエリーと変更履歴、ブラウザー側の不審処理を調査。採用SDKの有無と版を最初に確認。","bcp":"更新後のLINEログイン、画面遷移、フォーム・APIを確認し、利用できない場合の通常Web・窓口を案内。","tech":"public","check":"ck-public","change":"LIFF SDKのDOMベースXSSと修正版2.31.1を追加。","sources":[{"label":"JVN｜LIFF SDK","url":"https://jvn.jp/vu/JVNVU91023667/index.html"}],"checked":"2026-10-23","updated":"2026-10-23","changeType":"新規追加","exploitation":"確認した公表で実悪用は未確認","exploitationTone":"amber","sourceNote":"10/23（JST）に確認した公式情報。実悪用未確認は、将来の悪用や自組織の安全を保証する意味ではない。","history":[{"date":"2026-10-23","type":"新規掲載","note":"LIFF SDKのDOMベースXSSと修正版2.31.1を追加。"}]},{"id":"v-snort3-202610","product":"Cisco Snort 3","title":"Snort 3：Cisco製品・オープンソース版の修正を確認","identifiers":["CVE-2026-20043","CVE-2026-20236","CVE-2026-20291","CVE-2026-20356"],"published":"2026-10-21","sourceUpdated":"2026-10-23 04:03 JST（10/22 19:03 GMT）","priority":"搭載製品ごとの修正版・自動更新状態を確認","conditions":"Snort 3を含むFTD、Cisco Secure Firewall、Cyber Vision、Meraki MX、UTD IOS XE、オープンソース版等。機器設定にかかわらず影響する対象製品があるため、公式の製品表で確認。","impact":"境界外書き込み、計算・権限・リソース処理等の複数問題。最大CVSS 9.0。製品別の影響を確認し、同じ条件で全製品の侵害が成立するとしない。","fix":"オープンソース版は3.12.4.0、Cyber Visionは5.6.0等の製品別修正版へ更新。FTDは使用系列の公式修正版を照合。クラウド製品やオンラインMeraki MXの自動配信も適用結果を確認。","investigation":"Snortの実稼働版・パッケージとクラッシュ等の記録を確認。オフライン機器で自動更新を前提にしない。回避策は提示されていない。","bcp":"ネットワーク境界製品の更新に備え、冗長切替、通信試験、切戻しと授業・業務の連絡経路を準備。","tech":"public","check":"ck-public","change":"Snort 3の4件と製品ごとの更新方法・自動配信を追加。","sources":[{"label":"Cisco｜Snort 3 Security Hardening","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-hardening-snort3-ybgmhTQe"}],"checked":"2026-10-23","updated":"2026-10-23","changeType":"新規追加","exploitation":"確認した公表で実悪用は未確認","exploitationTone":"amber","sourceNote":"10/23（JST）に確認した公式情報。実悪用未確認は、将来の悪用や自組織の安全を保証する意味ではない。","history":[{"date":"2026-10-23","type":"新規掲載","note":"Snort 3の4件と製品ごとの更新方法・自動配信を追加。"}]},{"id":"v-php-202610","product":"PHP","title":"PHPの重大な脆弱性2件：公開済み修正版と実稼働版を確認","identifiers":["CVE-2026-109618","CVE-2026-109619"],"published":"2026-10-21","sourceUpdated":"2026-10-28","exploitation":"CISAが2件をKEVへ追加。Palo Alto Networksはインターネット公開されたPAN-OS管理インターフェースへの実悪用を観測。一般PHP環境すべての侵害を意味しない。","exploitationTone":"red","priority":"外部からWeb要求を処理するPHP環境を優先確認","conditions":"PHP-FPM、Apache mod_php、php-cgi、FrankenPHP、LiteSpeedなど、PHPでWeb要求を処理する構成。アプリ名だけで判定せず、実際のPHP系列・版と配布元パッケージの修正状態を照合する。","impact":"109618はメモリ不足時の内部状態の破損、109619は解放後に残る内部状態に関する問題で、認証不要のコード実行につながり得る。メーカーはmod_phpでアプリ処理前に成立する実証があり最も高いリスクと評価。全構成で同一手順・被害が成立したという意味ではない。","fix":"公開済みのPHP 8.5.12／8.4.27／8.3.36／8.2.35以降の対応版へ更新。OS・LTS提供元が修正をバックポートする場合はパッケージのアドバイザリも確認し、再起動・プロセスの実稼働版を照合する。完全な解消は更新による。","investigation":"JPCERT/CCの10/22案内に沿い、通常と異なる長さ・形式のPHPSESSID、メモリ上限周辺の異常なmultipart要求・HTTP 500、ワーカー異常終了・再起動、プロセス・生成ファイル・外向き通信を確認する。単一の兆候がないだけで未侵害と判定しない。修正適用と適用前の侵入有無の調査を分ける。","bcp":"更新担当と契約範囲、同梱PHP・コンテナ・管理UIを棚卸し。互換性・再起動・切戻しと受付・告知の代替を準備し、Web表示・ログイン・フォーム・連携を確認する。PHP 8.1以前はPHPプロジェクトの通常更新対象外。7.4／8.0／8.1向け最小ソースバックポートは通常サポート再開を意味しない。5系を含む旧版を安全と判断せず、ベンダー修正又は対応系列への移行を確認する。","tech":"public","check":"ck-public","change":"JVNのFFRIステータスとヤマハ製品・サービス別の影響範囲を追加。","sources":[{"label":"PHP｜公式セキュリティリリース","url":"https://www.php.net/"},{"label":"PHP｜2026年の公表履歴","url":"https://www.php.net/archive/2026.php"},{"label":"IPA｜10/21の事前準備案内","url":"https://www.ipa.go.jp/security/security-alert/2026/pre-alert20261021.html"},{"label":"JPCERT/CC｜脆弱性と侵害痕跡調査","url":"https://www.jpcert.or.jp/at/2026/at260033.html"},{"label":"Cloudflare｜観測と防御状況","url":"https://blog.cloudflare.com/php-vulnerabilities-waf-protection/"},{"label":"CISA｜KEV追加（2026/10/26）","url":"https://www.cisa.gov/news-events/alerts/2026/10/26/cisa-adds-two-known-exploited-vulnerabilities-catalog"},{"label":"Palo Alto Networks｜PHP脆弱性の製品影響","url":"https://security.paloaltonetworks.com/CVE-2026-109618"}],"sourceNote":"CISAは10/26に2件を既知悪用脆弱性として追加。Palo Alto Networksは10/27更新で自社製品のインターネット公開管理面を標的とした実悪用を公表。適用前ログ保全・侵害調査と更新を分ける。","providerNote":"各社の告知対象CVEと公表時点を確認。以下の完了情報は既存2件についてで、新規CVE-2026-115560への対応完了を意味しない。バックポートでは版表示が変わらない場合あり。","providers":[{"id":"sakura-php-rental","provider":"さくらのレンタルサーバ・マネージドサーバ等","status":"緊急保守すべて終了","tone":"teal","sourceAsOf":"2026-10-23 17:30 JST","checked":"2026-10-24","finding":"既存PHP2件への対応に伴う緊急メンテナンスはすべて終了と追記。提供中旧版の修正と、通常サポートの終了は区別。","action":"提供サービスの適用範囲と実際のサイト動作を確認。サポート終了版への今回の修正は通常サポート再開ではなく、対応系列への移行も進める。VPS上の利用者管理PHPは別途対応。","sources":[{"label":"さくら｜PHP対応と復旧状況","url":"https://www.sakura.ad.jp/corporate/information/announcements/2026/10/22/1968226117/"}]},{"id":"sakura-php-dbui","provider":"さくらのクラウド｜データベース アプライアンス","status":"全保守終了の続報あり","tone":"amber","sourceAsOf":"2026-10-23 17:30 JST","checked":"2026-10-24","finding":"提供元全体の続報はPHP対応の緊急保守すべて終了と説明。以前の管理Web UI停止告知を現行の停止確定として扱わない。","action":"利用契約の管理UIの実稼働と個別告知を確認。DBクラスタ全体の停止と混同しない。","sources":[{"label":"さくら｜緊急保守終了","url":"https://www.sakura.ad.jp/corporate/information/announcements/2026/10/22/1968226117/"}]},{"id":"xserver-php","provider":"Xserver","status":"5.6〜8.5完了／5.1〜5.5は過半数","tone":"teal","sourceAsOf":"2026-10-23 17:00 JST","checked":"2026-10-24","finding":"5.6〜8.5の全対象修正完了、5.1〜5.5は過半数の対象サーバーで完了。管理機能は順次再開し一部制限・アクセス集中あり。","action":"契約サーバーの版と完了範囲を確認。VPSは利用者がOS・PHPを管理し、提供元のPHPパッチ適用対象外。","sources":[{"label":"Xserver｜PHP対応・復旧状況","url":"https://www.xserver.ne.j : \"2026-10-21\", \"checked\": \"2026-10-23\", \"finding\": \"PAN-OS 12.2／12.1／11.2／11.1／10.2とPanoramaが対象。提供時期未定。製品評価は主に可用性への影響。自社製品への悪用は未確認。\", \"action\": \"管理インターフェースをインターネットへ公開せず、管理端末・踏み台へ制限。上流PHPのRCE評価をそのまま全製品に適用しない。\", \"tone\": \"amber\", \"sources\": [{\"label\": \"製品・サービス提供元の公式案内\", \"url\": \"https://security.paloaltonetworks.com/CVE-2026-109618\"}]}, {\"id\": \"canon-php\", \"provider\": \"Canonet／HOME type-W\", \"status\": \"10/23 12時の停止・対策予定\", \"sourceAsOf\": \"2026-10-22の案内\", \"checked\": \"2026-10-23\", \"finding\": \"PHP利用環境は10/23 12時から停止予定、再開時期未定。W1／W2はW4への移行、W3／W4は修正検証後に切替案内。phpMyAdmin停止。\", \"action\": \"予定を実施・復旧済みと記載しない。バックアップ、互換性、必要な切替操作と代替受付を確認。\", \"tone\": \"amber\", \"sources\": [{\"label\": \"製品・サービス提供元の公式案内\", \"url\": \"https://hminfo.canon.jp/faq/show/467?site_domain=default\"}]}], \"sourceNote\": \"修正版は公開済み。10/23調査で10/22のJPCERT/CC調査指針とホスト・製品別対応を追加。提供元の独自修正とPHPプロジェクトの通常サポートを区別。個別製品の影響は各社評価を確認。\", \"fix\": \"公開済みのPHP 8.5.12／8.4.27／8.3.36／8.2.35以降の対応版へ更新。OS・LTS提供元が修正をバックポートする場合はパッケージのアドバイザリも確認し、再起動・プロセスの実稼働版を照合する。完全な解消は更新による。\", \"conditions\": \"PHP-FPM、Apache mod_php、php-cgi、FrankenPHP、LiteSpeedなど、PHPでWeb要求を処理する構成。アプリ名だけで判定せず、実際のPHP系列・版と配布元パッケージの修正状態を照合する。\"}"},{"date":"2026-10-24","type":"続報更新","note":"攻撃試行の観測、追加CVEとの区分、提供元の修正・再開状況を更新。"},{"date":"2026-10-25","type":"更新前の記録","note":"{\"impact\": \"109618はメモリ不足時の内部状態の破損、109619は解放後に残る内部状態に関する問題で、認証不要のコード実行につながり得る。メーカーはmod_phpでアプリ処理前に成立する実証があり最も高いリスクと評価。全構成で同一手順・被害が成立したという意味ではない。\", \"sourceUpdated\": \"2026-10-23\", \"providers\": [{\"id\": \"sakura-php-rental\", \"provider\": \"さくらのレンタルサーバ・マネージドサーバ等\", \"status\": \"緊急保守すべて終了\", \"tone\": \"teal\", \"sourceAsOf\": \"2026-10-23 17:30 JST\", \"checked\": \"2026-10-24\", \"finding\": \"既存PHP2件への対応に伴う緊急メンテナンスはすべて終了と追記。提供中旧版の修正と、通常サポートの終了は区別。\", \"action\": \"提供サービスの適用範囲と実際のサイト動作を確認。サポート終了版への今回の修正は通常サポート再開ではなく、対応系列への移行も進める。VPS上の利用者管理PHPは別途対応。\", \"sources\": [{\"label\": \"さくら｜PHP対応と復旧状況\", \"url\": \"https://www.sakura.ad.jp/corporate/infor
