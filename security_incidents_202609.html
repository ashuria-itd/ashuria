クラウド版対処済み。"}]},{"id":"v-fortinet-202610","product":"Fortinet製品群","title":"管理者権限からのファイル操作と集中管理基盤を経由する侵害","identifiers":["CVE-2025-61624"],"published":"2026-04-14","sourceUpdated":"2026-10-16","checked":"2026-10-18","updated":"2026-10-18","changeType":"新規追加","exploitation":"実攻撃・KEV掲載を確認","exploitationTone":"red","priority":"対象の製品・版・構成を利用する場合に優先確認","conditions":"FortiOS等のメーカー公表対象製品・版。認証済み管理者のCLI読書権限等が前提で、未認証の初期侵入脆弱性とは区別する。","impact":"パストラバーサルによる任意ファイル操作。Unit 42は、別のFortiManager脆弱性を起点に構成・鍵を取得した攻撃で、本CVEとメモリー上のPEERSTITCHが使われたと報告。","fix":"Fortinetの製品・系列別対象表で修正状況を確認。集中管理経路を制限し、管理基盤が侵害された場合は管理先の認証情報・証明書・鍵の更新範囲も判断する。","investigation":"設定・管理者・VPN認証・ログの欠落等と、調査元の痕跡情報を照合。500台超は設定等の流出対象であり、全ての管理先ネットワークの侵害確認ではない。","bcp":"管理基盤を停止しても機器を安全に管理できる代替手段と、鍵の再発行・再登録の順序を検討。","tech":"public","check":"ck-identity","sources":[{"label":"Fortinet｜公式対象版・修正情報","url":"https://fortiguard.fortinet.com/psirt/FG-IR-26-122"},{"label":"Unit 42｜実侵害の調査","url":"https://unit42.paloaltonetworks.com/fortimanager-cve-2024-47575-peerstitch-malware/"},{"label":"CISA｜悪用確認リスト（公式JSON・10/16版確認）","url":"https://raw.githubusercontent.com/cisagov/kev-data/main/known_exploited_vulnerabilities.json"}],"sourceNote":"メーカー・公的機関・調査実施元の本文を2026-10-18に確認。対策と悪用状況は情報更新日時点の整理。業務継続の観点は編集上の検討案。","change":"既存公表の管理者認証後のパストラバーサル。10/16 KEV追加。FortiManager侵害・設定/秘密情報窃取と連鎖した実攻撃をUnit42が報告。500台超は設定情報対象で全台侵害とはしない。メーカー対象版・修正を確認。","history":[{"date":"2026-10-18","type":"新規掲載","note":"既存公表の管理者認証後のパストラバーサル。10/16 KEV追加。FortiManager侵害・設定/秘密情報窃取と連鎖した実攻撃をUnit42が報告。500台超は設定情報対象で全台侵害とはしない。メーカー対象版・修正を確認。"}]},{"id":"v-gitlab-202610","product":"GitLab CE/EE","title":"CI/CD処理の認証前コード実行を含む重大修正","identifiers":["CVE-2026-97229","CVE-2026-16301","CVE-2026-14814","CVE-2026-96893"],"published":"2026-10-12","sourceUpdated":"2026-10-12","checked":"2026-10-18","updated":"2026-10-18","changeType":"新規追加","exploitation":"掲載した公式発表に悪用確認の記載なし","exploitationTone":"amber","priority":"対象の製品・版・構成を利用する場合に優先確認","conditions":"97229は19.2〜19.2.8未満、19.3〜19.3.5未満、19.4〜19.4.2未満。併載する別CVEは対象開始版・権限条件が異なるため、個別の公式表を照合。","impact":"CI/CD正規表現コンパイラーの問題は認証前のコード実行につながる可能性があり、CVSS 10.0。保護ブランチのパイプライン権限、変数、AIエージェント命令等の問題も同時修正。","fix":"自己管理型は系列に応じ19.4.2／19.3.5／19.2.8へ更新。GitLab.comとDedicatedは対応済み。データベース移行と正式な更新経路を確認。","investigation":"不審なパイプライン実行、権限・トークン・変数等への影響を調査し、必要時は秘密情報を更新。掲載公式発表が悪用未記載であることを、悪用がないとの保証にしない。","bcp":"単一ノードでは移行完了まで停止を伴う。開発・ビルド・配備・ロールバックの代替と更新時間を決める。","tech":"public","check":"ck-public","sources":[{"label":"GitLab｜重大修正・対象版・更新時の影響","url":"https://docs.gitlab.com/releases/patches/patch-release-gitlab-19-4-2-released/"}],"sourceNote":"メーカー・公的機関・調査実施元の本文を2026-10-18に確認。対策と悪用状況は情報更新日時点の整理。業務継続の観点は編集上の検討案。","change":"10/12公開。CI/CD正規表現処理の認証前RCE最大CVSS10.0他。自己管理型は19.4.2/19.3.5/19.2.8へ、脆弱性ごと対象開始版が異なる。GitLab.com/Dedicated対処済み。単一ノード更新停止の計画も記載。悪用確認の断定なし。","history":[{"date":"2026-10-18","type":"新規掲載","note":"10/12公開。CI/CD正規表現処理の認証前RCE最大CVSS10.0他。自己管理型は19.4.2/19.3.5/19.2.8へ、脆弱性ごと対象開始版が異なる。GitLab.com/Dedicated対処済み。単一ノード更新停止の計画も記載。悪用確認の断定なし。"}]},{"id":"v-linux-pwnescape-20261015","product":"Linuxカーネル／仮想化基盤","title":"PwnEscape：仮想マシンからホストへ影響する脆弱性","identifiers":["CVE-2026-99999"],"published":"2026-10-15","sourceUpdated":"2026-10-16","checked":"2026-10-17","exploitation":"悪用情報は継続確認","exploitationTone":"amber","priority":"該当構成・利用サービスを優先確認","conditions":"未修正のLinuxホストでKVM・virtio-net/TAP等を利用する仮想化構成が確認対象。AWSは、ゲストVM内で特権を持つ攻撃者によるホストへの影響を説明している。利用サービス名だけで適否を判断せず、ホストの構成と修正状況を提供元に確認する。","impact":"ホスト側のメモリ破損を通じ、ホストのメモリ情報の漏えいやサービス妨害につながる可能性。各サービスへの実際の影響範囲は各社の公表状況を確認する。","fix":"仮想化ホストを自ら管理する場合は、OSベンダーの対象条件・修正情報を照合し、案内に沿ってホストの更新・再起動を行う。クラウド・VPS等の利用者は、事業者が管理するホストの対応状況を確認する。ゲストOSの更新とホスト側の修正は分けて確認する。","investigation":"本カードで確認したさくら・ConoHaの告知から、実際の侵害・情報漏えいの発生までは確認していない。調査中・利用制限・確認された被害を区別し、不審な事象がある場合は記録を保全して事業者と確認する。","bcp":"既存サービスの稼働に加え、新規構築・増設・移行の制限、今後のホスト保守による停止の可能性を確認する。代替環境を必要時に確保できるか、バックアップからどこへ復元するか、切替・復帰の判断者を点検する。","tech":"supplier","techLabel":"委託先・依存関係の観点","check":"ck-supplier","updated":"2026-10-17","changeType":"新規","change":"Linuxカーネルの脆弱性CVE-2026-99999を追加。さくら・ConoHa等の公表状況、利用制限、ホスト側の対策と業務継続の確認事項を整理。","sourceNote":"Linux CNA、AWS、さくら、ConoHaの本文と、Xserverの公開ニュース・障害・保守情報を確認。下表は確認日時点の公表状況。配布HTMLには続報が自動反映されない。","classificationNote":"脆弱性情報・予防措置に伴うサービス影響として掲載。今回の告知だけを根拠に被害インシデント件数へ加算していません。","providerNote":"「調査中」は影響の確定ではなく、「公式公表未確認」は影響なしを意味しません。「既存サービスは稼働継続」という説明も、脆弱性の影響なしの公表とは区別します。","sources":[{"label":"Linux CNA｜CVE公式レコード","url":"https://raw.githubusercontent.com/CVEProject/cvelistV5/main/cves/2026/99xxx/CVE-2026-99999.json"},{"label":"AWS｜影響対象とホスト側の修正","url":"https://aws.amazon.com/security/security-bulletins/2026-137-aws/"},{"label":"さくら｜対象サービス・影響調査","url":"https://www.sakura.ad.jp/corporate/information/announcements/2026/10/16/1968226051/"},{"label":"ConoHa｜影響調査の公式発表","url":"https://vps.conoha.jp/news/?ap=2015054877\u0026btn_id=top--news_news"}],"providers":[{"id":"sakura-cloud","provider":"さくらのクラウド","shortLabel":"さくらのクラウド","status":"調査中・一部機能制限","tone":"amber","sourceAsOf":"2026-10-16","checked":"2026-10-17","finding":"新規プロジェクト作成を一時停止。既存プロジェクトは利用継続でき、今回の作成停止による既存リソースの稼働への影響はないと説明。ホスト保守を実施する可能性あり。","action":"プロジェクト新設を伴う構築・復旧計画と、保守対象・停止予定を確認。新規プロジェクトが必要な専用サーバPHY・高火力PHYの申込にも制約。","sources":[{"label":"さくらのクラウド｜利用制限・対応状況","url":"https://cloud.sakura.ad.jp/news/2026/10/16/cve-2026-99999/"}]},{"id":"sakura-vps","provider":"さくらのVPS","status":"調査中・一部機能制限","tone":"amber","sourceAsOf":"2026-10-16 18:10 JST更新","checked":"2026-10-17","finding":"全リージョンで新規申込、スケールアップ、持ち込みISOインストール、さくらのクラウドへの移行機能を停止。既存契約は通常稼働と説明。再開時期未定。","action":"増設・移行が必要な業務と代替方法を確認。今後のホスト保守の案内も確認。","sources":[{"label":"さくらのVPS｜停止機能・対応状況","url":"https://vps.sakura.ad.jp/contents/info/202610-pendingapply/"}]},{"id":"sakura-rental","provider":"さくらのレンタルサーバ・メール専用・マネージドサーバ","status":"調査中・新規受付停止","tone":"amber","sourceAsOf":"2026-10-16","checked":"2026-10-17","finding":"告知記載のレンタル、メール専用、マネージドの各対象プランで新規申込を停止。既存契約は通常稼働と説明。再開時期未定。","action":"Web・メールの契約プランを告知の対象一覧と照合し、新規契約が必要な復旧・切替計画への影響を確認。","sources":[{"label":"さくら｜レンタル・メール・マネージドの受付停止","url":"https://help.sakura.ad.jp/notification/n-2696/"}]},{"id 内されていない。 76519はContent Scanner Tools 25.3.0.5525以降への更新（再起動不要）または対応AsyncOSを確認。クラウド版は提供元が更新を実施。","investigation":"侵害が疑われる場合は更新前にCisco TACと証拠保全を相談。侵害済み仮想機は公式の再構築・設定再利用の制限・資格情報更新の案内を確認する。クラスタ内の全機器を確認対象とし、更新だけで安全を確定しない。","bcp":"メール停止時の連絡経路、滞留メールの扱い、代替運用を確認する。","tech":"public","sources":[{"label":"JPCERT/CC｜対象・対策・調査","url":"https://www.jpcert.or.jp/at/2026/at260027.html"},{"label":"メーカー案内（JPCERTから参照）","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-inj-2bLVGmhX"},{"label":"Cisco｜76519の条件・更新・侵害対応","url":"https://sec.cloudapps.cisco.com/security/center/content/CiscoSecurityAdvisory/cisco-sa-esa-afw-zqYJkjxp"}],"updated":"2026-10-18","changeType":"続報・追加","change":"CVE-2026-76519を追加。AMP機能・スキャナー版の対象条件、添付経由の悪用、更新と侵害調査を追記。","sourceNote":"既存76461はJPCERT/CCを10/17に確認。追加76519はCisco公式本文を10/18に確認。2件の成立条件・対策を分けて確認する。","issues":[{"id":"CVE-2026-76461","conditions":"AsyncOSの系列別対象版（従前のSQLインジェクション）","status":"悪用確認の公表あり","fix":"AsyncOS修正版。既存のJPCERT/CC・Cisco表を照合。"},{"id":"CVE-2026-76519","conditions":"AMP File Reputationの該当設定＋Content Scanner Tools 25.3.0.5525未満","status":"悪用確認の公表あり","fix":"Content Scanner Tools 25.3.0.5525以降等。侵害疑い時は先に保全を相談。"}]}],"actors":[{"id":"actor-scattered","name":"Scattered Spider","referenceId":"G1015","type":"金銭目的の攻撃グループ","summary":"ヘルプデスク等へのなりすましを含むソーシャルエンジニアリングや、ID・クラウド環境の悪用が報告されている。","patterns":["サポート担当を名乗る誘導","認証・MFA復旧手続きの悪用","管理権限やクラウド環境への展開"],"checks":["本人確認とMFA再登録の手続きを点検する","管理者・認証方式・アプリ等の変更を追えるか確認する"],"techs":["identity","phishing","remote"],"checked":"2026-10-17","sources":[{"label":"MITRE ATT\u0026CK｜G1015","url":"https://attack.mitre.org/groups/G1015/"}]},{"id":"actor-volt","name":"Volt Typhoon","referenceId":"G1017","type":"重要インフラへの活動が報告されたアクター","summary":"米国等の重要インフラを狙い、正規の管理機能や盗用した認証情報を利用して、活動を目立たせない手口が報告されている。","patterns":["正規管理ツールを利用","認証情報の悪用","長期の潜伏・アクセス維持"],"checks":["通常の管理操作と不審な操作を区別できる記録を確認する","端末以外のネットワーク機器・管理経路も点検する"],"techs":["identity","public"],"checked":"2026-10-17","sources":[{"label":"MITRE に実施できる範囲でネットワークから切り離す。重要基盤の停止・広範囲の遮断は責任者と影響を判断する。","role":"担当者／広範囲は責任者判断"},{"title":"安全な経路で責任者・専門家へ連絡する","detail":"侵害が疑われるメールやチャット以外の手段も使い、発見時刻・症状・対象を伝える。","role":"担当者が確認"},{"title":"被害を免れたバックアップと記録を保護する","detail":"保護・退避や同期等の扱いを担当者と判断する。画面・時刻・操作記録を安全な方法で残す。","role":"担当者・専門家が判断"}],"avoid":["自己判断で初期化・復元・大量削除を進めない。再起動・電源操作も証拠と被害の状況を踏まえて判断する。","脅迫文の連絡先への返信・支払いや、未確認の復号ツール実行を独断で進めない。"],"next":[{"title":"影響範囲を整理する","detail":"端末だけでなく認証・サーバー・クラウド・保守接続を含め、分かる範囲と未確認を分ける。","role":"担当者が確認"},{"title":"重要業務の代替運用を判断する","detail":"業務責任者と、止まる業務・期限・代替手段を確認する。","role":"責任者・業務部門が判断"},{"title":"安全な復旧の条件をそろえる","detail":"侵入原因、残存アクセス、復元元の安全性、再接続後の監視を確認する。","role":"専門家・責任者が判断"}],"decisions":["隔離範囲の拡大と業務影響","外部支援の依頼","代替運用・復旧順・再開の承認"],"checks":["ck-backup","ck-bcp","ck-command"],"sources":[{"label":"JPCERT/CC｜侵入型ランサムウェアFAQ","url":"https://www.jpcert.or.jp/magazine/security/ransom-faq.html"},{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"}],"reviewed":"2026-10-17"},{"id":"account","title":"不審なログイン・アカウント悪用","subtitle":"身に覚えのない認証、送信・転送・権限変更など","first":[{"title":"安全な管理経路と対象アカウントを確認する","detail":"通知中のリンクを使わず、既知の管理画面と安全な端末から状況を確認する。","role":"担当者が確認"},{"title":"不正アクセスを止める対応を行う","detail":"権限のある担当者が影響を判断し、対象の利用停止・セッション失効等を行う。重要な管理アカウントでは代替管理手段も確認する。","role":"権限のある担当者が判断・実施"},{"title":"認証・監査記録と変更内容を残す","detail":"対象、時刻、認証方式、送信・転送・権限等の情報を保全する。被害抑制と並行して実施する。","role":"担当者が確認"}],"avoid":["パスワードを変えただけで対応完了としない。","侵害が疑われるアカウントや端末から機微な対応情報を共有しない。"],"next":[{"title":"認証・アクセス設定を点検する","detail":"必要な資格情報変更と、認証方式・権限・アプリ・転送ルール等の不正変更への対処を確認する。","role":"担当者・専門家が実施"},{"title":"影響した情報・送信先・サービスを調べる","detail":"関連するクラウドやメールの操作記録を確認する。","role":"担当者が確認"},{"title":"利用再開と周知を判断する","detail":"安全な状態の確認と、対象者への連絡・不正送信への対応を行う。","role":"責任者が判断"}],"decisions":["管理者侵害時の対応体制","対象アカウントの停止・再開","不正送信先・利用者への通知"],"checks":["ck-identity","ck-command"],"sources":[{"label":"Microsoft｜侵害されたメールアカウントへの対応","url":"https://learn.microsoft.com/en-us/defender-office-365/responding-to-a-compromised-email-account"},{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"}],"reviewed":"2026-10-17"},{"id":"leak","title":"情報漏えい・誤送信・誤共有の疑い","subtitle":"公開・閲覧・取得の可能性を区別する","first":[{"title":"拡大につながる公開・共有を抑える","detail":"権限のある担当者が設定と影響を確認し、対象共有等を制限する。公開状態と操作時刻を記録する。","role":"担当者が確認"},{"title":"対象・期間・閲覧範囲を記録する","detail":"情報項目、対象ファイル、公開期間、閲覧・取得の確認可否を分ける。","role":"担当者が確認"},{"title":"責任者・情報管理担当へ連絡する","detail":"確認された事実と未確認事項を分け、法務・広報等を含む対応体制につなぐ。","role":"担当者が確認"}],"avoid":["調査に必要な記録や対象を一括削除しない。","可能性の段階で、流出件数・原因・攻撃者を断定して周知しない。"],"next":[{"title":"事実確認と被害抑制を継続する","detail":"アクセス記録・宛先・提供元の情報から対象を確認する。","role":"担当者が確認"},{"title":"通知・報告の要否と期限を確認する","detail":"適用法令・契約・情報の性質を踏まえ、情報管理・法務等が公式資料で判断する。","role":"情報管理・法務・責任者が判断"},{"title":"再発防止と継続的な案内を行う","detail":"権限・送信・保管の見直しと、続報窓口を整理する。","role":"担当者が確認"}],"decisions":["本人通知・当局報告等の判断","公開停止・利用制限の範囲","対外説明と訂正の承認"],"checks":["ck-data","ck-command"],"sources":[{"label":"個人情報保護委員会｜漏えい等の対応","url":"https://www.ppc.go.jp/personalinfo/legal/leakAction/"},{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"}],"reviewed":"2026-10-17"},{"id":"phishing","title":"不審な連絡・入力・遠隔操作・送金","subtitle":"何を行ったかに応じて初動を分ける","first":[{"title":"追加の入力・承認・操作を止めて報告する","detail":"不審な相手とのやり取りを止め、既知の社内窓口に連絡する。調査のために再びリンクを開かない。","role":"担当者が確認"},{"title":"実施した操作を確認する","detail":"閲覧のみ／ID等を入力／認証を承認／添付を実行／遠隔操作を許可／送金を実施、を分けて記録する。","role":"担当者が確認"},{"title":"操作に応じた担当へつなぐ","detail":"入力・承認はアカウント対応、実行・遠隔操作は端末調査。送金済みは財務責任者を通じ金融機関等へ至急相談する。","role":"情報システム・財務等が判断"}],"avoid":["確認のために添付ファイルを再実行しない。","利用者を責めて報告を遅らせない。"],"next":[{"title":"原本・時刻・対象を安全に保全する","detail":"メール原本・表示情報・端末・アカウント・操作内容を集める。","role":"担当者が確認"},{"title":"関連する侵害の確認を進める","detail":"端末・認証・送信の記録を照合し、必要な隔離や認証対応を判断する。","role":"担当者・専門家が判断"},{"title":"同様の連絡への注意を周知する","detail":"確認済みの特徴と、してほしい行動・通報先を案内する。","role":"担当者が確認"}],"decisions":["端末の隔離・アカウント制限","送金先への組織的な対応","同一の連絡を受けた人への周知"],"checks":["ck-people","ck-identity"],"sources":[{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"},{"label":"Microsoft｜侵害されたメールアカウントへの対応","url":"https://learn.microsoft.com/en-us/defender-office-365/responding-to-a-compromised-email-account"},{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"}],"reviewed":"2026-10-17"},{"id":"web","title":"Web改ざん・公開サーバーの侵害","subtitle":"異常な表示、不審ファイル、侵害の通知など","first":[{"title":"影響する公開・接続を制限する","detail":"サービス責任者と、対象公開の停止・制限や保守接続の扱いを判断する。","role":"責任者・担当者が判断"},{"title":"変更前の状態・ログを保全する","detail":"表示、変更ファイル、認証・アクセス記録、構成を安全に記録する。","role":"担当者が確認"},{"title":"保守会社・専門家と調査を開始する","detail":"対象サイトだけでなく同居環境・管理者・連携先への影響を確認する。","role":"担当者が確認"}],"avoid":["改ざん箇所を消しただけで再公開しない。","疑わしいファイルを通常の業務端末で開いたり実行したりしない。"],"next":[{"title":"原因と残存アクセスを調べる","detail":"利用製品・更新状況・権限・不審な接続や設定変更を確認する。","role":"担当者が確認"},{"title":"業務と利用者への案内を整える","detail":"代替ページ・受付経路等を業務責任者と調整する。","role":"担当者が確認"},{"title":"安全な復旧・再公開を判断する","detail":"原因対処、復元元、動作・権限・監視を確認する。","role":"専門家・責任者が判断"}],"decisions":["公開停止・代替公開","他サイト・データへの影響範囲","再公開の承認"],"checks":["ck-public","ck-backup","ck-command"],"sources":[{"label":"JPCERT/CC｜国内組織の不正アクセスへの注意喚起","url":"https://www.jpcert.or.jp/at/2026/at260030.html"},{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"}],"reviewed":"2026-10-17"},{"id":"outage","title":"システム停止・認証障害・原因不明","subtitle":"攻撃と断定せず、業務影響と原因を並行して確認する","first":[{"title":"影響範囲と業務上の期限を確かめる","detail":"単一端末・拠点・サービス・全体のどこまで影響するかを整理し、止まる重要業務を確認する。","role":"担当者が確認"},{"title":"既知の窓口と別の連絡経路を確保する","detail":"担当者・提供元と連絡し、公式障害情報、直前の変更、依存先の状態を照合する。","role":"担当者が確認"},{"title":"状況と実施操作を記録する","detail":"発見時刻、症状、監視・変更の記録、調査した範囲を残す。不審な兆候があれば該当する侵害対応へ進む。","role":"担当者が確認"}],"avoid":["影響を確認せず基盤全体の再起動・構成変更を繰り返さない。","停止だけを根拠にサイバー攻撃や情報漏えいを断定しない。"],"next":[{"title":"代替運用の開始を判断する","detail":"期限、復旧見込み、代替手段の実行可能性を業務責任者と確認する。","role":"責任者・業務部門が判断"},{"title":"復旧の依存関係と優先順位を整理する","detail":"認証・DNS・ネットワーク・外部サービスなどの前提と変更内容を確認する。","role":"担当者が確認"},{"title":"業務確認後に再開する","detail":"動作、データ整合性、滞留処理、利用者への周知を確認する。","role":"業務・システム責任者が判断"}],"decisions":["停止継続・代替運用への切替","切戻し・復旧順","業務再開の承認"],"checks":["ck-bcp","ck-command"],"sources":[{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"}],"reviewed":"2026-10-17"},{"id":"supplier","title":"利用サービス・委託先からの被害連絡","subtitle":"提供元の事実と自組織への該当を確認する","first":[{"title":"正当な連絡か既知の窓口で確認する","detail":"通知中のリンクだけに頼らず、契約時等の既知の連絡先・公式情報から確認する。","role":"担当者が確認"},{"title":"自組織の利用・データ・接続関係を調べる","detail":"対象サービス、契約、利用部署、預託情報、連携キーや保守接続を確認する。","role":"担当者が確認"},{"title":"責任者と提供元に未確認事項を確認する","detail":"対象期間・情報項目・停止範囲・必要な措置を記録し、公式続報の窓口を決める。","role":"担当者が確認"}],"avoid":["取引があるだけで、自組織の全情報が流出したと断定しない。","業務影響を確認せず連携キーや接続を一律に止めない。"],"next":[{"title":"提供元の要請と自組織の対策を照合する","detail":"必要な制限・キー変更等を担当者が調整し、事実と確認待ちを分ける。","role":"担当者が確認"},{"title":"利用者への案内と通知・報告を判断する","detail":"対象となる情報・影響に応じて情報管理・法務・広報等と調整する。","role":"責任者・関係部署が判断"},{"title":"停止中の業務と復旧後の確認を決める","detail":"代替運用、再連携、データ整合性、滞留処理を確認する。","role":"担当者が確認"}],"decisions":["接続・利用制限の必要性","利用者への案内・通知","代替運用と連携再開"],"checks":["ck-supplier","ck-data","ck-bcp"],"sources":[{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"label":"個人情報保護委員会｜漏えい等の対応","url":"https://www.ppc.go.jp/personalinfo/legal/leakAction/"},{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"}],"reviewed":"2026-10-17"}],"noticeTypes":[{"id":"general","title":"不審な連絡への注意","techs":["phishing","identity","remote"],"ir":"phishing","user":"不審なメール・SMS・電話等では、リンクからの認証情報入力、認証要求の承認、遠隔操作の許可を行わないでください。確認は普段利用している公式画面または既知の連絡先から行ってください。操作した可能性がある場合は、受信時刻と実施した操作を添えて情報システム窓口へ連絡してください。","it":"対象者が受けた連絡と実施操作を確認し、認証・端末・送信の記録を照合してください。関連する認証方式、権限、転送等の変更を点検し、影響範囲と追加対応の必要性を報告してください。"},{"id":"supplier","title":"外部サービスの被害公表","techs":["supplier"],"ir":"supplier","user":"該当サービスを利用している方は、公式通知と自組織からの案内を確認してください。被害に便乗した連絡で認証情報や認証コードを伝えず、普段利用している公式画面や既知の窓口から確認してください。個別の対象者や必要な対応は、確認できた内容に基づいて別途ご案内します。","it":"利用部署・契約・預託データ・接続関係を照合し、自組織への影響を確認してください。提供元へ対象期間・情報項目・停止範囲・必要な措置を確認し、未確認事項と業務影響を整理してください。接続やキーの変更は業務影響を踏まえて判断してください。"},{"id":"vuln","title":"脆弱性の影響確認・更新依頼","techs":["public","api"],"ir":"web","user":"対象端末・サービスの更新や再起動について、情報システム部門から案内があった場合は指定された方法で対応してください。案内を装ったメールから不明な更新プログラムを実行せず、判断に迷う場合は既知の窓口に確認してください。","it":"製品・バージョン・機能・公開範囲を公式の対象条件と照合してください。該当する場合は、必要な保全・侵害調査、修正・回避策、停止影響・切戻しを検討し、確認結果と対応予定を報告してください。対象不明の場合も、確認に必要な情報を明記してください。"},{"id":"leak","title":"誤共有・漏えいの疑いへの案内","techs":["sharing","api"],"ir":"leak","user":"対象の情報や不審な共有に気付いた場合は、必要以上に閲覧・転送・保存を広げず、情報管理・情報システム窓口へ連絡してください。対象者や影響については、確認された情報に基づいて案内します。","it":"公開・共有の範囲、情報項目、期間、閲覧・取得の確認可否を整理してください。被害拡大を抑える対応と記録の保全を進め、通知・報告の要否は情報管理・法務等へ判断を依頼してください。"},{"id":"outage","title":"サービス停止・代替運用の案内","techs":["outage","ransom","supplier"],"ir":"outage","user":"対象サービスが利用できない場合は、現在案内している代替手段を利用してください。自己判断で同じ処理や申請を繰り返さず、期限のある業務は担当窓口へ連絡してください。原因・復旧見込みは確認でき次第ご案内します。","it":"影響範囲、重要業務と期限、依存先、直前の変更、提供元の公式情報を整理してください。原因未確定の事項を分けて報告し、代替運用、復旧順、再開確認を業務責任者と調整してください。"}],"resources":[{"label":"JPCERT/CC｜侵入型ランサムウェアFAQ","url":"https://www.jpcert.or.jp/magazine/security/ransom-faq.html"},{"label":"NIST｜SP 800-61 Rev.3","url":"https://csrc.nist.gov/pubs/sp/800/61/r3/final"},{"label":"IPA｜情報セキュリティ対策ガイドライン・付録","url":"https://www.ipa.go.jp/security/guide/sme/about.html"},{"label":"経済産業省｜インシデント対応の手引き","url":"https://www.meti.go.jp/policy/netsecurity/sme_incident.html"},{"label":"Microsoft｜侵害されたメールアカウントへの対応","url":"https://learn.microsoft.com/en-us/defender-office-365/responding-to-a-compromised-email-account"},{"label":"個人情報保護委員会｜漏えい等の対応","url":"https://www.ppc.go.jp/personalinfo/legal/leakAction/"},{"label":"JPCERT/CC｜国内組織の不正アクセスへの注意喚起","url":"https://www.jpcert.or.jp/at/2026/at260030.html"},{"label":"JVN iPedia｜脆弱性対策情報","url":"https://jvndb.jvn.jp/"},{"label":"CISA｜Known Exploited Vulnerabilities","url":"https://www.cisa.gov/ hlights":[{"kind":"incident","id":"inc-333a2dbe9b"},{"kind":"incident","id":"inc-0aa91af2ec"},{"kind":"vuln","id":"v-beyondtrust-202610"},{"kind":"vuln","id":"v-ivanti-202610"},{"kind":"vuln","id":"v-gitlab-202610"}]}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('app-data').textContent);
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=v=>{try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:'#';}catch(_){return '#';}};
const link=(s)=>'<a href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+' ↗</a>';
const sources=arr=>'<div class="sources">'+(arr||[]).map(link).join('')+'</div>';
const badge=(v,c='')=>'<span class="badge '+c+'">'+esc(v)+'</span>';
const tags=arr=>(arr||[]).map(v=>badge(v)).join('');
const btn=(text,attrs='',cls='')=>'<button class="btn '+cls+'" '+attrs+'>'+esc(text)+'</button>';
const bullets=arr=>'<ul>'+(arr||[]).map(v=>'<li>'+esc(v)+'</li>').join('')+'</ul>';
const byId=(arr,id)=>arr.find(x=>x.id===id);
const caseById=id=>byId(DATA.incidents,id);
const techById=id=>byId(DATA.techniques,id);
const countBy=(rows,getter)=>{const o={};for(const r of rows){const vs=getter(r);for(const v of Array.isArray(vs)?[...new Set(vs)]:[vs])if(v)o[v]=(o[v]||0)+1;}return Object.entries(o).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'ja'));};
const defaultFilters=()=>({basis:'date',start:'',end:'',industry:'',cat:'',status:'',q:'',theme:'',sensitive:'',secondary:'',group:'',updates:false});
const state={view:'home',filters:defaultFilters(),sort:'new',page:0,pageSize:20,grouped:false,
 threatTab:'vulnerabilities',checkId:'',checkAnswers:{},checkNotes:{},noticeType:'general',noticeAudience:'user',
 noticeReference:null,noticeText:'',noticeContact:'',noticeScope:'',irId:'',irChecks:{},irMemos:{},caseId:''};
const views=['home','incidents','bi','threats','checks','notices'];
const dateLabel={date:'公表日（初回等）',sourceUpdated:'続報・情報日',updated:'一覧反映日'};
const basisNote=r=>r.dateBasis?(typeof r.dateBasis==='string'?r.dateBasis:'続報日（初回未確認）'):'';
const infoPatterns={'パスワード':/パスワード/,'カード情報':/カード(情報|番号|有効期限|の一部)/,'本人確認書類':/免許証|本人確認|パスポート/,'マイナンバー':/マイナンバー/,'銀行口座':/口座/,'鍵情報':/鍵情報|APIキー|トークン|復号鍵|メール送信キー/,'健康・機微情報':/体温|年収|健康|病歴|要配慮|タイプ診断|身長|体重|医療/};
function sensitiveOf(r){if(/流出なし|流出痕跡なし|漏えい事実未確認/.test(r.status))return [];const text=r.info.split(/(?<=[。])/).filter(s=>!/(対象外|含まれない|保有していない|未確認|発生していない|とは別|ではない)/.test(s)).join('');return Object.entries(infoPatterns).filter(([k,re])=>re.test(text)).map(([k])=>k);}
function validDate(s){return /^\d{4}-\d{2}-\d{2}$/.test(s||'');}
function themesOf(r){return DATA.caseLinks[r.id]?.techs||[];}
function filterRows(rows=DATA.incidents,f=state.filters){
 const q=f.q.trim().toLocaleLowerCase();
 if(f.start&&f.end&&f.start>f.end)return [];
 return rows.filter(r=>{
  const d=r[f.basis]||'';
  return (!f.start||(validDate(d)&&d>=f.start))&&(!f.end||(validDate(d)&&d<=f.end))&&
   (!f.industry||r.industry===f.industry)&&(!f.cat||(r.cat||[]).includes(f.cat))&&
   (!f.status||r.status===f.status)&&(!f.theme||themesOf(r).includes(f.theme))&&(!f.sensitive||sensitiveOf(r).includes(f.sensitive))&&
   (!f.secondary||r.secondary?.status===f.secondary)&&(!f.group||r.group===f.group)&&
   (!f.updates||r.updated===DATA.meta.incidentSnapshotDate)&&
   (!q||[r.org,r.info,r.impact,r.scope,r.note,r.change,r.action,(r.cat||[]).join(' ')].join(' ').toLocaleLowerCase().includes(q));
 });
}
function sortedRows(rows){
 return [...rows].sort((a,b)=>state.sort==='org'?a.org.localeCompare(b.org,'ja'):
  state.sort==='old'?(a[state.filters.basis]||'').localeCompare(b[state.filters.basis]||''):
  (b[state.filters.basis]||'').localeCompare(a[state.filters.basis]||'')||a.org.localeCompare(b.org,'ja'));
}
function aggregateCount(rows){return new Set(rows.map(r=>r.group?'group:'+r.group:'id:'+r.id)).size;}
function selectedRows(){return sortedRows(filterRows());}
function head(kicker,title,sub,tools=''){return '<div class="page-head"><div><div class="eyebrow">'+esc(kicker)+'</div><h1>'+esc(title)+'</h1><p class="lead">'+esc(sub)+'</p></div><div class="tools no-print">'+tools+'</div></div>';}
function kpis(rows){const confirmed=rows.filter(r=>['漏えい確認','一部漏えい確認','不正閲覧確認','不正照会確認'].includes(r.status)).length;
 return '<div class="kpis">'+[
  [rows.length,'掲載項目','項目'],[aggregateCount(rows),'関連集約キー','キー'],
  [confirmed,'漏えい・不正閲覧等確認','項目'],[rows.filter(r=>(r.cat||[]).includes('サービス停止')).length,'サービス停止の分類あり','項目']
 ].map(x=>'<div class="kpi"><div class="label">'+x[1]+'</div><div class="value">'+x[0]+'<span class="unit">'+x[2]+'</span></div></div>').join('')+'</div>';}
function renderHome(){
 const updates=DATA.incidents.filter(r=>r.updated===DATA.meta.incidentSnapshotDate).sort((a,b)=>(b.sourceUpdated||b.date).localeCompare(a.sourceUpdated||a.date));
 const vulnUpdates=DATA.vulnerabilities.filter(v=>v.updated===DATA.meta.compiledDate).sort((a,b)=>b.sourceUpdated.localeCompare(a.sourceUpdated));

function referenceValue(){return state.noticeReference?(state.noticeReference.kind==='vuln'?'v:':'i:')+state.noticeReference.id:'';}
function buildNotice(){
 const t=byId(DATA.noticeTypes,state.noticeType)||DATA.noticeTypes[0];
 let title='【'+(state.noticeAudience==='it'?'点検依頼':'注意喚起')+'】'+t.title;
 let reference='参考となる個別の事例は選択していません。';
 if(state.noticeReference?.kind==='incident'){
  const r=caseById(state.noticeReference.id);
  if(r){title+='（参考：'+r.org+'）';reference='参考事例：'+r.org+'\n公表日（初回等）：'+r.date+(r.dateBasis?'（'+basisNote(r)+'）':'')+'\n元資料の確認状況：'+r.status+'\n参考となる経緯：'+r.impact+'\n出典：'+(r.sources||[]).map(s=>s.url).join('\n');}
 }else if(state.noticeReference?.kind==='vuln'){
  const v=byId(DATA.vulnerabilities,state.noticeReference.id);
  if(v){title+='（'+v.product+'）';reference='参考情報：'+v.product+'／'+v.identifiers.join('・')+'\n対象条件の要約：'+v.conditions+'\n情報更新日：'+v.sourceUpdated+'／本資料での本文確認：'+v.checked+'\n出典：'+v.sources.map(s=>s.url).join('\n');}
 }
 return title+'\n\n'+(state.noticeScope||'[対象部署・利用者・サービス等を記入]')+' 各位\n\n公開情報を参考に、'+(state.noticeAudience==='it'?'以下の確認をお願いします。':'以下についてご注意・ご確認ください。')+'\nこの案内は予防・確認のためのものであり、自組織の被害発生を示すものではありません。\n\n'+
  '■お願いしたいこと\n'+(state.noticeAudience==='it'?t.it:t.user)+'\n\n■自組織で確認された事項\n[確認済みの事実、対象範囲、必要な対応・期限を記入。未確認は未確認と明記]\n\n■参考にした公開情報\n'+reference+
  '\n\n■連絡先\n'+(state.noticeContact||'[自組織の既知の窓口・連絡方法を記入]')+'\n\n■次回の案内\n[必要に応じて案内時刻・確認方法を記入]\n\n※送付前に、自組織の確認状況・対象・依頼事項・連絡先を確認し、不要な記述と記入欄を削除してください。';
}

async function copyText(text){
 let copied=false;
 if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);copied=true;}catch(_){}}
 try{
  if(!copied){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='0';ta.style.left='0';ta.style.width='1px';ta.style.height='1px';ta.style.opacity='0';const host=document.querySelector('dialog[open]')||document.body;host.appendChild(ta);try{ta.select();if(!document.execCommand('copy'))throw Error('copy unavailable');}finally{ta.remove();}}
  toast('コピーしました');
 }
 catch(_){toast('コピーできませんでした。表示された文章を選択してコピーするか、テキスト保存を利用してください。');}
}

 if(el.id==='check-select'){state.checkId=el.value;renderChecks();return;}

 if(d.irCheck){
  if(el.checked)state.irChecks[d.irCheck]=nowJst();else delete state.irChecks[d.irCheck];
  const row=el.closest('.ir-step');row.classList.toggle('step-checked',el.checked);row.querySelector('.ir-checked-at').textContent=el.checked?'チェック時刻 '+state.irChecks[d.irCheck]:'';
  const p=byId(DATA.playbooks,state.irId),total=p.first.length+p.next.length,done=[...p.first.map((_,i)=>p.id+':first:'+i),...p.next.map((_,i)=>p.id+':next:'+i)].filter(k=>state.irChecks[k]).length;
  $('ir-progress').textContent='確認チェック '+done+' / '+total+'（対応完了の判定ではありません）';return;
 }
 const noticeMap={'notice-type':'noticeType','notice-audience':'noticeAudience','notice-scope':'noticeScope','notice-contact':'noticeContact'};
 if(noticeMap[el.id]){state[noticeMap[el.id]]=el.value;$('notice-rebuild-hint').hidden=false;return;}
 if(el.id==='notice-reference'){const [kind,id]=el.value.split(':');state.noticeReference=id?{kind:kind==='v'?'vuln':'incident',id}:null;$('notice-rebuild-hint').hidden=false;}
});
let searchTimer;
document.addEventListener('input',e=>{
 const el=e.target,d=el.dataset;
 if(d.filter==='q'){state.filters.q=el.value;state.page=0;clearTimeout(searchTimer);searchTimer=setTimeout(renderDataViews,120);}
 if(d.checkNote)state.checkNotes[d.checkNote]=el.value;
 if(el.id==='ir-memo-text')state.irMemos[state.irId]=el.value;
 if(el.id==='notice-text')state.noticeText=el.value;
 if(el.id==='notice-scope'){state.noticeScope=el.value;$('notice-rebuild-hint').hidden=false;}
 if(el.id==='notice-contact'){state.noticeContact=el.value;$('notice-rebuild-hint').hidden=false;}
});
window.addEventListener('afterprint',()=>document.body.classList.remove('print-dialog'));
function handleHash(){
 let hash='';try{hash=decodeURIComponent(location.hash.slice(1));}catch(_){}
 if(hash.startsWith('incident/')){if(state.view!=='incidents')go('incidents',false);showCase(hash.slice(9));}
 else if(hash.startsWith('ir/'))showEmergency(hash.slice(3));
 else if(views.includes(hash)){if(hash!==state.view)go(hash,false);}
}
window.addEventListener('hashchange',handleHash);
$('edition').innerHTML='事例基準 '+esc(DATA.meta.incidentSnapshotDate)+'<br>技術確認 '+esc(DATA.meta.technicalReviewed)+' ／ v'+esc(DATA.meta.version);
const ageDays=Math.floor((Date.now()-Date.parse(DATA.meta.compiledDate+'T00:00:00+09:00'))/86400000);
if(ageDays>7){$('stale-banner').textContent='この配布版の生成から'+ageDays+'日経過しています。個々の情報確認日と公式の最新情報を確認してください。';$('stale-banner').hidden=false;}
renderView();handleHash();
window.__BCP_HUB__={DATA,state,filterRows,aggregateCount,incidentCsv,csvCell,buildNotice,irRecord,renderView,renderEmergency,showCase,go,showEmergency,focusTech,focusVuln,renderChecks,renderNotices,renderBi,renderThreats};
